# Workspaces pnpm do monorepo. Pastas sem package.json são ignoradas.
# tools/codegen fica de fora de propósito: é um pacote isolado, com pnpm-workspace.yaml e
# pnpm-lock.yaml próprios, instalado por packages/contracts/Makefile. Se entrasse aqui, o
# `pnpm install --frozen-lockfile` da raiz exigiria o importer dele neste lockfile.
packages:
  - apps/*
  - packages/*
  - sdks/typescript
  - '!tools/**'

# Scripts de instalação permitidos (o pnpm bloqueia os demais). esbuild e sharp só
# validam o binário nativo que já chega como dependência opcional.
onlyBuiltDependencies:
  - esbuild
  - sharp

# Patched transitive tooling dependencies; see docs/auditoria-local.md.
overrides:
  'basic-ftp@<=6.2.0': 6.2.1
  'glob@>=9 <=14.0.1': 14.0.2
  'minimatch@>=7 <11.0.1': 11.0.1
