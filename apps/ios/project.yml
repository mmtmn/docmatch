# XcodeGen spec of the iOS app (xcodegen generate → Docmatch.xcodeproj, not versioned).
# Everything that changes per environment is a build setting: DOCMATCH_API_BASE_URL (Debug: the
# Mac's `make local`; Release: given by make release from the Terraform outputs),
# DOCMATCH_GOOGLE_IOS_CLIENT_ID (empty hides the Google button) and DEVELOPMENT_TEAM (signing).
name: Docmatch
options:
  bundleIdPrefix: br.com.docmatch
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pt-BR
  createIntermediateGroups: true
packages:
  DocmatchKit:
    path: DocmatchKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Docmatch:
    type: application
    platform: iOS
    sources:
      - path: Docmatch
      # The same pt-BR texts as the site and Android, read at runtime by DocmatchKit's Texts.
      - path: ../../packages/locales/pt-BR.json
        buildPhase: resources
    dependencies:
      - package: DocmatchKit
    # A shared scheme, so `xcodebuild -scheme Docmatch` (make app, the ios workflow) finds it.
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.docmatch
        INFOPLIST_FILE: Docmatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: Docmatch/Docmatch.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DOCMATCH_GOOGLE_IOS_CLIENT_ID: ""
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: br.com.docmatch.debug
          DOCMATCH_API_BASE_URL: http://localhost:8080
          DOCMATCH_ALIAS_LOOPBACK: "YES"
        Release:
          DOCMATCH_API_BASE_URL: ""
          DOCMATCH_ALIAS_LOOPBACK: "NO"
