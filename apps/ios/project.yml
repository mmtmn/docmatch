# XcodeGen spec of the iOS app (xcodegen generate → Docmatch.xcodeproj, not versioned).
# Everything that changes per environment is a build setting: DOCMATCH_API_BASE_URL (Debug: the
# Mac's `make local`; Release: given by make release from the Terraform outputs),
# DOCMATCH_GOOGLE_IOS_CLIENT_ID (empty hides the Google button) and DEVELOPMENT_TEAM (signing).
name: Docmatch
options:
  bundleIdPrefix: br.com.docmatch
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pt-BR
  createIntermediateGroups: true
packages:
  DocmatchKit:
    path: DocmatchKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DOCMATCH_APP_GROUP: group.br.com.docmatch.extensions
    DOCMATCH_EXTENSION_SCHEME: br.com.docmatch.extension
  configs:
    Debug:
      DOCMATCH_APP_GROUP: group.br.com.docmatch.extensions.local
      DOCMATCH_EXTENSION_SCHEME: docmatch-extension-dev
targets:
  Docmatch:
    type: application
    platform: iOS
    preBuildScripts:
      - name: Check Safari release configuration
        script: |
          if [ "$CONFIGURATION" = Release ] && [ "$(plutil -extract local raw -o - "$SRCROOT/../extensions/safari/Web/docmatch-native.json")" != false ]; then
            echo "error: Generate the production extension resources before archiving."
            exit 1
          fi
        inputFiles: ["$(SRCROOT)/../extensions/safari/Web/docmatch-native.json"]
        basedOnDependencyAnalysis: false
    sources:
      - path: Docmatch
      - path: ../extensions/safari/Sources/DocmatchSafariCore
      - path: ../extensions/safari/SharedUI
      - path: ../extensions/safari/Web/docmatch-native.json
        buildPhase: resources
      # The same pt-BR texts as the site and Android, read at runtime by DocmatchKit's Texts.
      - path: ../../packages/locales/pt-BR.json
        buildPhase: resources
    dependencies:
      - package: DocmatchKit
      - target: DocmatchSafariExtension
        embed: true
    # A shared scheme, so `xcodebuild -scheme Docmatch` (make app, the ios workflow) finds it.
    scheme:
      testTargets:
        - DocmatchUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.docmatch
        INFOPLIST_FILE: Docmatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: Docmatch/Docmatch.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DOCMATCH_GOOGLE_IOS_CLIENT_ID: ""
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: br.com.docmatch.debug
          # Public OAuth identifier for br.com.docmatch.debug; no client secret in the app.
          DOCMATCH_GOOGLE_IOS_CLIENT_ID: 118512591918-ui6bljd5o1jlghgsc5q67igbs755l9ou.apps.googleusercontent.com
          DOCMATCH_API_BASE_URL: http://localhost:8080
          DOCMATCH_ALIAS_LOOPBACK: "YES"
        Release:
          DOCMATCH_API_BASE_URL: ""
          DOCMATCH_ALIAS_LOOPBACK: "NO"
  DocmatchSafariExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ../extensions/safari/Extension
        excludes: [App.entitlements]
      - path: ../extensions/safari/Sources/DocmatchSafariCore
      - path: ../extensions/safari/Web
        excludes: [assets]
        buildPhase: resources
      - path: ../extensions/safari/Web/assets
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.docmatch.SafariExtension
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ../extensions/safari/Extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Docmatch/SafariExtension.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: br.com.docmatch.debug.SafariExtension
  DocmatchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DocmatchUITests
    dependencies:
      - target: Docmatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: br.com.docmatch.uitests
        TEST_TARGET_NAME: Docmatch
