openapi: 3.1.0
info:
  title: docmatch API
  version: 1.0.0
  summary: Conciliação de documentos, planilhas, e-mails, áudios e vídeos com evidência.
  description: |
    API pública da docmatch (v1). Tudo em pt-BR; identificadores e enums em inglês.

    ## Convenções

    - **Envelope de erro.** Toda resposta 4xx/5xx é `{code, message, request_id, details?}`.
      `code` é um código estável de `errors.yaml` (snake_case); `message` é a frase em pt-BR
      para mostrar ao usuário; `request_id` aparece também no header `X-Request-Id`.
    - **Dinheiro** é inteiro em centavos (ou na menor unidade da moeda) com `currency` ISO 4217.
      **Créditos** (tokens docmatch) são inteiros.
    - **Limites de texto** vêm de `limits.yaml`: cada `maxLength` aqui carrega `x-limit` com a
      chave correspondente, e o CI falha se discordarem.
    - **Idempotência.** Toda operação que pode gastar créditos exige o header `Idempotency-Key`
      (chave única por tentativa, até 128 caracteres). A mesma chave com o mesmo corpo devolve
      a mesma resposta; com corpo diferente devolve `409 idempotency_key_reused`.
    - **Limite de requisições.** Toda resposta traz `RateLimit-Limit`, `RateLimit-Remaining` e
      `RateLimit-Reset`; um `429 rate_limited` traz também `Retry-After`.
    - **Autenticação.** Sessão em cookie `HttpOnly` (apps e site) ou chave de API no header
      `Authorization: Bearer dm_live_<id>_<secret>` (integrações). Endpoints públicos têm
      `security: []`.
    - **Conta escolhida.** `X-Docmatch-Org` seleciona a conta por requisição; nunca altera outras abas.
      Sem o header, clientes antigos usam a conta da sessão. Chaves de API continuam presas à sua conta.
    - **Paginação** por cursor opaco: `cursor` + `limit` na consulta, `next_cursor` na resposta
      (nulo na última página).
    - **Eventos em tempo real** por SSE em `GET /runs/{id}/events`; cada evento tem `id`
      (sequência) para retomar com `Last-Event-ID`.
    - **Webhooks de saída** assinados com `DM-Signature: t=<unix>,v1=<hmac-sha256-hex>`
      (ver a seção *webhooks*).
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only

servers:
  - url: "{baseUrl}/v1"
    description: Base da API (DM_API_BASE_URL) + prefixo da versão.
    variables:
      baseUrl:
        default: "http://localhost:8080"
        description: Valor de DM_API_BASE_URL, sem barra final.

security:
  - cookieSession: []
  - apiKey: []

tags:
  - name: extensions
    description: Autorização com PKCE e sessões revogáveis das extensões oficiais.
  - name: teams
    description: Equipes e convites com aceite, sem cobrança adicional por assento.
  - name: projects
    description: Projetos salvos, versões e conciliação sem repetição de cobranças.
  - name: auth
    description: Login com Google, Apple ou e-mail; sessão em cookie HttpOnly.
  - name: account
    description: Conta e organização do usuário autenticado (LGPD incluída).
  - name: uploads
    description: Envio de documentos (S3, POST pré-assinado) e mídia (R2, PUT pré-assinado), com verificação de segurança.
  - name: runs
    description: Estimativas, execuções, achados, eventos em tempo real e exportação.
  - name: workflows
    description: Fluxos de conciliação reutilizáveis.
  - name: rules
    description: Regras como hipóteses executáveis, versionadas e promovíveis.
  - name: billing
    description: Assinaturas, recargas e webhook do Stripe.
  - name: credits
    description: Saldo de créditos e ledger.
  - name: customizations
    description: Personalização da interface a partir de um pedido em linguagem natural.
  - name: api-keys
    description: Chaves de API para integrações.
  - name: webhooks
    description: Endpoints de webhook de saída e os eventos que a docmatch envia.
  - name: public
    description: Planos, saúde e versão. Sem autenticação.

paths:
  /platforms:
    get:
      operationId: listPlatforms
      tags: [public]
      summary: Disponibilidade e destinos oficiais
      description: Catálogo compartilhado com o site; apenas destinos oficiais publicados aparecem como disponíveis.
      security: []
      responses:
        "200":
          description: Catálogo público; não anuncia destinos ainda não publicados.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name, status, url]
                      properties:
                        id: {type: string, enum: [android, ios, github, chrome, firefox, safari]}
                        name: {type: string}
                        status: {type: string, enum: [coming_soon, beta, available]}
                        url: {type: string, description: "Vazia enquanto indisponível; depois, destino HTTPS oficial."}
        "400":
          $ref: "#/components/responses/BadRequest"
  /platform-notices:
    post:
      operationId: requestPlatformNotice
      tags: [public]
      summary: Pede confirmação de um aviso por e-mail
      description: Não cria conta. A resposta não revela pedidos anteriores. Exige consentimento e confirmação posterior; limites por endereço, IP e orçamento global usam a fila existente.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [platform, email, consent]
              properties:
                platform: {type: string, enum: [android, ios, github, chrome, firefox, safari]}
                email: {type: string, format: email, maxLength: 254, x-limit: text.email}
                consent: {type: boolean, const: true}
      responses:
        "202":
          description: Pedido recebido; pode já ter sido confirmado ou estar em espera por limite de reenvio.
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: {type: boolean, const: true}
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: Limite de requisições ou orçamento de e-mail atingido.
        "503":
          description: Envio de e-mail indisponível.
  /platform-notices/confirm:
    post:
      operationId: confirmPlatformNotice
      tags: [public]
      summary: Confirma o endereço para um único aviso
      description: Só o botão da página faz este POST. Abrir o link não confirma; o token vale 24 horas e o reenvio o substitui. Repetir a confirmação válida não duplica avisos.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
      responses:
        "200":
          description: Pedido confirmado.
          content:
            application/json:
              schema:
                type: object
                required: [platform, status]
                properties:
                  platform: {type: string}
                  status: {type: string, const: confirmed}
        "400":
          $ref: "#/components/responses/BadRequest"
  /platform-notices/unsubscribe:
    post:
      operationId: unsubscribePlatformNotice
      tags: [public]
      summary: Cancela um pedido de aviso
      description: Token de cancelamento separado da confirmação. Cancela também o aviso ainda na fila; não altera contas, outros pedidos nem mensagens já enviadas.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: {type: string, pattern: '^[A-Za-z0-9_-]{43,256}$'}
      responses:
        "204":
          description: Pedido cancelado ou já removido.
        "400":
          $ref: "#/components/responses/BadRequest"
  /extensions/clients/{client}:
    get:
      operationId: getExtensionClient
      tags: [extensions]
      summary: Confirma o nome e o retorno de uma extensão registrada
      description: Consulta pública para a tela de consentimento. Exige um cliente e retorno cadastrados pelo operador.
      security: []
      parameters:
        - name: client
          in: path
          required: true
          schema: {type: string}
        - name: redirect_uri
          in: query
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Cliente e retorno registrados; não cria autorização.
          content:
            application/json:
              schema:
                type: object
                required: [id, name]
                properties:
                  id: {type: string}
                  name: {type: string}
        "400":
          $ref: "#/components/responses/BadRequest"
  /extensions/authorize:
    post:
      operationId: authorizeExtension
      tags: [extensions]
      summary: Autoriza a extensão após consentimento explícito
      description: >-
        Exige login em cookie, proteção de origem e e-mail verificado. Abrir a página não autoriza.
        O retorno precisa corresponder exatamente ao cliente registrado. Código de uso único,
        válido por dois minutos, protegido por PKCE S256. As permissões das contas continuam valendo.
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [client_id, redirect_uri, code_challenge, code_challenge_method, state]
              properties:
                client_id: {type: string}
                redirect_uri: {type: string}
                code_challenge:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{43}$'
                code_challenge_method: {type: string, enum: [S256]}
                state:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{43}$'
      responses:
        "200":
          description: Retorno registrado com código e estado; Cache-Control no-store.
          content:
            application/json:
              schema:
                type: object
                required: [redirect_uri]
                properties:
                  redirect_uri: {type: string}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /extensions/token:
    post:
      operationId: exchangeExtensionToken
      tags: [extensions]
      summary: Troca o código ou renova a sessão da extensão
      description: >-
        Não aceita cookies. O código exige cliente, retorno e verificador PKCE correspondentes.
        Acesso por dez minutos e renovação por trinta dias. Antes de renovar, persista um request_id
        aleatório. Repetir o mesmo token e request_id em até dois minutos devolve a mesma resposta;
        reutilizar um token já gasto em outro pedido revoga a sessão. Após esse prazo, entre novamente.
        Respostas nunca podem ser armazenadas por caches HTTP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [grant_type, client_id, code, redirect_uri, code_verifier]
                  properties:
                    grant_type: {type: string, enum: [authorization_code]}
                    client_id: {type: string}
                    code: {type: string}
                    redirect_uri: {type: string}
                    code_verifier:
                      type: string
                      pattern: '^[A-Za-z0-9._~-]{43,128}$'
                - type: object
                  additionalProperties: false
                  required: [grant_type, client_id, refresh_token, request_id]
                  properties:
                    grant_type: {type: string, enum: [refresh_token]}
                    client_id: {type: string}
                    refresh_token: {type: string}
                    request_id: {type: string, format: uuid}
      responses:
        "200":
          description: Credenciais da extensão; Cache-Control no-store.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, refresh_token, token_type, expires_in, expires_at, refresh_expires_at]
                properties:
                  access_token: {type: string}
                  refresh_token: {type: string}
                  token_type: {type: string, enum: [Bearer]}
                  expires_in: {type: integer, minimum: 1}
                  expires_at: {type: string, format: date-time}
                  refresh_expires_at: {type: string, format: date-time}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /extensions/revoke:
    post:
      operationId: revokeExtensionSession
      tags: [extensions]
      summary: Desconecta a própria sessão da extensão
      description: Também pode ser revogada pela lista de dispositivos do usuário. Não exige vínculo na antiga conta selecionada.
      security:
        - extensionSession: []
      responses:
        "204":
          description: Sessão revogada.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /team:
    parameters:
      - $ref: "#/components/parameters/OrgContext"
    get:
      operationId: getTeam
      tags:
        - teams
      summary: Consulta a equipe e a própria permissão
      description: Somente responsáveis e administradores recebem a lista de pessoas e convites. Outros
        participantes recebem listas vazias.
      security:
        - cookieSession: []
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    post:
      operationId: createTeam
      tags:
        - teams
      summary: Transforma a conta paga em equipe
      description: Requer responsável e assinatura ativa. Preserva a conta, assinatura, saldo e projetos existentes;
        cria uma conta pessoal vazia se necessário. Não altera quantidades de cobrança. Projetos continuam
        privados.
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamCreate"
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: Créditos insuficientes para reservar o teto.
          x-error-codes:
            - insufficient_credits
            - subscription_required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /team/invitations:
    parameters:
      - $ref: "#/components/parameters/OrgContext"
    post:
      operationId: inviteTeamMember
      tags:
        - teams
      summary: Convida uma pessoa pelo e-mail
      description: Requer gestão da conta e plano ativo. Sem cobrança adicional por assento. Um convite pendente
        para o mesmo e-mail é reutilizado sem reenvio automático. O acesso exige aceite com e-mail verificado.
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInvite"
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamInvitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: Créditos insuficientes para reservar o teto.
          x-error-codes:
            - insufficient_credits
            - subscription_required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /team/invitations/{invitation}/resend:
    parameters:
      - $ref: "#/components/parameters/OrgContext"
      - $ref: "#/components/parameters/InvitationPath"
    post:
      operationId: resendTeamInvitation
      tags:
        - teams
      summary: Reenvia e invalida o link anterior
      description: Intervalo mínimo de um minuto e limite de envios por hora. O novo link vence em sete dias.
      security:
        - cookieSession: []
      responses:
        "204":
          description: Operação concluída.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: Créditos insuficientes para reservar o teto.
          x-error-codes:
            - insufficient_credits
            - subscription_required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /team/invitations/{invitation}:
    parameters:
      - $ref: "#/components/parameters/OrgContext"
      - $ref: "#/components/parameters/InvitationPath"
    delete:
      operationId: revokeTeamInvitation
      tags:
        - teams
      summary: Revoga um convite pendente
      description: Revoga um convite pendente
      security:
        - cookieSession: []
      responses:
        "204":
          description: Operação concluída.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /team/members/{user}:
    parameters:
      - $ref: "#/components/parameters/OrgContext"
      - $ref: "#/components/parameters/TeamUserPath"
    patch:
      operationId: changeTeamMemberRole
      tags:
        - teams
      summary: Altera a permissão de projetos
      description: Altera a permissão de projetos
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamRoleChange"
      responses:
        "204":
          description: Operação concluída.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: removeTeamMember
      tags:
        - teams
      summary: Remove o acesso à equipe
      description: Revoga o vínculo sem excluir a identidade, conta pessoal ou assinatura da pessoa. Não permite
        remover o responsável por este caminho.
      security:
        - cookieSession: []
      responses:
        "204":
          description: Operação concluída.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /team/owner:
    parameters:
      - $ref: "#/components/parameters/OrgContext"
    post:
      operationId: transferTeamOwnership
      tags:
        - teams
      summary: Transfere a responsabilidade pela conta
      description: Somente o responsável atual pode transferir para um participante aceito com acesso completo. O
        novo responsável é promovido antes de reduzir o acesso do anterior.
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamTransfer"
      responses:
        "204":
          description: Operação concluída.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /team/leave:
    parameters:
      - $ref: "#/components/parameters/OrgContext"
    post:
      operationId: leaveTeam
      tags:
        - teams
      summary: Sai da equipe preservando a conta pessoal
      description: O responsável precisa transferir a função antes de sair.
      security:
        - cookieSession: []
      responses:
        "204":
          description: Operação concluída.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /invitations/preview:
    post:
      operationId: previewTeamInvitation
      tags:
        - teams
      summary: Lê um convite sem aceitá-lo
      description: O token chega no corpo. A abertura do link só exibe este resumo; não adiciona nenhum vínculo. O
        e-mail é mascarado. email_matches considera a identidade autenticada, quando houver.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationPreviewRequest"
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /invitations/respond:
    post:
      operationId: answerTeamInvitation
      tags:
        - teams
      summary: Aceita ou recusa explicitamente um convite
      description: Requer sessão válida e o e-mail convidado verificado. Não depende da antiga conta selecionada.
        Repetir um aceite é seguro enquanto o vínculo existe; o link não recria um acesso removido.
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationAnswer"
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationAnswerResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: Créditos insuficientes para reservar o teto.
          x-error-codes:
            - insufficient_credits
            - subscription_required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /me/invitations:
    get:
      operationId: listPendingInvitations
      tags:
        - teams
      summary: Lista convites pendentes para o e-mail verificado do login
      description: Não aceita convites nem retorna tokens. Independe da conta selecionada. Até 50 convites por página.
      security:
        - cookieSession: []
      parameters:
        - name: cursor
          in: query
          schema:
            $ref: "#/components/schemas/InvitationId"
      responses:
        "200":
          description: Convites pendentes, ordenados por ID. next_cursor aparece quando há outra página.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationInbox"
        "400":
