        needs_approval: "#/components/schemas/RunEventNeedsApproval"
        completed: "#/components/schemas/RunEventCompleted"
        failed: "#/components/schemas/RunEventFailed"
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: Last-Event-ID
          in: header
          required: false
          description: Última sequência recebida; o fluxo recomeça do evento seguinte.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Fluxo de eventos.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/RunEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Execução não encontrada.
          x-error-codes:
            - run_not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    parameters:
      - $ref: "#/components/parameters/OrgContext"
      - $ref: "#/components/parameters/ProjectPath"
  /projects/{project}/runs/{id}/findings:
    get:
      security:
        - cookieSession: []
        - apiKey: []
        - extensionSession: []
      operationId: projectListFindings
      summary: Lista os achados de uma execução
      description: Ordenados por severidade e valor em risco. Disponível enquanto a execução roda (parcial) e depois.
      tags:
        - projects
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: severity
          in: query
          description: Uma ou mais severidades, separadas por vírgula.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Severity"
          style: form
          explode: false
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/FindingStatus"
      responses:
        "200":
          description: Página de achados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Execução não encontrada.
          x-error-codes:
            - run_not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    parameters:
      - $ref: "#/components/parameters/OrgContext"
      - $ref: "#/components/parameters/ProjectPath"
  /projects/{project}/runs/{id}/findings/{fid}/feedback:
    post:
      security:
        - cookieSession: []
        - apiKey: []
        - extensionSession: []
      operationId: projectGiveFindingFeedback
      summary: Confirma, descarta ou resolve um achado
      description: O feedback alimenta a calibração da confiança e, nos planos com aprendizado, a proposta de regras.
      tags:
        - projects
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/FindingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindingFeedbackRequest"
      responses:
        "200":
          description: Achado atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Finding"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Execução ou achado não encontrado.
          x-error-codes:
            - run_not_found
            - finding_not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Unprocessable"
    parameters:
      - $ref: "#/components/parameters/OrgContext"
      - $ref: "#/components/parameters/ProjectPath"
  /projects/{project}/runs/{id}/export:
    get:
      security:
        - cookieSession: []
        - apiKey: []
        - extensionSession: []
      operationId: projectExportRun
      summary: Exporta os resultados (xlsx, csv ou pdf)
      description: |
        Planilha com achados, casamentos e evidências; CSV só com achados; PDF com o relatório.
        Só para execuções concluídas. O arquivo é gerado sob demanda e cacheado.
      tags:
        - projects
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: format
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ExportFormat"
      responses:
        "200":
          description: O arquivo.
          headers:
            Content-Disposition:
              description: '`attachment; filename="docmatch-<run_id>.<ext>"`'
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                $ref: "#/components/schemas/BinaryFile"
            text/csv:
              schema:
                type: string
            application/pdf:
              schema:
                $ref: "#/components/schemas/BinaryFile"
        "400":
          description: Formato não suportado.
          x-error-codes:
            - export_format_unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Execução não encontrada.
          x-error-codes:
            - run_not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A execução ainda não terminou, ou o arquivo ainda está sendo gerado (tente de novo em instantes).
          x-error-codes:
            - run_not_completed
            - export_not_ready
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    parameters:
      - $ref: "#/components/parameters/OrgContext"
      - $ref: "#/components/parameters/ProjectPath"
  /projects/{project}/runs/{id}/approve-quote:
    post:
      security:
        - cookieSession: []
        - apiKey: []
        - extensionSession: []
      operationId: projectApproveRunQuote
      summary: Aprova o orçamento adicional de uma execução parada
      description: |
        Quando a execução para em `needs_approval` (ferramentas novas, teto atingido), o cliente
        aprova o novo orçamento recebido no evento. Reserva a diferença e retoma do checkpoint.
      tags:
        - projects
      x-spends-credits: true
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveQuoteRequest"
      responses:
        "200":
          description: Execução retomada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          description: Orçamento adulterado ou header ausente.
          x-error-codes:
            - quote_invalid_signature
            - missing_idempotency_key
            - validation_failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: Créditos insuficientes para a diferença.
          x-error-codes:
            - insufficient_credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Execução ou orçamento não encontrado.
          x-error-codes:
            - run_not_found
            - quote_not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A execução não está aguardando aprovação.
          x-error-codes:
            - run_not_awaiting_approval
            - idempotency_key_reused
            - quote_mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Orçamento expirado; a execução foi cancelada e os créditos devolvidos.
          x-error-codes:
            - quote_expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    parameters:
      - $ref: "#/components/parameters/OrgContext"
      - $ref: "#/components/parameters/ProjectPath"
  /projects/{project}/rules:
    get:
      security:
        - cookieSession: []
        - apiKey: []
        - extensionSession: []
      operationId: projectListRules
      summary: Busca regras
      description: Regras da organização e regras globais, filtradas por texto (`q`) e estado.
      tags:
        - projects
      parameters:
        - name: q
          in: query
          description: Busca por título e corpo.
          schema:
            type: string
            maxLength: 100
            x-limit: text.rule_picker_search
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/RuleStatus"
        - name: scope
          in: query
          schema:
            $ref: "#/components/schemas/RuleScope"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de regras.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
    post:
      security:
        - cookieSession: []
        - apiKey: []
        - extensionSession: []
      operationId: projectCreateRule
      summary: Cria uma regra
      description: |
        Salva a regra em linguagem natural e, por padrão, compila para SQL e avalia contra o
        histórico confirmado (gasta créditos de modelo). Nasce `draft` sem compilar ou
        `candidate` compilada.
      tags:
        - projects
      x-spends-credits: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleCreateRequest"
      responses:
        "201":
          description: Regra criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: Texto fora do limite ou regra que não compila.
          x-error-codes:
            - text_too_long
            - rule_compile_failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    parameters:
      - $ref: "#/components/parameters/OrgContext"
      - $ref: "#/components/parameters/ProjectPath"
  /projects/{project}/rules/{id}/versions:
    post:
      security:
        - cookieSession: []
        - apiKey: []
        - extensionSession: []
      operationId: projectCreateRuleVersion
      summary: Cria uma nova versão da regra
      description: Mantém o `id`, incrementa `version`, recompila e reavalia. A versão anterior continua ativa até a
        nova ser promovida.
      tags:
        - projects
      x-spends-credits: true
      parameters:
        - $ref: "#/components/parameters/RuleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleVersionRequest"
      responses:
        "201":
          description: Nova versão.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          description: Regras globais são só leitura para organizações.
          x-error-codes:
            - rule_read_only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Regra não encontrada.
          x-error-codes:
            - rule_not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: Texto fora do limite ou regra que não compila.
          x-error-codes:
            - text_too_long
            - rule_compile_failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    parameters:
      - $ref: "#/components/parameters/OrgContext"
      - $ref: "#/components/parameters/ProjectPath"
  /projects/{project}/rules/{id}/promote:
    post:
      security:
        - cookieSession: []
        - apiKey: []
        - extensionSession: []
      operationId: projectPromoteRule
      summary: Promove uma regra
      description: |
        `candidate` → `verified` exige histórico sem falsos positivos; `verified` → `trusted`
        passa a aplicar a regra automaticamente em toda execução. Só administradores promovem
        regras globais (API admin).
      tags:
        - projects
      parameters:
        - $ref: "#/components/parameters/RuleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RulePromoteRequest"
      responses:
        "200":
          description: Regra promovida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Regra global.
          x-error-codes:
            - rule_read_only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Regra não encontrada.
          x-error-codes:
            - rule_not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Sem histórico suficiente.
          x-error-codes:
            - rule_not_promotable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    parameters:
      - $ref: "#/components/parameters/OrgContext"
      - $ref: "#/components/parameters/ProjectPath"

  # ------------------------------------------------------------------ auth
  /auth/google/start:
    post:
      operationId: authGoogleStart
      summary: Inicia o login com Google
      description: Gera `state` e PKCE, guarda em cookie temporário e devolve a URL de autorização.
      tags: [ auth ]
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthStartRequest"
      responses:
        "200":
          description: URL de autorização para redirecionar o usuário.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStartResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/google/callback:
    get:
      operationId: authGoogleCallback
      summary: Conclui o login com Google
      description: |
        Chamado pelo Google. Troca o `code` por tokens, cria ou localiza o usuário, abre a sessão
        (`Set-Cookie`) e redireciona para `redirect_to`. Em erro, redireciona para a página de
        login com `?error=<code>`.
      tags: [ auth ]
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Preenchido pelo Google quando o usuário cancela.
          schema:
            type: string
      responses:
        "200":
          description: "Sessão aberta (clientes com `Accept: application/json` recebem a sessão em vez do
            redirecionamento)."
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "303":
          description: Sessão aberta; redireciona para o app.
          headers:
            Set-Cookie:
              description: Cookie de sessão `dm_session` (HttpOnly, Secure, SameSite=Lax).
              schema:
                type: string
            Location:
              schema:
                type: string
        "400":
          description: "`state` não confere ou o provedor devolveu erro."
          x-error-codes: [ oauth_state_mismatch ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: E-mail não verificado no provedor ou conta suspensa.
          x-error-codes: [ oauth_email_unverified, account_suspended ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: O provedor não respondeu.
          x-error-codes: [ oauth_provider_error ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/apple/start:
    post:
      operationId: authAppleStart
      summary: Inicia o login com Apple
      description: Gera `state` e `nonce` e devolve a URL de autorização (modo `form_post`).
      tags: [ auth ]
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthStartRequest"
      responses:
        "200":
          description: URL de autorização.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStartResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/apple/callback:
    post:
      operationId: authAppleCallback
      summary: Conclui o login com Apple
      description: |
        Recebe o `form_post` da Apple (web) ou o `identity_token` obtido nativamente (iOS).
        Valida o token contra as chaves públicas da Apple, abre a sessão e redireciona (web) ou
        devolve a sessão (nativo).
      tags: [ auth ]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/AppleCallbackForm"
          application/json:
            schema:
              $ref: "#/components/schemas/AppleNativeCallback"
      responses:
        "200":
          description: Sessão aberta (chamada nativa).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "303":
          description: Sessão aberta; redireciona para o app (chamada web).
          headers:
            Set-Cookie:
              schema:
                type: string
            Location:
              schema:
                type: string
        "400":
          description: "`state` não confere ou token inválido."
          x-error-codes: [ oauth_state_mismatch, validation_failed ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Conta suspensa ou e-mail não verificado.
          x-error-codes: [ oauth_email_unverified, account_suspended ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: A Apple não respondeu.
          x-error-codes: [ oauth_provider_error ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/email/start:
    post:
      operationId: authEmailStart
      summary: Envia um código de login por e-mail
      description: Cria um desafio e envia um código de 6 dígitos (válido por poucos minutos). A resposta é a mesma
        exista ou não a conta.
      tags: [ auth ]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailStartRequest"
      responses:
        "202":
          description: Código enviado (ou silenciosamente ignorado).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailStartResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/email/verify:
    post:
      operationId: authEmailVerify
      summary: Confirma o código recebido por e-mail
      description: Abre a sessão quando o código confere. Cinco tentativas por desafio.
      tags: [ auth ]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailVerifyRequest"
      responses:
        "200":
          description: Sessão aberta.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Código inválido.
          x-error-codes: [ email_code_invalid, validation_failed ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Conta suspensa ou em processo de exclusão.
          x-error-codes: [ account_suspended, account_deletion_pending ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Desafio não encontrado.
          x-error-codes: [ email_challenge_not_found ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Código expirado.
          x-error-codes: [ email_code_expired ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Tentativas esgotadas.
          x-error-codes: [ too_many_attempts, rate_limited ]
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/methods:
    get:
      operationId: authMethods
      summary: Formas de entrar disponíveis
      description: |
        Quais logins esta instalação oferece agora (um provedor sem chave configurada aparece
        como `false`). O site e os apps mostram só os botões que funcionam.
      tags: [ auth ]
      security: []
      responses:
        "200":
          description: Formas de entrar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMethods"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/google/native:
    post:
      operationId: authGoogleNative
      summary: Entra com o token do Google obtido pelo app
      description: |
        Para os apps Android e iOS: o `id_token` vem do login do próprio Google no aparelho. A
        audiência precisa ser o client id do servidor ou um de `GOOGLE_OAUTH_NATIVE_CLIENT_IDS`.
        A conta é resolvida como no site (sujeito do Google, depois e-mail verificado), então a
        mesma pessoa cai na mesma conta em qualquer aparelho.
      tags: [ auth ]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleNativeRequest"
      responses:
        "200":
          description: Sessão aberta.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Token inválido, expirado ou de outra audiência.
          x-error-codes: [ oauth_state_mismatch, validation_failed ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: E-mail do Google não verificado, conta suspensa ou em processo de exclusão.
          x-error-codes: [ oauth_email_unverified, account_suspended, account_deletion_pending ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: Login com Google não configurado.
          x-error-codes: [ service_unavailable ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/dev/login:
    post:
      operationId: authDevLogin
      summary: Entra sem provedor (só desenvolvimento local)
      description: |
        Existe só com `DM_DEV_LOGIN` ligado, que a API recusa fora de `DM_ENV=dev`. Cria a conta no
        primeiro uso e credita a organização uma vez por dia, para rodar exemplos sem Stripe.
      tags: [ auth ]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevLoginRequest"
      responses:
        "200":
          description: Sessão aberta.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: E-mail inválido.
          x-error-codes: [ validation_failed ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/password/login:
    post:
      operationId: authPasswordLogin
      summary: Entra com e-mail e senha
      description: |
        Senha opcional, definida em `PUT /me/password`. A resposta a e-mail desconhecido e a senha
        errada é a mesma (`invalid_credentials`). Limite por IP e por e-mail com bloqueio
        exponencial; `totp_code` é reservado para o segundo fator.
      tags: [ auth ]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLoginRequest"
      responses:
        "200":
          description: Sessão aberta.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: E-mail ou senha incorretos.
          x-error-codes: [ invalid_credentials ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Conta suspensa ou em processo de exclusão.
          x-error-codes: [ account_suspended, account_deletion_pending ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/refresh:
    post:
      operationId: authRefresh
      summary: Renova a sessão
      description: Rotaciona o cookie de sessão. Só com sessão em cookie; chaves de API não têm sessão.
      tags: [ auth ]
      security:
        - cookieSession: []
      responses:
        "200":
          description: Sessão renovada.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      operationId: authLogout
      summary: Encerra a sessão
      description: Invalida a sessão atual e limpa o cookie.
      tags: [ auth ]
      security:
        - cookieSession: []
      responses:
        "204":
          description: Sessão encerrada.
        "401":
          $ref: "#/components/responses/Unauthorized"

  # --------------------------------------------------------------- account
  /me:
    get:
      security:
        - cookieSession: []
        - extensionSession: []
      operationId: getMe
      summary: Dados do usuário autenticado
      description: Usuário, organização, plano, créditos e limites efetivos do plano.
      tags: [ account ]
      responses:
        "200":
          description: Perfil completo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateMe
      summary: Atualiza nome, empresa e notificações
      description: Campos ausentes não mudam. Textos passam por normalização NFC e pelos limites de `limits.yaml`.
      tags: [ account ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeUpdate"
      responses:
        "200":
          description: Perfil atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: deleteMe
      summary: Pede a exclusão da conta (LGPD)
      description: |
        Agenda a exclusão da conta e de todos os dados em 7 dias; até lá o login é bloqueado com
        `account_deletion_pending` e o pedido pode ser cancelado pelo suporte. Assinaturas ativas
        são canceladas no Stripe.
      tags: [ account ]
      security:
        - cookieSession: []
      responses:
        "202":
          description: Exclusão agendada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionScheduled"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Já existe um pedido de exclusão.
          x-error-codes: [ conflict ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/export:
    get:
      operationId: exportMe
      summary: Exportação dos dados pessoais (LGPD)
      description: |
        Pede (ou consulta) a exportação de tudo que a conta tem: perfil, execuções, achados, regras
        e ledger. Quando pronta, a resposta traz uma URL assinada válida por 24 horas.
      tags: [ account ]
      security:
        - cookieSession: []
      responses:
        "200":
          description: Estado da exportação.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /me/export/download:
    get:
      operationId: downloadMeExport
      summary: Baixa a exportação dos dados pessoais
      description: |
        Destino da `download_url` de `GET /me/export`: o `token` é assinado pelo servidor e vale
        até `expires_at`. Não exige sessão; um token inválido, expirado ou de exportação ainda não
        pronta responde `404` sem detalhes.
      tags: [ account ]
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Arquivo zip com um JSON por conjunto de dados.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  /me/sessions:
    get:
      operationId: listDevices
      summary: Aparelhos com sessão aberta
      description: |
        Cada login (navegador ou instalação do app) é uma sessão presa àquele aparelho, todas na
        mesma conta. A sessão que faz a chamada vem primeiro, com `current: true`.
      tags: [ account ]
      responses:
        "200":
          description: Sessões ativas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/sessions/{id}:
    delete:
      operationId: revokeDevice
      summary: Encerra a sessão de um aparelho
      description: Encerrar a própria sessão também limpa os cookies desta resposta.
      tags: [ account ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^ses_[0-9A-Z]{26}$"
      responses:
        "204":
          description: Sessão encerrada.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /me/password:
    put:
      operationId: setMePassword
      summary: Define ou troca a senha
      description: |
        Quem já tem senha informa `current_password`. Quem entrou por Google, Apple ou e-mail e
        ainda não tem senha precisa de uma sessão recente (`recent_login_required` caso contrário).
        Toda troca encerra as outras sessões do usuário.
      tags: [ account ]
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
      responses:
        "204":
          description: Senha definida.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Sem sessão ou senha atual incorreta.
          x-error-codes: [ unauthenticated, session_expired, invalid_credentials ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Sessão antiga demais para definir a primeira senha.
          x-error-codes: [ recent_login_required ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # --------------------------------------------------------------- uploads
  /uploads:
    post:
      operationId: createUpload
      summary: Pede uma URL pré-assinada para enviar um arquivo
      description: |
        Documentos vão para o S3 com um POST pré-assinado (política limita tipo e tamanho);
        mídia vai para o Cloudflare R2 com um PUT pré-assinado. O tamanho é validado contra o
        plano antes de emitir o ticket. O arquivo só fica utilizável depois de
        `POST /uploads/{id}/complete` e da verificação de segurança.
      tags: [ uploads ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
      responses:
        "201":
          description: Ticket de envio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadTicket"
        "400":
          description: Nome inválido ou campos faltando.
          x-error-codes: [ validation_failed, upload_rejected_name ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: Arquivo maior que o permitido pelo plano.
          x-error-codes: [ file_too_large, upload_rejected_size ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Tipo não suportado.
          x-error-codes: [ upload_rejected_type ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /uploads/{id}/complete:
    post:
      operationId: completeUpload
      summary: Confirma o envio e dispara a verificação
      description: |
        Confere tamanho e hash, sniffa o tipo pelo conteúdo e põe o arquivo na fila do scanner
        (antivírus, bomba de descompactação, listas de reprodução). Responde `202` enquanto a
        verificação roda; o estado final aparece em `status`.
      tags: [ uploads ]
      parameters:
        - $ref: "#/components/parameters/UploadId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadCompleteRequest"
      responses:
        "200":
          description: Verificação concluída (arquivo pronto ou rejeitado).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "202":
          description: Verificação em andamento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: O objeto ainda não chegou ao storage.
          x-error-codes: [ upload_incomplete ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Ticket expirado.
          x-error-codes: [ upload_expired ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Conteúdo rejeitado.
          x-error-codes:
            - upload_checksum_mismatch
            - upload_rejected_malware
            - upload_rejected_bomb
            - upload_rejected_playlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ------------------------------------------------------------------ runs
  /runs/estimate:
    post:
      operationId: estimateRun
      summary: Estima o custo de uma execução
      description: |
        Devolve um orçamento assinado (`Quote`) com o custo esperado, o teto e o detalhamento.
        Não gasta créditos. O orçamento vale por `quote_ttl_minutes` (config/pricing.yaml).
        Traz também a duração esperada (`expected_seconds`, fila incluída) e `large`: nenhum
        pedido é recusado pelo tamanho; um pedido grande avisa quanto deve levar, e quem o iniciou
        recebe um e-mail quando ele terminar.
      tags: [ runs ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateRequest"
      responses:
        "200":
          description: Orçamento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Faixa não permitida no plano.
          x-error-codes: [ lane_not_allowed, plan_limit_reached ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Algum arquivo ainda não está pronto.
          x-error-codes: [ upload_not_ready ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Execução maior que o plano permite.
          x-error-codes: [ run_too_large ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Limites de arquivos, duração ou texto.
          x-error-codes: [ too_many_files, media_too_long, text_too_long ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /runs:
    get:
      operationId: listRuns
      summary: Lista execuções da organização
      description: Mais recentes primeiro. Filtra por estado e por fluxo.
      tags: [ runs ]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/RunStatus"
        - name: workflow_id
          in: query
          schema:
            $ref: "#/components/schemas/WorkflowId"
      responses:
        "200":
          description: Página de execuções.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createRun
      summary: Cria uma execução a partir de um orçamento aprovado
      description: |
        Reserva `cap_credits` no ledger e enfileira a execução. Exige `Idempotency-Key`. Se o
        orçamento tiver `requires_approval`, o cliente já está aprovando ao chamar. Se a execução
        precisar de mais do que o teto, ela para em `needs_approval` e emite um novo orçamento.
      tags: [ runs ]
      x-spends-credits: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunCreateRequest"
      responses:
        "202":
          description: Execução enfileirada.
          headers:
            Location:
              description: URL da execução.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          description: Corpo inválido, orçamento adulterado ou header ausente.
          x-error-codes: [ validation_failed, quote_invalid_signature, missing_idempotency_key ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: Créditos insuficientes para reservar o teto.
          x-error-codes: [ insufficient_credits, subscription_required ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Orçamento não encontrado.
          x-error-codes: [ quote_not_found ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Orçamento não corresponde ao pedido, chave reutilizada ou arquivo não pronto.
          x-error-codes: [ quote_mismatch, idempotency_key_reused, idempotency_in_progress, upload_not_ready ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Orçamento expirado.
          x-error-codes: [ quote_expired ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Execuções simultâneas do plano esgotadas ou limite de requisições.
          x-error-codes: [ concurrent_runs_exceeded, rate_limited ]
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /runs/{id}:
    get:
      operationId: getRun
      summary: Consulta uma execução
      description: Estado, progresso, créditos reservados e gastos, resumo quando concluída.
      tags: [ runs ]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: A execução.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Execução não encontrada.
          x-error-codes: [ run_not_found ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /runs/{id}/cancel:
    post:
      operationId: cancelRun
      summary: Cancela uma execução
      description: Para a execução e devolve os créditos não gastos. Execuções já terminadas não mudam.
      tags: [ runs ]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Execução cancelada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Execução não encontrada.
          x-error-codes: [ run_not_found ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A execução já terminou.
          x-error-codes: [ run_already_finished ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /runs/{id}/events:
    get:
      operationId: streamRunEvents
      summary: Eventos da execução em tempo real (SSE)
      description: |
        Fluxo `text/event-stream`. Cada mensagem tem `id` (sequência monotônica), `event` (um dos
        nomes abaixo) e `data` (JSON com o esquema do evento). O servidor envia `: ping` a cada
        15 s; a conexão fecha após `completed`, `failed` ou `needs_approval`. Para retomar, envie
        `Last-Event-ID` com a última sequência recebida.
      tags: [ runs ]
      x-sse-events:
        stage_started: "#/components/schemas/RunEventStageStarted"
        progress: "#/components/schemas/RunEventProgress"
        token_usage: "#/components/schemas/RunEventTokenUsage"
        finding: "#/components/schemas/RunEventFinding"
        match: "#/components/schemas/RunEventMatch"
        needs_approval: "#/components/schemas/RunEventNeedsApproval"
        completed: "#/components/schemas/RunEventCompleted"
        failed: "#/components/schemas/RunEventFailed"
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: Last-Event-ID
          in: header
          required: false
          description: Última sequência recebida; o fluxo recomeça do evento seguinte.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Fluxo de eventos.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/RunEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Execução não encontrada.
          x-error-codes: [ run_not_found ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /runs/{id}/findings:
    get:
      operationId: listFindings
      summary: Lista os achados de uma execução
      description: Ordenados por severidade e valor em risco. Disponível enquanto a execução roda (parcial) e depois.
      tags: [ runs ]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: severity
          in: query
          description: Uma ou mais severidades, separadas por vírgula.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Severity"
          style: form
          explode: false
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/FindingStatus"
      responses:
        "200":
          description: Página de achados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Execução não encontrada.
          x-error-codes: [ run_not_found ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /runs/{id}/findings/{fid}/feedback:
    post:
      operationId: giveFindingFeedback
      summary: Confirma, descarta ou resolve um achado
      description: O feedback alimenta a calibração da confiança e, nos planos com aprendizado, a proposta de regras.
      tags: [ runs ]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/FindingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindingFeedbackRequest"
      responses:
        "200":
          description: Achado atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Finding"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Execução ou achado não encontrado.
          x-error-codes: [ run_not_found, finding_not_found ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /runs/{id}/export:
    get:
      operationId: exportRun
      summary: Exporta os resultados (xlsx, csv ou pdf)
      description: |
        Planilha com achados, casamentos e evidências; CSV só com achados; PDF com o relatório.
        Só para execuções concluídas. O arquivo é gerado sob demanda e cacheado.
      tags: [ runs ]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: format
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ExportFormat"
      responses:
        "200":
          description: O arquivo.
          headers:
            Content-Disposition:
              description: "`attachment; filename=\"docmatch-<run_id>.<ext>\"`"
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                $ref: "#/components/schemas/BinaryFile"
            text/csv:
              schema:
                type: string
            application/pdf:
              schema:
                $ref: "#/components/schemas/BinaryFile"
        "400":
          description: Formato não suportado.
          x-error-codes: [ export_format_unsupported ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Execução não encontrada.
          x-error-codes: [ run_not_found ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A execução ainda não terminou, ou o arquivo ainda está sendo gerado (tente de novo em instantes).
          x-error-codes: [ run_not_completed, export_not_ready ]
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /runs/{id}/approve-quote:
    post:
      operationId: approveRunQuote
      summary: Aprova o orçamento adicional de uma execução parada
      description: |
        Quando a execução para em `needs_approval` (ferramentas novas, teto atingido), o cliente
        aprova o novo orçamento recebido no evento. Reserva a diferença e retoma do checkpoint.
      tags: [ runs ]
      x-spends-credits: true
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveQuoteRequest"
      responses:
        "200":
          description: Execução retomada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          description: Orçamento adulterado ou header ausente.
          x-error-codes: [ quote_invalid_signature, missing_idempotency_key, validation_failed ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: Créditos insuficientes para a diferença.
          x-error-codes: [ insufficient_credits ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Execução ou orçamento não encontrado.
          x-error-codes: [ run_not_found, quote_not_found ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A execução não está aguardando aprovação.
          x-error-codes: [ run_not_awaiting_approval, idempotency_key_reused, quote_mismatch ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Orçamento expirado; a execução foi cancelada e os créditos devolvidos.
          x-error-codes: [ quote_expired ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ------------------------------------------------------------- workflows
  /workflows:
    get:
      operationId: listWorkflows
      summary: Lista os fluxos da organização
      description: Ordenados por nome.
      tags: [ workflows ]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de fluxos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createWorkflow
      summary: Cria um fluxo
      description: A configuração segue `schemas/workflow-config.json`.
      tags: [ workflows ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowConfig"
      responses:
        "201":
          description: Fluxo criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Alguma regra referenciada não existe.
          x-error-codes: [ rule_not_found ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /workflows/{id}:
    get:
      operationId: getWorkflow
      summary: Consulta um fluxo
      description: Configuração completa e contagem de execuções.
      tags: [ workflows ]
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
      responses:
        "200":
          description: O fluxo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Fluxo não encontrado.
          x-error-codes: [ workflow_not_found ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateWorkflow
      summary: Altera um fluxo
      description: Substitui só as seções enviadas (`sources`, `matching`, `rules`, ...). Execuções em andamento não
        mudam.
      tags: [ workflows ]
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowPatch"
      responses:
        "200":
          description: Fluxo atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Fluxo não encontrado.
          x-error-codes: [ workflow_not_found, rule_not_found ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Unprocessable"

  # ----------------------------------------------------------------- rules
  /rules:
    get:
      operationId: listRules
      summary: Busca regras
      description: Regras da organização e regras globais, filtradas por texto (`q`) e estado.
      tags: [ rules ]
      parameters:
        - name: q
          in: query
          description: Busca por título e corpo.
          schema:
            type: string
            maxLength: 100
            x-limit: text.rule_picker_search
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/RuleStatus"
        - name: scope
          in: query
          schema:
            $ref: "#/components/schemas/RuleScope"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de regras.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
    post:
      operationId: createRule
      summary: Cria uma regra
      description: |
        Salva a regra em linguagem natural e, por padrão, compila para SQL e avalia contra o
        histórico confirmado (gasta créditos de modelo). Nasce `draft` sem compilar ou
        `candidate` compilada.
      tags: [ rules ]
      x-spends-credits: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleCreateRequest"
      responses:
        "201":
          description: Regra criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: Texto fora do limite ou regra que não compila.
          x-error-codes: [ text_too_long, rule_compile_failed ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /rules/{id}/versions:
    post:
      operationId: createRuleVersion
      summary: Cria uma nova versão da regra
      description: Mantém o `id`, incrementa `version`, recompila e reavalia. A versão anterior continua ativa até a
        nova ser promovida.
      tags: [ rules ]
      x-spends-credits: true
      parameters:
        - $ref: "#/components/parameters/RuleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleVersionRequest"
      responses:
        "201":
          description: Nova versão.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          description: Regras globais são só leitura para organizações.
          x-error-codes: [ rule_read_only ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Regra não encontrada.
          x-error-codes: [ rule_not_found ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: Texto fora do limite ou regra que não compila.
          x-error-codes: [ text_too_long, rule_compile_failed ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /rules/{id}/promote:
    post:
      operationId: promoteRule
      summary: Promove uma regra
      description: |
        `candidate` → `verified` exige histórico sem falsos positivos; `verified` → `trusted`
        passa a aplicar a regra automaticamente em toda execução. Só administradores promovem
        regras globais (API admin).
      tags: [ rules ]
      parameters:
        - $ref: "#/components/parameters/RuleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RulePromoteRequest"
      responses:
        "200":
          description: Regra promovida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Regra global.
          x-error-codes: [ rule_read_only ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Regra não encontrada.
          x-error-codes: [ rule_not_found ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Sem histórico suficiente.
          x-error-codes: [ rule_not_promotable ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --------------------------------------------------------------- billing
  /billing/status:
    get:
      operationId: getBillingStatus
      summary: Disponibilidade de compras e assinatura atual
      description: Informa se o usuário pode comprar, o modo de pagamento, bloqueios e a assinatura da organização.
      tags: [ billing ]
      security:
        - cookieSession: []
      responses:
        "200":
          description: Estado da cobrança da organização e deste usuário.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /billing/checkout:
    post:
      operationId: createCheckout
      summary: Inicia a assinatura de um plano
      description: Cria uma sessão de checkout no Stripe e devolve a URL. Planos e preços vêm de `GET /plans`.
      tags: [ billing ]
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "200":
          description: Sessão de checkout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "400":
          description: Plano desconhecido ou cupom inválido.
          x-error-codes: [ plan_unknown, coupon_invalid, validation_failed ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: O Stripe não respondeu.
          x-error-codes: [ checkout_failed ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Cobrança indisponível ou desativada.
          x-error-codes: [ billing_unavailable, kill_switch_enabled ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /billing/portal:
    post:
      operationId: createBillingPortal
      summary: Abre o portal de cobrança
      description: URL do portal do Stripe para trocar cartão, ver faturas ou cancelar.
      tags: [ billing ]
      security:
        - cookieSession: []
      responses:
        "200":
          description: URL do portal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: Sem assinatura.
          x-error-codes: [ subscription_required ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /billing/topup:
    post:
      operationId: createTopup
      summary: Compra créditos avulsos
      description: Cria um checkout de pagamento único. Os créditos entram pelo webhook do Stripe e valem por 12 meses.
      tags: [ billing ]
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopupRequest"
      responses:
        "200":
          description: Sessão de checkout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "400":
          description: Valor abaixo do mínimo.
          x-error-codes: [ topup_below_minimum, validation_failed ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: Recarga exige assinatura ativa.
          x-error-codes: [ subscription_required, subscription_inactive ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /credits:
    get:
      operationId: getCredits
      summary: Saldo de créditos
      description: Saldo, reservas em execuções ativas e o que vence quando.
      tags: [ credits ]
      responses:
        "200":
          description: Saldo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /credits/ledger:
    get:
      operationId: listCreditLedger
      summary: Ledger de créditos
      description: Toda movimentação, mais recente primeiro, com o saldo após cada lançamento.
      tags: [ credits ]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: run_id
          in: query
          schema:
            $ref: "#/components/schemas/RunId"
      responses:
        "200":
          description: Página do ledger.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /webhooks/stripe:
    post:
      operationId: receiveStripeWebhook
      summary: Recebe eventos do Stripe
      description: |
        Sem autenticação de usuário: a assinatura `Stripe-Signature` é verificada com
        `STRIPE_WEBHOOK_SECRET` sobre o corpo bruto. Eventos já processados devolvem 200 e
        são ignorados. Créditos também são deduplicados por fatura ou sessão de checkout.
      tags: [ billing ]
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripeEvent"
      responses:
        "200":
          description: Evento processado.
        "400":
          description: Assinatura inválida ou corpo ilegível.
          x-error-codes: [ webhook_signature_invalid, invalid_json ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # -------------------------------------------------------- customizations
  /customizations:
    post:
      operationId: createCustomization
      summary: Pede uma personalização da interface
      description: |-
        Propõe preferências para o próprio espaço. Incluído no plano pago ou isenção de QA; sem cobrança adicional. Exemplos exatos funcionam sem LLM. Outros pedidos usam ui_planner. Apenas proprietários e administradores. Idempotency-Key deve ser UUID.
      tags: [ customizations ]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomizationRequest"
      responses:
        "200":
          description: Resposta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Resposta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Resposta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - cookieSession: []

  /customizations/{id}:
    get:
      operationId: getCustomization
      summary: Consulta uma personalização
      description: Estado, manifesto proposto e, quando recusada, o motivo.
      tags: [ customizations ]
      parameters:
        - $ref: "#/components/parameters/CustomizationId"
      responses:
        "200":
          description: A personalização.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Personalização não encontrada.
          x-error-codes: [ customization_not_found ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - cookieSession: []

  /customizations/{id}/approve:
    post:
      operationId: approveCustomization
      summary: Aplica a personalização proposta
      description: Aplica uma proposta planned cuja base ainda é a versão atual. Repetir a mesma aprovação não cria
        outra versão.
      tags: [ customizations ]
      parameters:
        - $ref: "#/components/parameters/CustomizationId"
      responses:
        "200":
          description: Resposta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Personalização não encontrada.
          x-error-codes: [ customization_not_found ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Ainda não há proposta para aprovar.
          x-error-codes: [ customization_not_approvable ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - cookieSession: []

  # -------------------------------------------------------------- api keys
  /api-keys:
    get:
      operationId: listApiKeys
      summary: Lista as chaves de API
      description: Nunca devolve o segredo; só prefixo, escopos e último uso.
      tags: [ api-keys ]
      security:
        - cookieSession: []
      responses:
        "200":
          description: Chaves.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createApiKey
      summary: Cria uma chave de API
      description: |
        O segredo completo (`dm_live_<id>_<secret>`) aparece uma única vez na resposta; só o
        HMAC (com DM_APIKEY_PEPPER) fica guardado. Limitado pelo plano.
      tags: [ api-keys ]
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyCreateRequest"
      responses:
        "201":
          description: Chave criada (segredo visível só agora).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Limite de chaves ou faixa fora do plano.
          x-error-codes: [ api_keys_limit_reached, lane_not_allowed ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api-keys/{id}:
    delete:
      operationId: revokeApiKey
      summary: Revoga uma chave de API
      description: Imediato; requisições em andamento com a chave terminam, novas recebem `invalid_api_key`.
      tags: [ api-keys ]
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/ApiKeyId"
      responses:
        "204":
          description: Chave revogada.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ------------------------------------------------------ webhook endpoints
  /webhook-endpoints:
    get:
      operationId: listWebhookEndpoints
      summary: Lista os endpoints de webhook
      description: Endpoints HTTPS da organização que recebem os eventos de saída.
      tags: [ webhooks ]
      security:
        - cookieSession: []
        - apiKey: []
      responses:
        "200":
          description: Endpoints.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createWebhookEndpoint
      summary: Registra um endpoint de webhook
      description: O segredo de assinatura aparece uma única vez. Só URLs HTTPS; a entrega tem 5 tentativas com
        backoff exponencial.
      tags: [ webhooks ]
      security:
        - cookieSession: []
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEndpointCreateRequest"
      responses:
        "201":
          description: Endpoint criado (segredo visível só agora).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Limite do plano.
          x-error-codes: [ plan_limit_reached ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /webhook-endpoints/{id}:
    delete:
      operationId: deleteWebhookEndpoint
      summary: Remove um endpoint de webhook
      description: Entregas pendentes são descartadas.
      tags: [ webhooks ]
      security:
        - cookieSession: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/WebhookEndpointId"
      responses:
        "204":
          description: Endpoint removido.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------- public
  /plans:
    get:
      operationId: listPlans
      summary: Planos e preços
      description: Preços em centavos de dólar. Cartão em USD; o país é informativo nesta versão.
      tags: [ public ]
      security: []
      parameters:
        - name: country
          in: query
          description: País ISO 3166-1 alpha-2 (padrão `BR`).
          schema:
            type: string
            pattern: "^[A-Z]{2}$"
            default: BR
      responses:
        "200":
          description: Planos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlansResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /healthz:
    get:
      operationId: healthz
      summary: Processo vivo
      description: Não toca o banco. Usado pelo balanceador.
      tags: [ public ]
      security: []
      responses:
        "200":
          description: Vivo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: Em manutenção.
          x-error-codes: [ maintenance ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /readyz:
    get:
      operationId: readyz
      summary: Pronto para receber tráfego
      description: Verifica banco, storage e harness. `503` tira a instância do balanceador.
      tags: [ public ]
      security: []
      responses:
        "200":
          description: Pronto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: Alguma dependência indisponível.
          x-error-codes: [ service_unavailable, harness_unavailable, storage_unavailable ]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"

  /version:
    get:
      operationId: version
      summary: Versão em execução
      description: Versão semântica, commit e data da build.
      tags: [ public ]
      security: []
      responses:
        "200":
          description: Versão.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /workspace:
    get:
      operationId: getWorkspace
      summary: Lê preferências, permissões e histórico do espaço
      description: Retorna o manifesto ativo, as operações fixas e as permissões da organização autenticada.
      tags:
        - customizations
      security:
        - cookieSession: []
      responses:
        "200":
          description: Resposta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /workspace/rollback:
    post:
      operationId: rollbackWorkspace
      summary: Restaura uma versão do espaço
      description: Cria uma nova versão copiando uma versão anterior da própria organização.
      tags:
        - customizations
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version
              additionalProperties: false
              properties:
                version:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Resposta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Resposta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

# ================================================================== webhooks
webhooks:
  run.completed:
    post:
      operationId: webhookRunCompleted
      summary: Execução concluída
      description: Enviado quando uma execução termina com sucesso. Inclui o resumo; os achados vêm por `GET
        /runs/{id}/findings`.
      tags: [ webhooks ]
      security: []
      parameters:
        - $ref: "#/components/parameters/DmSignature"
        - $ref: "#/components/parameters/DmEventId"
        - $ref: "#/components/parameters/DmEventType"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookRunCompleted"
      responses:
        "200":
          description: Recebido. Qualquer 2xx conta como entregue.
        "4XX":
          description: Rejeitado; a docmatch tenta de novo até 5 vezes com backoff exponencial.
  run.failed:
    post:
      operationId: webhookRunFailed
      summary: Execução falhou
      description: Enviado quando uma execução falha. `error.code` é um código de `errors.yaml`; créditos não gastos
        já foram devolvidos.
      tags: [ webhooks ]
      security: []
      parameters:
        - $ref: "#/components/parameters/DmSignature"
        - $ref: "#/components/parameters/DmEventId"
        - $ref: "#/components/parameters/DmEventType"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookRunFailed"
      responses:
        "200":
          description: Recebido.
        "4XX":
          description: Rejeitado; será reenviado.
  run.needs_approval:
    post:
      operationId: webhookRunNeedsApproval
      summary: Execução aguarda aprovação de orçamento
      description: Enviado quando a execução para por teto ou ferramentas novas. Aprove com `POST
        /runs/{id}/approve-quote`.
      tags: [ webhooks ]
      security: []
      parameters:
        - $ref: "#/components/parameters/DmSignature"
        - $ref: "#/components/parameters/DmEventId"
        - $ref: "#/components/parameters/DmEventType"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookRunNeedsApproval"
      responses:
        "200":
          description: Recebido.
        "4XX":
          description: Rejeitado; será reenviado.
  credits.low:
    post:
      operationId: webhookCreditsLow
      summary: Créditos abaixo do limiar
      description: Enviado uma vez por ciclo quando o saldo disponível cai abaixo de 10% do plano (ou de 50 créditos).
      tags: [ webhooks ]
      security: []
      parameters:
        - $ref: "#/components/parameters/DmSignature"
        - $ref: "#/components/parameters/DmEventId"
        - $ref: "#/components/parameters/DmEventType"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookCreditsLow"
      responses:
        "200":
          description: Recebido.
        "4XX":
          description: Rejeitado; será reenviado.

# ================================================================ components
components:
  securitySchemes:
    extensionSession:
      type: http
      scheme: bearer
      bearerFormat: dmxA1_<session>.<secret>
      description: >-
        Sessão da extensão. Permite contas, projetos e resultados conforme o vínculo atual;
        não administra cobrança, pessoas, senhas ou chaves. Não é uma chave de API e usa preços do app.
    cookieSession:
      type: apiKey
      in: cookie
      name: dm_session
      description: Sessão aberta pelo login (HttpOnly, Secure, SameSite=Lax). Renovada em `POST /auth/refresh`.
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: dm_live_<id>_<secret>
      description: Chave de API criada em `POST /api-keys`. O servidor guarda só o HMAC da chave.

  parameters:
    InvitationPath:
      name: invitation
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/InvitationId"
    TeamUserPath:
      name: user
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UserId"
    OrgContext:
      name: X-Docmatch-Org
      in: header
      required: false
      description: Conta escolhida nesta requisição. A sessão precisa de vínculo ativo. Uma chave de API só aceita
        sua própria conta. Não modifica outras abas.
      schema:
        $ref: "#/components/schemas/OrgId"
    ProjectPath:
      name: project
      in: path
      required: true
      description: Projeto da conta selecionada.
      schema:
        $ref: "#/components/schemas/ProjectId"
    DocumentPath:
      name: document
      in: path
      required: true
      description: Versão do documento no projeto.
      schema:
        $ref: "#/components/schemas/DocumentId"
    ProjectUploadPath:
      name: upload
      in: path
      required: true
      description: Upload recebido no projeto.
      schema:
        $ref: "#/components/schemas/UploadId"
    ProjectVersion:
      name: version
      in: query
      required: true
      description: Última versão recebida; uma edição concorrente retorna conflito.
      schema:
        type: integer
        minimum: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Chave única por tentativa (UUID, por exemplo). Obrigatória em operações que gastam créditos;
        guardada por 24 h.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        x-limit: ids.idempotency_key_max
    Cursor:
      name: cursor
      in: query
      description: Cursor opaco devolvido em `next_cursor`.
      schema:
        type: string
        maxLength: 128
        x-limit: ids.idempotency_key_max
    Limit:
      name: limit
      in: query
      description: Itens por página.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    RunId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/RunId"
    FindingId:
      name: fid
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/FindingId"
    UploadId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UploadId"
    WorkflowId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/WorkflowId"
    RuleId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/RuleId"
    CustomizationId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CustomizationId"
    ApiKeyId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ApiKeyId"
    WebhookEndpointId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/WebhookEndpointId"
    DmSignature:
      name: DM-Signature
      in: header
      required: true
      description: |
        `t=<unix>,v1=<hex>` onde `v1` é HMAC-SHA256 (segredo do endpoint) de `<t>.<corpo bruto>`.
        Rejeite se `|agora - t|` > 5 minutos.
      schema:
        type: string
        pattern: "^t=[0-9]{10},v1=[0-9a-f]{64}$"
    DmEventId:
      name: DM-Event-Id
      in: header
      required: true
      description: Id do evento (para deduplicar reenvios).
      schema:
        $ref: "#/components/schemas/EventId"
    DmEventType:
      name: DM-Event-Type
      in: header
      required: true
      schema:
        $ref: "#/components/schemas/WebhookEventType"

  headers:
    RateLimitLimit:
      description: Requisições permitidas na janela atual.
      schema:
        type: integer
    RateLimitRemaining:
      description: Requisições restantes na janela atual.
      schema:
        type: integer
    RateLimitReset:
      description: Segundos até a janela reiniciar.
      schema:
        type: integer
    RetryAfter:
      description: Segundos a esperar antes de tentar de novo.
      schema:
        type: integer
    RequestId:
      description: Id da requisição (o mesmo de `request_id` no envelope de erro).
      schema:
        type: string

  responses:
    BadRequest:
      description: Entrada inválida.
      x-status: 400
      x-error-codes: [ validation_failed, invalid_json, control_characters, missing_idempotency_key ]
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            validation:
              value:
                code: validation_failed
                message: Alguns campos estão inválidos. Confira os detalhes.
                request_id: req_01JBXKEN8R4S9T0V1W2X3Y4Z5A
                details:
                  fields:
                    - path: /display_name
                      code: text_too_long
                      max: 80
    Unauthorized:
      description: Sem sessão ou chave válida.
      x-status: 401
      x-error-codes: [ unauthenticated, session_expired, invalid_api_key ]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PaymentRequired:
      description: Créditos insuficientes ou assinatura necessária.
      x-status: 402
      x-error-codes: [ insufficient_credits, subscription_required, subscription_inactive ]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Sem permissão.
      x-status: 403
      x-error-codes: [ forbidden, api_key_scope_denied, account_suspended, account_deletion_pending, plan_limit_reached ]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Não encontrado.
      x-status: 404
      x-error-codes: [ not_found, upload_not_found ]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflito com o estado atual ou chave de idempotência reutilizada.
      x-status: 409
      x-error-codes: [ conflict, idempotency_key_reused, idempotency_in_progress ]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: Texto fora dos limites.
      x-status: 422
      x-error-codes: [ text_too_long ]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Limite de requisições.
      x-status: 429
      x-error-codes: [ rate_limited, too_many_attempts ]
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Dependência indisponível ou função desativada.
      x-status: 503
      x-error-codes:
        [
          service_unavailable,
          harness_unavailable,
          storage_unavailable,
          model_unavailable,
          kill_switch_enabled,
          maintenance
        ]
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    ProjectUploadRequest:
      type: object
      required:
        - kind
        - file_name
        - size_bytes
        - mime
      properties:
        kind:
          $ref: "#/components/schemas/UploadKind"
        file_name:
          type: string
          minLength: 1
          maxLength: 255
          x-limit: files.uploaded_file_name_bytes
          description: Nome original. O limite é em bytes UTF-8 após NFC; sem `/`, `\` nem
            caracteres de controle.
        size_bytes:
          type: integer
          minimum: 1
        mime:
          type: string
          pattern: ^[a-z0-9!#$&^_.+-]+/[a-z0-9!#$&^_.+-]+$
          description: Tipo declarado; o scanner sniffa o real e pode rejeitar.
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Opcional; conferido em `complete`.
        role:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,39}$
          description: "Papel no fluxo (ex.: `bank_statement`)."
        replaces_id:
          $ref: "#/components/schemas/DocumentId"
          description: Prepara uma substituição sem retirar a versão anterior. Após a
            verificação, confirme pelo endpoint documents/{document}/replace.
      additionalProperties: false
    Email:
      type: string
      format: email
      maxLength: 254
      x-limit: text.email
    InvitationId:
      type: string
      pattern: ^inv_[0-9A-Z]{26}$
    SeatRole:
      type: string
      enum:
        - uploader
        - reconciler
    InvitationStatus:
      type: string
      enum:
        - pending
        - accepted
        - declined
        - expired
        - revoked
    TeamMember:
      type: object
      required:
        - id
        - name
        - email
        - role
        - joined_at
      properties:
        id:
          $ref: "#/components/schemas/UserId"
        name:
          type: string
        email:
          $ref: "#/components/schemas/Email"
        role:
          $ref: "#/components/schemas/MembershipRole"
        joined_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    TeamInvitation:
      type: object
      required:
        - id
        - email
        - role
        - status
        - expires_at
        - sent_at
      properties:
        id:
          $ref: "#/components/schemas/InvitationId"
        email:
          $ref: "#/components/schemas/Email"
        role:
          $ref: "#/components/schemas/SeatRole"
        status:
          $ref: "#/components/schemas/InvitationStatus"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        sent_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    Team:
      type: object
      required:
        - id
        - name
        - kind
        - role
        - capabilities
        - members
        - invitations
        - member_limit
        - seat_price
        - can_invite
      properties:
        id:
          $ref: "#/components/schemas/OrgId"
        name:
          type: string
        kind:
          type: string
          enum:
            - personal
            - team
        role:
          $ref: "#/components/schemas/MembershipRole"
        capabilities:
          $ref: "#/components/schemas/AccountCapabilities"
        members:
          type: array
          items:
            $ref: "#/components/schemas/TeamMember"
          maxItems: 100
          x-limit: ids.account_members_max
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/TeamInvitation"
          maxItems: 100
          x-limit: ids.account_members_max
        member_limit:
          type: integer
          minimum: 1
          description: Limite operacional de membros e convites pendentes; inclui o responsável.
        seat_price:
          type: integer
          const: 0
          description: Sem cobrança adicional por assento nesta versão.
        can_invite:
          type: boolean
      additionalProperties: false
    TeamCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          x-limit: text.company_name
      additionalProperties: false
    TeamInvite:
      type: object
      required:
        - email
        - role
      properties:
        email:
          $ref: "#/components/schemas/Email"
        role:
          $ref: "#/components/schemas/SeatRole"
      additionalProperties: false
    TeamRoleChange:
      type: object
      required:
        - role
      properties:
        role:
          $ref: "#/components/schemas/SeatRole"
      additionalProperties: false
    TeamTransfer:
      type: object
      required:
        - user_id
      properties:
        user_id:
          $ref: "#/components/schemas/UserId"
      additionalProperties: false
    PendingInvitationAnswer:
      type: object
      required:
        - accept
      properties:
        accept:
          type: boolean
      additionalProperties: false
    InvitationInbox:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/InvitationPreview"
        next_cursor:
          $ref: "#/components/schemas/InvitationId"
      additionalProperties: false
    InvitationPreviewRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: Segredo do convite recebido por e-mail. Enviar somente no corpo; nunca em URLs da API.
      additionalProperties: false
    InvitationPreview:
      type: object
      required:
        - id
        - organization
        - email_hint
        - role
        - status
        - expires_at
        - email_matches
      properties:
        id:
          $ref: "#/components/schemas/InvitationId"
        organization:
          type: string
        email_hint:
          type: string
        role:
          $ref: "#/components/schemas/SeatRole"
        status:
          $ref: "#/components/schemas/InvitationStatus"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        email_matches:
          type: boolean
      additionalProperties: false
    InvitationAnswer:
      type: object
      required:
        - token
        - accept
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: Segredo do convite recebido por e-mail. Enviar somente no corpo; nunca em URLs da API.
        accept:
          type: boolean
      additionalProperties: false
    InvitationAnswerResult:
      type: object
      required:
        - organization_id
        - accepted
      properties:
        organization_id:
          $ref: "#/components/schemas/OrgId"
        accepted:
          type: boolean
      additionalProperties: false
    ProjectId:
      type: string
      pattern: ^prj_[0-9A-Z]{26}$
    DocumentId:
      type: string
      pattern: ^doc_[0-9A-Z]{26}$
    MembershipRole:
      type: string
      enum:
        - owner
        - admin
        - member
        - viewer
        - uploader
        - reconciler
    AccountCapabilities:
      type: object
      required:
        - manage_account
        - create_project
        - reconcile
        - read_results
        - upload
      properties:
        manage_account:
          type: boolean
        create_project:
          type: boolean
        reconcile:
          type: boolean
        read_results:
          type: boolean
        upload:
          type: boolean
      additionalProperties: false
    OrganizationMembership:
      type: object
      required:
        - id
