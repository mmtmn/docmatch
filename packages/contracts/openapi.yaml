openapi: 3.1.0
info:
  title: docmatch API
  version: 1.0.0
  summary: Conciliação de documentos, planilhas, e-mails, áudios e vídeos com evidência.
  description: |
    API pública da docmatch (v1). Tudo em pt-BR; identificadores e enums em inglês.

    ## Convenções

    - **Envelope de erro.** Toda resposta 4xx/5xx é `{code, message, request_id, details?}`.
      `code` é um código estável de `errors.yaml` (snake_case); `message` é a frase em pt-BR
      para mostrar ao usuário; `request_id` aparece também no header `X-Request-Id`.
    - **Dinheiro** é inteiro em centavos (ou na menor unidade da moeda) com `currency` ISO 4217.
      **Créditos** (tokens docmatch) são inteiros.
    - **Limites de texto** vêm de `limits.yaml`: cada `maxLength` aqui carrega `x-limit` com a
      chave correspondente, e o CI falha se discordarem.
    - **Idempotência.** Toda operação que pode gastar créditos exige o header `Idempotency-Key`
      (chave única por tentativa, até 128 caracteres). A mesma chave com o mesmo corpo devolve
      a mesma resposta; com corpo diferente devolve `409 idempotency_key_reused`.
    - **Limite de requisições.** Toda resposta traz `RateLimit-Limit`, `RateLimit-Remaining` e
      `RateLimit-Reset`; um `429 rate_limited` traz também `Retry-After`.
    - **Autenticação.** Sessão em cookie `HttpOnly` (apps e site) ou chave de API no header
      `Authorization: Bearer dm_live_<id>_<secret>` (integrações). Endpoints públicos têm
      `security: []`.
    - **Paginação** por cursor opaco: `cursor` + `limit` na consulta, `next_cursor` na resposta
      (nulo na última página).
    - **Eventos em tempo real** por SSE em `GET /runs/{id}/events`; cada evento tem `id`
      (sequência) para retomar com `Last-Event-ID`.
    - **Webhooks de saída** assinados com `DM-Signature: t=<unix>,v1=<hmac-sha256-hex>`
      (ver a seção *webhooks*).
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only

servers:
  - url: "{baseUrl}/v1"
    description: Base da API (DM_API_BASE_URL) + prefixo da versão.
    variables:
      baseUrl:
        default: "http://localhost:8080"
        description: Valor de DM_API_BASE_URL, sem barra final.

security:
  - cookieSession: []
  - apiKey: []

tags:
  - name: auth
    description: Login com Google, Apple ou e-mail; sessão em cookie HttpOnly.
  - name: account
    description: Conta e organização do usuário autenticado (LGPD incluída).
  - name: uploads
    description: Envio de documentos (S3, POST pré-assinado) e mídia (R2, PUT pré-assinado), com verificação de segurança.
  - name: runs
    description: Estimativas, execuções, achados, eventos em tempo real e exportação.
  - name: workflows
    description: Fluxos de conciliação reutilizáveis.
  - name: rules
    description: Regras como hipóteses executáveis, versionadas e promovíveis.
  - name: billing
    description: Assinaturas, recargas e webhook do Stripe.
  - name: credits
    description: Saldo de créditos e ledger.
  - name: customizations
    description: Personalização da interface a partir de um pedido em linguagem natural.
  - name: api-keys
    description: Chaves de API para integrações.
  - name: webhooks
    description: Endpoints de webhook de saída e os eventos que a docmatch envia.
  - name: public
    description: Planos, saúde e versão. Sem autenticação.

paths:
  # ------------------------------------------------------------------ auth
  /auth/google/start:
    post:
      operationId: authGoogleStart
      summary: Inicia o login com Google
      description: Gera `state` e PKCE, guarda em cookie temporário e devolve a URL de autorização.
      tags: [auth]
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthStartRequest"
      responses:
        "200":
          description: URL de autorização para redirecionar o usuário.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStartResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/google/callback:
    get:
      operationId: authGoogleCallback
      summary: Conclui o login com Google
      description: |
        Chamado pelo Google. Troca o `code` por tokens, cria ou localiza o usuário, abre a sessão
        (`Set-Cookie`) e redireciona para `redirect_to`. Em erro, redireciona para a página de
        login com `?error=<code>`.
      tags: [auth]
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Preenchido pelo Google quando o usuário cancela.
          schema:
            type: string
      responses:
        "200":
          description: "Sessão aberta (clientes com `Accept: application/json` recebem a sessão em vez do redirecionamento)."
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "303":
          description: Sessão aberta; redireciona para o app.
          headers:
            Set-Cookie:
              description: Cookie de sessão `dm_session` (HttpOnly, Secure, SameSite=Lax).
              schema:
                type: string
            Location:
              schema:
                type: string
        "400":
          description: "`state` não confere ou o provedor devolveu erro."
          x-error-codes: [oauth_state_mismatch]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: E-mail não verificado no provedor ou conta suspensa.
          x-error-codes: [oauth_email_unverified, account_suspended]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: O provedor não respondeu.
          x-error-codes: [oauth_provider_error]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/apple/start:
    post:
      operationId: authAppleStart
      summary: Inicia o login com Apple
      description: Gera `state` e `nonce` e devolve a URL de autorização (modo `form_post`).
      tags: [auth]
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthStartRequest"
      responses:
        "200":
          description: URL de autorização.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStartResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/apple/callback:
    post:
      operationId: authAppleCallback
      summary: Conclui o login com Apple
      description: |
        Recebe o `form_post` da Apple (web) ou o `identity_token` obtido nativamente (iOS).
        Valida o token contra as chaves públicas da Apple, abre a sessão e redireciona (web) ou
        devolve a sessão (nativo).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/AppleCallbackForm"
          application/json:
            schema:
              $ref: "#/components/schemas/AppleNativeCallback"
      responses:
        "200":
          description: Sessão aberta (chamada nativa).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "303":
          description: Sessão aberta; redireciona para o app (chamada web).
          headers:
            Set-Cookie:
              schema:
                type: string
            Location:
              schema:
                type: string
        "400":
          description: "`state` não confere ou token inválido."
          x-error-codes: [oauth_state_mismatch, validation_failed]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Conta suspensa ou e-mail não verificado.
          x-error-codes: [oauth_email_unverified, account_suspended]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: A Apple não respondeu.
          x-error-codes: [oauth_provider_error]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/email/start:
    post:
      operationId: authEmailStart
      summary: Envia um código de login por e-mail
      description: Cria um desafio e envia um código de 6 dígitos (válido por poucos minutos). A resposta é a mesma exista ou não a conta.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailStartRequest"
      responses:
        "202":
          description: Código enviado (ou silenciosamente ignorado).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailStartResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/email/verify:
    post:
      operationId: authEmailVerify
      summary: Confirma o código recebido por e-mail
      description: Abre a sessão quando o código confere. Cinco tentativas por desafio.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailVerifyRequest"
      responses:
        "200":
          description: Sessão aberta.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Código inválido.
          x-error-codes: [email_code_invalid, validation_failed]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Conta suspensa ou em processo de exclusão.
          x-error-codes: [account_suspended, account_deletion_pending]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Desafio não encontrado.
          x-error-codes: [email_challenge_not_found]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Código expirado.
          x-error-codes: [email_code_expired]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Tentativas esgotadas.
          x-error-codes: [too_many_attempts, rate_limited]
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/methods:
    get:
      operationId: authMethods
      summary: Formas de entrar disponíveis
      description: |
        Quais logins esta instalação oferece agora (um provedor sem chave configurada aparece
        como `false`). O site e os apps mostram só os botões que funcionam.
      tags: [auth]
      security: []
      responses:
        "200":
          description: Formas de entrar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMethods"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/google/native:
    post:
      operationId: authGoogleNative
      summary: Entra com o token do Google obtido pelo app
      description: |
        Para os apps Android e iOS: o `id_token` vem do login do próprio Google no aparelho. A
        audiência precisa ser o client id do servidor ou um de `GOOGLE_OAUTH_NATIVE_CLIENT_IDS`.
        A conta é resolvida como no site (sujeito do Google, depois e-mail verificado), então a
        mesma pessoa cai na mesma conta em qualquer aparelho.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleNativeRequest"
      responses:
        "200":
          description: Sessão aberta.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Token inválido, expirado ou de outra audiência.
          x-error-codes: [oauth_state_mismatch, validation_failed]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: E-mail do Google não verificado, conta suspensa ou em processo de exclusão.
          x-error-codes: [oauth_email_unverified, account_suspended, account_deletion_pending]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: Login com Google não configurado.
          x-error-codes: [service_unavailable]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/dev/login:
    post:
      operationId: authDevLogin
      summary: Entra sem provedor (só desenvolvimento local)
      description: |
        Existe só com `DM_DEV_LOGIN` ligado, que a API recusa fora de `DM_ENV=dev`. Cria a conta no
        primeiro uso e credita a organização uma vez por dia, para rodar exemplos sem Stripe.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevLoginRequest"
      responses:
        "200":
          description: Sessão aberta.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: E-mail inválido.
          x-error-codes: [validation_failed]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/password/login:
    post:
      operationId: authPasswordLogin
      summary: Entra com e-mail e senha
      description: |
        Senha opcional, definida em `PUT /me/password`. A resposta a e-mail desconhecido e a senha
        errada é a mesma (`invalid_credentials`). Limite por IP e por e-mail com bloqueio
        exponencial; `totp_code` é reservado para o segundo fator.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLoginRequest"
      responses:
        "200":
          description: Sessão aberta.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: E-mail ou senha incorretos.
          x-error-codes: [invalid_credentials]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Conta suspensa ou em processo de exclusão.
          x-error-codes: [account_suspended, account_deletion_pending]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/refresh:
    post:
      operationId: authRefresh
      summary: Renova a sessão
      description: Rotaciona o cookie de sessão. Só com sessão em cookie; chaves de API não têm sessão.
      tags: [auth]
      security:
        - cookieSession: []
      responses:
        "200":
          description: Sessão renovada.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      operationId: authLogout
      summary: Encerra a sessão
      description: Invalida a sessão atual e limpa o cookie.
      tags: [auth]
      security:
        - cookieSession: []
      responses:
        "204":
          description: Sessão encerrada.
        "401":
          $ref: "#/components/responses/Unauthorized"

  # --------------------------------------------------------------- account
  /me:
    get:
      operationId: getMe
      summary: Dados do usuário autenticado
      description: Usuário, organização, plano, créditos e limites efetivos do plano.
      tags: [account]
      responses:
        "200":
          description: Perfil completo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateMe
      summary: Atualiza nome, empresa e notificações
      description: Campos ausentes não mudam. Textos passam por normalização NFC e pelos limites de `limits.yaml`.
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeUpdate"
      responses:
        "200":
          description: Perfil atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: deleteMe
      summary: Pede a exclusão da conta (LGPD)
      description: |
        Agenda a exclusão da conta e de todos os dados em 7 dias; até lá o login é bloqueado com
        `account_deletion_pending` e o pedido pode ser cancelado pelo suporte. Assinaturas ativas
        são canceladas no Stripe.
      tags: [account]
      security:
        - cookieSession: []
      responses:
        "202":
          description: Exclusão agendada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionScheduled"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Já existe um pedido de exclusão.
          x-error-codes: [conflict]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me/export:
    get:
      operationId: exportMe
      summary: Exportação dos dados pessoais (LGPD)
      description: |
        Pede (ou consulta) a exportação de tudo que a conta tem: perfil, execuções, achados, regras
        e ledger. Quando pronta, a resposta traz uma URL assinada válida por 24 horas.
      tags: [account]
      security:
        - cookieSession: []
      responses:
        "200":
          description: Estado da exportação.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /me/export/download:
    get:
      operationId: downloadMeExport
      summary: Baixa a exportação dos dados pessoais
      description: |
        Destino da `download_url` de `GET /me/export`: o `token` é assinado pelo servidor e vale
        até `expires_at`. Não exige sessão; um token inválido, expirado ou de exportação ainda não
        pronta responde `404` sem detalhes.
      tags: [account]
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Arquivo zip com um JSON por conjunto de dados.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  /me/sessions:
    get:
      operationId: listDevices
      summary: Aparelhos com sessão aberta
      description: |
        Cada login (navegador ou instalação do app) é uma sessão presa àquele aparelho, todas na
        mesma conta. A sessão que faz a chamada vem primeiro, com `current: true`.
      tags: [account]
      responses:
        "200":
          description: Sessões ativas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/sessions/{id}:
    delete:
      operationId: revokeDevice
      summary: Encerra a sessão de um aparelho
      description: Encerrar a própria sessão também limpa os cookies desta resposta.
      tags: [account]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^ses_[0-9A-Z]{26}$"
      responses:
        "204":
          description: Sessão encerrada.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /me/password:
    put:
      operationId: setMePassword
      summary: Define ou troca a senha
      description: |
        Quem já tem senha informa `current_password`. Quem entrou por Google, Apple ou e-mail e
        ainda não tem senha precisa de uma sessão recente (`recent_login_required` caso contrário).
        Toda troca encerra as outras sessões do usuário.
      tags: [account]
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
      responses:
        "204":
          description: Senha definida.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Sem sessão ou senha atual incorreta.
          x-error-codes: [unauthenticated, session_expired, invalid_credentials]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Sessão antiga demais para definir a primeira senha.
          x-error-codes: [recent_login_required]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # --------------------------------------------------------------- uploads
  /uploads:
    post:
      operationId: createUpload
      summary: Pede uma URL pré-assinada para enviar um arquivo
      description: |
        Documentos vão para o S3 com um POST pré-assinado (política limita tipo e tamanho);
        mídia vai para o Cloudflare R2 com um PUT pré-assinado. O tamanho é validado contra o
        plano antes de emitir o ticket. O arquivo só fica utilizável depois de
        `POST /uploads/{id}/complete` e da verificação de segurança.
      tags: [uploads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
      responses:
        "201":
          description: Ticket de envio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadTicket"
        "400":
          description: Nome inválido ou campos faltando.
          x-error-codes: [validation_failed, upload_rejected_name]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: Arquivo maior que o permitido pelo plano.
          x-error-codes: [file_too_large, upload_rejected_size]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Tipo não suportado.
          x-error-codes: [upload_rejected_type]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /uploads/{id}/complete:
    post:
      operationId: completeUpload
      summary: Confirma o envio e dispara a verificação
      description: |
        Confere tamanho e hash, sniffa o tipo pelo conteúdo e põe o arquivo na fila do scanner
        (antivírus, bomba de descompactação, listas de reprodução). Responde `202` enquanto a
        verificação roda; o estado final aparece em `status`.
      tags: [uploads]
      parameters:
        - $ref: "#/components/parameters/UploadId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadCompleteRequest"
      responses:
        "200":
          description: Verificação concluída (arquivo pronto ou rejeitado).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "202":
          description: Verificação em andamento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: O objeto ainda não chegou ao storage.
          x-error-codes: [upload_incomplete]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Ticket expirado.
          x-error-codes: [upload_expired]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Conteúdo rejeitado.
          x-error-codes:
            - upload_checksum_mismatch
            - upload_rejected_malware
            - upload_rejected_bomb
            - upload_rejected_playlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ------------------------------------------------------------------ runs
  /runs/estimate:
    post:
      operationId: estimateRun
      summary: Estima o custo de uma execução
      description: |
        Devolve um orçamento assinado (`Quote`) com o custo esperado, o teto e o detalhamento.
        Não gasta créditos. O orçamento vale por `quote_ttl_minutes` (config/pricing.yaml).
        Traz também a duração esperada (`expected_seconds`, fila incluída) e `large`: nenhum
        pedido é recusado pelo tamanho; um pedido grande avisa quanto deve levar, e quem o iniciou
        recebe um e-mail quando ele terminar.
      tags: [runs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateRequest"
      responses:
        "200":
          description: Orçamento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Faixa não permitida no plano.
          x-error-codes: [lane_not_allowed, plan_limit_reached]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Algum arquivo ainda não está pronto.
          x-error-codes: [upload_not_ready]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Execução maior que o plano permite.
          x-error-codes: [run_too_large]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Limites de arquivos, duração ou texto.
          x-error-codes: [too_many_files, media_too_long, text_too_long]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /runs:
    get:
      operationId: listRuns
      summary: Lista execuções da organização
      description: Mais recentes primeiro. Filtra por estado e por fluxo.
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/RunStatus"
        - name: workflow_id
          in: query
          schema:
            $ref: "#/components/schemas/WorkflowId"
      responses:
        "200":
          description: Página de execuções.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createRun
      summary: Cria uma execução a partir de um orçamento aprovado
      description: |
        Reserva `cap_credits` no ledger e enfileira a execução. Exige `Idempotency-Key`. Se o
        orçamento tiver `requires_approval`, o cliente já está aprovando ao chamar. Se a execução
        precisar de mais do que o teto, ela para em `needs_approval` e emite um novo orçamento.
      tags: [runs]
      x-spends-credits: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunCreateRequest"
      responses:
        "202":
          description: Execução enfileirada.
          headers:
            Location:
              description: URL da execução.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          description: Corpo inválido, orçamento adulterado ou header ausente.
          x-error-codes: [validation_failed, quote_invalid_signature, missing_idempotency_key]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: Créditos insuficientes para reservar o teto.
          x-error-codes: [insufficient_credits, subscription_required]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Orçamento não encontrado.
          x-error-codes: [quote_not_found]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Orçamento não corresponde ao pedido, chave reutilizada ou arquivo não pronto.
          x-error-codes: [quote_mismatch, idempotency_key_reused, idempotency_in_progress, upload_not_ready]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Orçamento expirado.
          x-error-codes: [quote_expired]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Execuções simultâneas do plano esgotadas ou limite de requisições.
          x-error-codes: [concurrent_runs_exceeded, rate_limited]
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /runs/{id}:
    get:
      operationId: getRun
      summary: Consulta uma execução
      description: Estado, progresso, créditos reservados e gastos, resumo quando concluída.
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: A execução.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Execução não encontrada.
          x-error-codes: [run_not_found]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /runs/{id}/cancel:
    post:
      operationId: cancelRun
      summary: Cancela uma execução
      description: Para a execução e devolve os créditos não gastos. Execuções já terminadas não mudam.
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Execução cancelada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Execução não encontrada.
          x-error-codes: [run_not_found]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A execução já terminou.
          x-error-codes: [run_already_finished]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /runs/{id}/events:
    get:
      operationId: streamRunEvents
      summary: Eventos da execução em tempo real (SSE)
      description: |
        Fluxo `text/event-stream`. Cada mensagem tem `id` (sequência monotônica), `event` (um dos
        nomes abaixo) e `data` (JSON com o esquema do evento). O servidor envia `: ping` a cada
        15 s; a conexão fecha após `completed`, `failed` ou `needs_approval`. Para retomar, envie
        `Last-Event-ID` com a última sequência recebida.
      tags: [runs]
      x-sse-events:
        stage_started: "#/components/schemas/RunEventStageStarted"
        progress: "#/components/schemas/RunEventProgress"
        token_usage: "#/components/schemas/RunEventTokenUsage"
        finding: "#/components/schemas/RunEventFinding"
        match: "#/components/schemas/RunEventMatch"
        needs_approval: "#/components/schemas/RunEventNeedsApproval"
        completed: "#/components/schemas/RunEventCompleted"
        failed: "#/components/schemas/RunEventFailed"
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: Last-Event-ID
          in: header
          required: false
          description: Última sequência recebida; o fluxo recomeça do evento seguinte.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Fluxo de eventos.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/RunEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Execução não encontrada.
          x-error-codes: [run_not_found]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /runs/{id}/findings:
    get:
      operationId: listFindings
      summary: Lista os achados de uma execução
      description: Ordenados por severidade e valor em risco. Disponível enquanto a execução roda (parcial) e depois.
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: severity
          in: query
          description: Uma ou mais severidades, separadas por vírgula.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Severity"
          style: form
          explode: false
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/FindingStatus"
      responses:
        "200":
          description: Página de achados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Execução não encontrada.
          x-error-codes: [run_not_found]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /runs/{id}/findings/{fid}/feedback:
    post:
      operationId: giveFindingFeedback
      summary: Confirma, descarta ou resolve um achado
      description: O feedback alimenta a calibração da confiança e, nos planos com aprendizado, a proposta de regras.
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/FindingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindingFeedbackRequest"
      responses:
        "200":
          description: Achado atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Finding"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Execução ou achado não encontrado.
          x-error-codes: [run_not_found, finding_not_found]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /runs/{id}/export:
    get:
      operationId: exportRun
      summary: Exporta os resultados (xlsx, csv ou pdf)
      description: |
        Planilha com achados, casamentos e evidências; CSV só com achados; PDF com o relatório.
        Só para execuções concluídas. O arquivo é gerado sob demanda e cacheado.
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: format
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ExportFormat"
      responses:
        "200":
          description: O arquivo.
          headers:
            Content-Disposition:
              description: "`attachment; filename=\"docmatch-<run_id>.<ext>\"`"
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                $ref: "#/components/schemas/BinaryFile"
            text/csv:
              schema:
                type: string
            application/pdf:
              schema:
                $ref: "#/components/schemas/BinaryFile"
        "400":
          description: Formato não suportado.
          x-error-codes: [export_format_unsupported]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Execução não encontrada.
          x-error-codes: [run_not_found]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A execução ainda não terminou, ou o arquivo ainda está sendo gerado (tente de novo em instantes).
          x-error-codes: [run_not_completed, export_not_ready]
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /runs/{id}/approve-quote:
    post:
      operationId: approveRunQuote
      summary: Aprova o orçamento adicional de uma execução parada
      description: |
        Quando a execução para em `needs_approval` (ferramentas novas, teto atingido), o cliente
        aprova o novo orçamento recebido no evento. Reserva a diferença e retoma do checkpoint.
      tags: [runs]
      x-spends-credits: true
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveQuoteRequest"
      responses:
        "200":
          description: Execução retomada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          description: Orçamento adulterado ou header ausente.
          x-error-codes: [quote_invalid_signature, missing_idempotency_key, validation_failed]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: Créditos insuficientes para a diferença.
          x-error-codes: [insufficient_credits]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Execução ou orçamento não encontrado.
          x-error-codes: [run_not_found, quote_not_found]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A execução não está aguardando aprovação.
          x-error-codes: [run_not_awaiting_approval, idempotency_key_reused, quote_mismatch]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Orçamento expirado; a execução foi cancelada e os créditos devolvidos.
          x-error-codes: [quote_expired]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ------------------------------------------------------------- workflows
  /workflows:
    get:
      operationId: listWorkflows
      summary: Lista os fluxos da organização
      description: Ordenados por nome.
      tags: [workflows]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de fluxos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createWorkflow
      summary: Cria um fluxo
      description: A configuração segue `schemas/workflow-config.json`.
      tags: [workflows]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowConfig"
      responses:
        "201":
          description: Fluxo criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Alguma regra referenciada não existe.
          x-error-codes: [rule_not_found]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /workflows/{id}:
    get:
      operationId: getWorkflow
      summary: Consulta um fluxo
      description: Configuração completa e contagem de execuções.
      tags: [workflows]
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
      responses:
        "200":
          description: O fluxo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Fluxo não encontrado.
          x-error-codes: [workflow_not_found]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateWorkflow
      summary: Altera um fluxo
      description: Substitui só as seções enviadas (`sources`, `matching`, `rules`, ...). Execuções em andamento não mudam.
      tags: [workflows]
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowPatch"
      responses:
        "200":
          description: Fluxo atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Fluxo não encontrado.
          x-error-codes: [workflow_not_found, rule_not_found]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Unprocessable"

  # ----------------------------------------------------------------- rules
  /rules:
    get:
      operationId: listRules
      summary: Busca regras
      description: Regras da organização e regras globais, filtradas por texto (`q`) e estado.
      tags: [rules]
      parameters:
        - name: q
          in: query
          description: Busca por título e corpo.
          schema:
            type: string
            maxLength: 100
            x-limit: text.rule_picker_search
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/RuleStatus"
        - name: scope
          in: query
          schema:
            $ref: "#/components/schemas/RuleScope"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de regras.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
    post:
      operationId: createRule
      summary: Cria uma regra
      description: |
        Salva a regra em linguagem natural e, por padrão, compila para SQL e avalia contra o
        histórico confirmado (gasta créditos de modelo). Nasce `draft` sem compilar ou
        `candidate` compilada.
      tags: [rules]
      x-spends-credits: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleCreateRequest"
      responses:
        "201":
          description: Regra criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: Texto fora do limite ou regra que não compila.
          x-error-codes: [text_too_long, rule_compile_failed]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /rules/{id}/versions:
    post:
      operationId: createRuleVersion
      summary: Cria uma nova versão da regra
      description: Mantém o `id`, incrementa `version`, recompila e reavalia. A versão anterior continua ativa até a nova ser promovida.
      tags: [rules]
      x-spends-credits: true
      parameters:
        - $ref: "#/components/parameters/RuleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleVersionRequest"
      responses:
        "201":
          description: Nova versão.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          description: Regras globais são só leitura para organizações.
          x-error-codes: [rule_read_only]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Regra não encontrada.
          x-error-codes: [rule_not_found]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: Texto fora do limite ou regra que não compila.
          x-error-codes: [text_too_long, rule_compile_failed]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /rules/{id}/promote:
    post:
      operationId: promoteRule
      summary: Promove uma regra
      description: |
        `candidate` → `verified` exige histórico sem falsos positivos; `verified` → `trusted`
        passa a aplicar a regra automaticamente em toda execução. Só administradores promovem
        regras globais (API admin).
      tags: [rules]
      parameters:
        - $ref: "#/components/parameters/RuleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RulePromoteRequest"
      responses:
        "200":
          description: Regra promovida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Regra global.
          x-error-codes: [rule_read_only]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Regra não encontrada.
          x-error-codes: [rule_not_found]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Sem histórico suficiente.
          x-error-codes: [rule_not_promotable]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --------------------------------------------------------------- billing
  /billing/checkout:
    post:
      operationId: createCheckout
      summary: Inicia a assinatura de um plano
      description: Cria uma sessão de checkout no Stripe e devolve a URL. Planos e preços vêm de `GET /plans`.
      tags: [billing]
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "200":
          description: Sessão de checkout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "400":
          description: Plano desconhecido ou cupom inválido.
          x-error-codes: [plan_unknown, coupon_invalid, validation_failed]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: O Stripe não respondeu.
          x-error-codes: [checkout_failed]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Cobrança indisponível ou desativada.
          x-error-codes: [billing_unavailable, kill_switch_enabled]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /billing/portal:
    post:
      operationId: createBillingPortal
      summary: Abre o portal de cobrança
      description: URL do portal do Stripe para trocar cartão, ver faturas ou cancelar.
      tags: [billing]
      security:
        - cookieSession: []
      responses:
        "200":
          description: URL do portal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: Sem assinatura.
          x-error-codes: [subscription_required]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /billing/topup:
    post:
      operationId: createTopup
      summary: Compra créditos avulsos
      description: Cria um checkout de pagamento único. Os créditos entram pelo webhook do Stripe e valem por 12 meses.
      tags: [billing]
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopupRequest"
      responses:
        "200":
          description: Sessão de checkout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "400":
          description: Valor abaixo do mínimo.
          x-error-codes: [topup_below_minimum, validation_failed]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: Recarga exige assinatura ativa.
          x-error-codes: [subscription_required, subscription_inactive]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /credits:
    get:
      operationId: getCredits
      summary: Saldo de créditos
      description: Saldo, reservas em execuções ativas e o que vence quando.
      tags: [credits]
      responses:
        "200":
          description: Saldo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /credits/ledger:
    get:
      operationId: listCreditLedger
      summary: Ledger de créditos
      description: Toda movimentação, mais recente primeiro, com o saldo após cada lançamento.
      tags: [credits]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: run_id
          in: query
          schema:
            $ref: "#/components/schemas/RunId"
      responses:
        "200":
          description: Página do ledger.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /webhooks/stripe:
    post:
      operationId: receiveStripeWebhook
      summary: Recebe eventos do Stripe
      description: |
        Sem autenticação de usuário: a assinatura `Stripe-Signature` é verificada com
        `STRIPE_WEBHOOK_SECRET` sobre o corpo bruto. Eventos já processados devolvem 409 e
        são ignorados (idempotência por `event.id`).
      tags: [billing]
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripeEvent"
      responses:
        "200":
          description: Evento processado.
        "400":
          description: Assinatura inválida ou corpo ilegível.
          x-error-codes: [webhook_signature_invalid, invalid_json]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Evento repetido.
          x-error-codes: [webhook_replayed]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # -------------------------------------------------------- customizations
  /customizations:
    post:
      operationId: createCustomization
      summary: Pede uma personalização da interface
      description: |
        O pedido em linguagem natural vira um `UiManifest` (schemas/ui-manifest.json) planejado
        pelo modelo `ui_planner`, validado contra o esquema, a lista de componentes e o contraste
        AA. Pedidos fora do escopo ou inseguros são recusados com `customization_refused`.
        Conta no limite mensal do plano e gasta créditos.
      tags: [customizations]
      x-spends-credits: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomizationRequest"
      responses:
        "202":
          description: Pedido na fila de planejamento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          description: Limite mensal do plano atingido.
          x-error-codes: [customizations_limit_reached]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: Pedido recusado ou texto longo demais.
          x-error-codes: [customization_refused, text_too_long]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /customizations/{id}:
    get:
      operationId: getCustomization
      summary: Consulta uma personalização
      description: Estado, manifesto proposto e, quando recusada, o motivo.
      tags: [customizations]
      parameters:
        - $ref: "#/components/parameters/CustomizationId"
      responses:
        "200":
          description: A personalização.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Personalização não encontrada.
          x-error-codes: [customization_not_found]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /customizations/{id}/approve:
    post:
      operationId: approveCustomization
      summary: Aplica a personalização proposta
      description: Só para `proposed`. O manifesto vira o ativo da organização; o anterior fica disponível para `rollback`.
      tags: [customizations]
      parameters:
        - $ref: "#/components/parameters/CustomizationId"
      responses:
        "200":
          description: Personalização aplicada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Personalização não encontrada.
          x-error-codes: [customization_not_found]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Ainda não há proposta para aprovar.
          x-error-codes: [customization_not_approvable]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /customizations/{id}/rollback:
    post:
      operationId: rollbackCustomization
      summary: Restaura a personalização anterior
      description: Desfaz uma personalização aplicada, voltando ao manifesto anterior (ou ao padrão).
      tags: [customizations]
      parameters:
        - $ref: "#/components/parameters/CustomizationId"
      responses:
        "200":
          description: Personalização desfeita.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Personalização não encontrada.
          x-error-codes: [customization_not_found]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Nada para restaurar.
          x-error-codes: [customization_nothing_to_rollback]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # -------------------------------------------------------------- api keys
  /api-keys:
    get:
      operationId: listApiKeys
      summary: Lista as chaves de API
      description: Nunca devolve o segredo; só prefixo, escopos e último uso.
      tags: [api-keys]
      security:
        - cookieSession: []
      responses:
        "200":
          description: Chaves.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createApiKey
      summary: Cria uma chave de API
      description: |
        O segredo completo (`dm_live_<id>_<secret>`) aparece uma única vez na resposta; só o
        HMAC (com DM_APIKEY_PEPPER) fica guardado. Limitado pelo plano.
      tags: [api-keys]
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyCreateRequest"
      responses:
        "201":
          description: Chave criada (segredo visível só agora).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Limite de chaves ou faixa fora do plano.
          x-error-codes: [api_keys_limit_reached, lane_not_allowed]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api-keys/{id}:
    delete:
      operationId: revokeApiKey
      summary: Revoga uma chave de API
      description: Imediato; requisições em andamento com a chave terminam, novas recebem `invalid_api_key`.
      tags: [api-keys]
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/ApiKeyId"
      responses:
        "204":
          description: Chave revogada.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ------------------------------------------------------ webhook endpoints
  /webhook-endpoints:
    get:
      operationId: listWebhookEndpoints
      summary: Lista os endpoints de webhook
      description: Endpoints HTTPS da organização que recebem os eventos de saída.
      tags: [webhooks]
      security:
        - cookieSession: []
        - apiKey: []
      responses:
        "200":
          description: Endpoints.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createWebhookEndpoint
      summary: Registra um endpoint de webhook
      description: O segredo de assinatura aparece uma única vez. Só URLs HTTPS; a entrega tem 5 tentativas com backoff exponencial.
      tags: [webhooks]
      security:
        - cookieSession: []
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEndpointCreateRequest"
      responses:
        "201":
          description: Endpoint criado (segredo visível só agora).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Limite do plano.
          x-error-codes: [plan_limit_reached]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /webhook-endpoints/{id}:
    delete:
      operationId: deleteWebhookEndpoint
      summary: Remove um endpoint de webhook
      description: Entregas pendentes são descartadas.
      tags: [webhooks]
      security:
        - cookieSession: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/WebhookEndpointId"
      responses:
        "204":
          description: Endpoint removido.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------- public
  /plans:
    get:
      operationId: listPlans
      summary: Planos e preços
      description: Preços em centavos de dólar; `country` só afeta impostos exibidos e meios de pagamento.
      tags: [public]
      security: []
      parameters:
        - name: country
          in: query
          description: País ISO 3166-1 alpha-2 (padrão `BR`).
          schema:
            type: string
            pattern: "^[A-Z]{2}$"
            default: BR
      responses:
        "200":
          description: Planos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlansResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /healthz:
    get:
      operationId: healthz
      summary: Processo vivo
      description: Não toca o banco. Usado pelo balanceador.
      tags: [public]
      security: []
      responses:
        "200":
          description: Vivo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: Em manutenção.
          x-error-codes: [maintenance]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /readyz:
    get:
      operationId: readyz
      summary: Pronto para receber tráfego
      description: Verifica banco, storage e harness. `503` tira a instância do balanceador.
      tags: [public]
      security: []
      responses:
        "200":
          description: Pronto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: Alguma dependência indisponível.
          x-error-codes: [service_unavailable, harness_unavailable, storage_unavailable]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"

  /version:
    get:
      operationId: version
      summary: Versão em execução
      description: Versão semântica, commit e data da build.
      tags: [public]
      security: []
      responses:
        "200":
          description: Versão.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

# ================================================================== webhooks
webhooks:
  run.completed:
    post:
      operationId: webhookRunCompleted
      summary: Execução concluída
      description: Enviado quando uma execução termina com sucesso. Inclui o resumo; os achados vêm por `GET /runs/{id}/findings`.
      tags: [webhooks]
      security: []
      parameters:
        - $ref: "#/components/parameters/DmSignature"
        - $ref: "#/components/parameters/DmEventId"
        - $ref: "#/components/parameters/DmEventType"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookRunCompleted"
      responses:
        "200":
          description: Recebido. Qualquer 2xx conta como entregue.
        "4XX":
          description: Rejeitado; a docmatch tenta de novo até 5 vezes com backoff exponencial.
  run.failed:
    post:
      operationId: webhookRunFailed
      summary: Execução falhou
      description: Enviado quando uma execução falha. `error.code` é um código de `errors.yaml`; créditos não gastos já foram devolvidos.
      tags: [webhooks]
      security: []
      parameters:
        - $ref: "#/components/parameters/DmSignature"
        - $ref: "#/components/parameters/DmEventId"
        - $ref: "#/components/parameters/DmEventType"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookRunFailed"
      responses:
        "200":
          description: Recebido.
        "4XX":
          description: Rejeitado; será reenviado.
  run.needs_approval:
    post:
      operationId: webhookRunNeedsApproval
      summary: Execução aguarda aprovação de orçamento
      description: Enviado quando a execução para por teto ou ferramentas novas. Aprove com `POST /runs/{id}/approve-quote`.
      tags: [webhooks]
      security: []
      parameters:
        - $ref: "#/components/parameters/DmSignature"
        - $ref: "#/components/parameters/DmEventId"
        - $ref: "#/components/parameters/DmEventType"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookRunNeedsApproval"
      responses:
        "200":
          description: Recebido.
        "4XX":
          description: Rejeitado; será reenviado.
  credits.low:
    post:
      operationId: webhookCreditsLow
      summary: Créditos abaixo do limiar
      description: Enviado uma vez por ciclo quando o saldo disponível cai abaixo de 10% do plano (ou de 50 créditos).
      tags: [webhooks]
      security: []
      parameters:
        - $ref: "#/components/parameters/DmSignature"
        - $ref: "#/components/parameters/DmEventId"
        - $ref: "#/components/parameters/DmEventType"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookCreditsLow"
      responses:
        "200":
          description: Recebido.
        "4XX":
          description: Rejeitado; será reenviado.

# ================================================================ components
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: dm_session
      description: Sessão aberta pelo login (HttpOnly, Secure, SameSite=Lax). Renovada em `POST /auth/refresh`.
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: dm_live_<id>_<secret>
      description: Chave de API criada em `POST /api-keys`. O servidor guarda só o HMAC da chave.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Chave única por tentativa (UUID, por exemplo). Obrigatória em operações que gastam créditos; guardada por 24 h.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        x-limit: ids.idempotency_key_max
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Opcional aqui; evita duas sessões de checkout em caso de repetição.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        x-limit: ids.idempotency_key_max
    Cursor:
      name: cursor
      in: query
      description: Cursor opaco devolvido em `next_cursor`.
      schema:
        type: string
        maxLength: 128
        x-limit: ids.idempotency_key_max
    Limit:
      name: limit
      in: query
      description: Itens por página.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    RunId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/RunId"
    FindingId:
      name: fid
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/FindingId"
    UploadId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UploadId"
    WorkflowId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/WorkflowId"
    RuleId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/RuleId"
    CustomizationId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CustomizationId"
    ApiKeyId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ApiKeyId"
    WebhookEndpointId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/WebhookEndpointId"
    DmSignature:
      name: DM-Signature
      in: header
      required: true
      description: |
        `t=<unix>,v1=<hex>` onde `v1` é HMAC-SHA256 (segredo do endpoint) de `<t>.<corpo bruto>`.
        Rejeite se `|agora - t|` > 5 minutos.
      schema:
        type: string
        pattern: "^t=[0-9]{10},v1=[0-9a-f]{64}$"
    DmEventId:
      name: DM-Event-Id
      in: header
      required: true
      description: Id do evento (para deduplicar reenvios).
      schema:
        $ref: "#/components/schemas/EventId"
    DmEventType:
      name: DM-Event-Type
      in: header
      required: true
      schema:
        $ref: "#/components/schemas/WebhookEventType"

  headers:
    RateLimitLimit:
      description: Requisições permitidas na janela atual.
      schema:
        type: integer
    RateLimitRemaining:
      description: Requisições restantes na janela atual.
      schema:
        type: integer
    RateLimitReset:
      description: Segundos até a janela reiniciar.
      schema:
        type: integer
    RetryAfter:
      description: Segundos a esperar antes de tentar de novo.
      schema:
        type: integer
    RequestId:
      description: Id da requisição (o mesmo de `request_id` no envelope de erro).
      schema:
        type: string

  responses:
    BadRequest:
      description: Entrada inválida.
      x-status: 400
      x-error-codes: [validation_failed, invalid_json, control_characters, missing_idempotency_key]
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            validation:
              value:
                code: validation_failed
                message: Alguns campos estão inválidos. Confira os detalhes.
                request_id: req_01JBXKEN8R4S9T0V1W2X3Y4Z5A
                details:
                  fields:
                    - path: /display_name
                      code: text_too_long
                      max: 80
    Unauthorized:
      description: Sem sessão ou chave válida.
      x-status: 401
      x-error-codes: [unauthenticated, session_expired, invalid_api_key]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PaymentRequired:
      description: Créditos insuficientes ou assinatura necessária.
      x-status: 402
      x-error-codes: [insufficient_credits, subscription_required, subscription_inactive]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Sem permissão.
      x-status: 403
      x-error-codes: [forbidden, api_key_scope_denied, account_suspended, account_deletion_pending, plan_limit_reached]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Não encontrado.
      x-status: 404
      x-error-codes: [not_found, upload_not_found]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflito com o estado atual ou chave de idempotência reutilizada.
      x-status: 409
      x-error-codes: [conflict, idempotency_key_reused, idempotency_in_progress]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: Texto fora dos limites.
      x-status: 422
      x-error-codes: [text_too_long]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Limite de requisições.
      x-status: 429
      x-error-codes: [rate_limited, too_many_attempts]
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Dependência indisponível ou função desativada.
      x-status: 503
      x-error-codes: [service_unavailable, harness_unavailable, storage_unavailable, model_unavailable, kill_switch_enabled, maintenance]
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    # ------------------------------------------------------------ primitives
    Error:
      type: object
      description: Envelope de erro de toda resposta 4xx/5xx. Os códigos e mensagens vêm de `errors.yaml`.
      required: [code, message, request_id]
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          description: Código estável (ver `errors.yaml`).
        message:
          type: string
          description: Mensagem em pt-BR para o usuário.
        request_id:
          type: string
          description: Id da requisição para suporte.
        details:
          type: object
          description: "Dados estruturados do erro (ex.: `fields` em `validation_failed`, `reason` em `customization_refused`, `retry_after_s` em `rate_limited`)."
          additionalProperties: true
      additionalProperties: false
      examples:
        - code: insufficient_credits
          message: Créditos insuficientes para esta execução. Faça uma recarga ou reduza o escopo.
          request_id: req_01JBXKEN8R4S9T0V1W2X3Y4Z5A
          details:
            required: 293
            available: 120
    Money:
      type: object
      description: Dinheiro como inteiro na menor unidade da moeda (centavos).
      required: [amount, currency]
      properties:
        amount:
          type: integer
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
      additionalProperties: false
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 em UTC.
    RunId:
      type: string
      pattern: "^run_[0-9A-HJKMNP-TV-Z]{26}$"
    UploadId:
      type: string
      pattern: "^upl_[0-9A-HJKMNP-TV-Z]{26}$"
    FindingId:
      type: string
      pattern: "^fnd_[0-9A-HJKMNP-TV-Z]{26}$"
    MatchId:
      type: string
      pattern: "^mtc_[0-9A-HJKMNP-TV-Z]{26}$"
    QuoteId:
      type: string
      pattern: "^qte_[0-9A-HJKMNP-TV-Z]{26}$"
    WorkflowId:
      type: string
      pattern: "^wfl_[0-9A-HJKMNP-TV-Z]{26}$"
    RuleId:
      type: string
      pattern: "^rul_[0-9A-HJKMNP-TV-Z]{26}$"
    OrgId:
      type: string
      pattern: "^org_[0-9A-HJKMNP-TV-Z]{26}$"
    UserId:
      type: string
      pattern: "^usr_[0-9A-HJKMNP-TV-Z]{26}$"
    CustomizationId:
      type: string
      pattern: "^cst_[0-9A-HJKMNP-TV-Z]{26}$"
    ApiKeyId:
      type: string
      pattern: "^key_[0-9A-HJKMNP-TV-Z]{26}$"
    WebhookEndpointId:
      type: string
      pattern: "^whe_[0-9A-HJKMNP-TV-Z]{26}$"
    LedgerEntryId:
      type: string
      pattern: "^ldg_[0-9A-HJKMNP-TV-Z]{26}$"
    EventId:
      type: string
      pattern: "^evt_[0-9A-HJKMNP-TV-Z]{26}$"
    BinaryFile:
      type: string
      format: binary
    Severity:
      type: string
      enum: [info, low, medium, high, critical]
    FindingStatus:
      type: string
      enum: [open, confirmed, dismissed, resolved]
    RunStatus:
      type: string
      enum: [queued, running, needs_approval, completed, failed, cancelled]
    Lane:
      type: string
      enum: [app, api_batch, api_standard, api_priority]
      description: Faixa de prioridade (multiplicadores em config/pricing.yaml). Chaves de API só usam as faixas do plano.
    LlmMode:
      type: string
      enum: [openrouter, local, off]
    ExportFormat:
      type: string
      enum: [xlsx, csv, pdf]
    RuleStatus:
      type: string
      enum: [draft, candidate, verified, trusted, retired]
    RuleScope:
      type: string
      enum: [tenant, global]
    PlanCode:
      type: string
      enum: [starter, pro, business]

    # ------------------------------------------------------------------ auth
    AuthStartRequest:
      type: object
      properties:
        redirect_to:
          type: string
          pattern: "^/[^/\\\\].*$|^/$"
          description: Caminho relativo no site para onde voltar depois do login (nunca uma URL absoluta).
        platform:
          type: string
          enum: [web, android, ios]
          default: web
      additionalProperties: false
    AuthStartResponse:
      type: object
      required: [authorization_url, state, expires_at]
      properties:
        authorization_url:
          type: string
          format: uri
        state:
          type: string
        expires_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    AppleCallbackForm:
      type: object
      description: Campos do `form_post` da Apple.
      required: [code, id_token, state]
      properties:
        code:
          type: string
        id_token:
          type: string
        state:
          type: string
        user:
          type: string
          description: JSON com nome e e-mail, só no primeiro login.
      additionalProperties: false
    AppleNativeCallback:
      type: object
      description: Token obtido pelo app iOS com AuthenticationServices.
      required: [identity_token, authorization_code]
      properties:
        identity_token:
          type: string
        authorization_code:
          type: string
        full_name:
          type: string
          maxLength: 80
          x-limit: text.display_name
      additionalProperties: false
    EmailStartRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          x-limit: text.email
      additionalProperties: false
    EmailStartResponse:
      type: object
      required: [challenge_id, expires_at, resend_after_s]
      properties:
        challenge_id:
          type: string
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        resend_after_s:
          type: integer
          minimum: 0
      additionalProperties: false
    EmailVerifyRequest:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id:
          type: string
        code:
          type: string
          pattern: "^[0-9]{6}$|^[A-Za-z0-9_-]{43}$"
          description: O código de 6 dígitos digitado pelo usuário ou o token do link mágico recebido no mesmo e-mail (32 bytes em base64url).
      additionalProperties: false
    AuthMethods:
      type: object
      required: [email, google, apple, password, dev]
      properties:
        email:
          type: boolean
        google:
          type: boolean
        apple:
          type: boolean
        password:
          type: boolean
        dev:
          type: boolean
          description: Login local sem provedor (só em desenvolvimento).
      additionalProperties: false
    GoogleNativeRequest:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
          minLength: 1
      additionalProperties: false
    DevLoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          x-limit: text.email
          description: Vazio usa dev@docmatch.test.
        name:
          type: string
          maxLength: 80
          x-limit: text.display_name
      additionalProperties: false
    Device:
      type: object
      required: [id, platform, name, created_at, last_seen_at, current]
      properties:
        id:
          type: string
          pattern: "^ses_[0-9A-Z]{26}$"
        platform:
          type: string
          enum: [web, android, ios]
        name:
          type: string
          description: Nome curto do aparelho (navegador e sistema, ou app e modelo).
        created_at:
          $ref: "#/components/schemas/Timestamp"
        last_seen_at:
          $ref: "#/components/schemas/Timestamp"
        ip_prefix:
          type: string
        current:
          type: boolean
      additionalProperties: false
    DeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Device"
      additionalProperties: false
    PasswordLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          x-limit: text.email
        password:
          type: string
          maxLength: 128
          x-limit: text.password_max
        totp_code:
          type: string
          pattern: "^[0-9]{6}$"
          description: Reservado para o segundo fator (ainda não ativado).
      additionalProperties: false
    PasswordChangeRequest:
      type: object
      required: [new_password]
      properties:
        current_password:
          type: string
          maxLength: 128
          x-limit: text.password_max
        new_password:
          type: string
          minLength: 12
          maxLength: 128
          x-limit: text.password_max
          description: Entre `text.password_min` e `text.password_max` caracteres de `limits.yaml`.
      additionalProperties: false
    Session:
      type: object
      required: [user, org, expires_at]
      properties:
        user:
          $ref: "#/components/schemas/User"
        org:
          $ref: "#/components/schemas/Org"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false

    # --------------------------------------------------------------- account
    User:
      type: object
      required: [id, email, display_name, role, locale, created_at]
      properties:
        id:
          $ref: "#/components/schemas/UserId"
        email:
          type: string
          format: email
        display_name:
          type: string
          maxLength: 80
          x-limit: text.display_name
        role:
          type: string
          enum: [owner, member]
        locale:
          type: string
          const: pt-BR
        created_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    Org:
      type: object
      required: [id, name, plan, plan_status, created_at]
      properties:
        id:
          $ref: "#/components/schemas/OrgId"
        name:
          type: string
          maxLength: 120
          x-limit: text.company_name
        plan:
          oneOf:
            - $ref: "#/components/schemas/PlanCode"
            - type: "null"
          description: Nulo sem assinatura.
        plan_status:
          type: string
          enum: [none, trialing, active, past_due, cancelled]
        created_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    Entitlements:
      type: object
      description: Limites efetivos do plano (config/pricing.yaml), já aplicados os overrides administrativos.
      required:
        - document_files_per_run
        - document_file_mb
        - document_run_mb
        - media_files_per_run
        - media_run_gb
        - media_run_hours
        - concurrent_runs
        - api_keys
        - api_lanes
        - auto_rule_learning
        - ui_customizations_per_month
        - escalation_model
        - retention_days
      properties:
        document_files_per_run:
          type: integer
          minimum: 0
        document_file_mb:
          type: integer
          minimum: 0
        document_run_mb:
          type: integer
          minimum: 0
        media_files_per_run:
          type: integer
          minimum: 0
        media_run_gb:
          type: integer
          minimum: 0
        media_run_hours:
          type: integer
          minimum: 0
        concurrent_runs:
          type: integer
          minimum: 0
        api_keys:
          type: integer
          minimum: 0
        api_lanes:
          type: array
          items:
            $ref: "#/components/schemas/Lane"
        auto_rule_learning:
          type: boolean
        ui_customizations_per_month:
          type: integer
          minimum: -1
          description: -1 é ilimitado.
        escalation_model:
          type: boolean
        retention_days:
          type: integer
          minimum: 1
      additionalProperties: false
    Me:
      type: object
      required: [user, org, credits, entitlements]
      properties:
        user:
          $ref: "#/components/schemas/User"
        org:
          $ref: "#/components/schemas/Org"
        credits:
          $ref: "#/components/schemas/CreditSummary"
        entitlements:
          $ref: "#/components/schemas/Entitlements"
        notifications:
          $ref: "#/components/schemas/NotificationPrefs"
      additionalProperties: false
    NotificationPrefs:
      type: object
      properties:
        run_completed:
          type: boolean
          default: true
        credits_low:
          type: boolean
          default: true
        product_news:
          type: boolean
          default: false
      additionalProperties: false
    MeUpdate:
      type: object
      minProperties: 1
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
          x-limit: text.display_name
        company_name:
          type: string
          minLength: 1
          maxLength: 120
          x-limit: text.company_name
        notifications:
          $ref: "#/components/schemas/NotificationPrefs"
      additionalProperties: false
    DeletionScheduled:
      type: object
      required: [scheduled_for]
      properties:
        scheduled_for:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    ExportStatus:
      type: object
      required: [status, requested_at]
      properties:
        status:
          type: string
          enum: [pending, ready, expired]
        requested_at:
          $ref: "#/components/schemas/Timestamp"
        download_url:
          type: string
          format: uri
          description: URL assinada, presente quando `ready`.
        expires_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false

    # --------------------------------------------------------------- uploads
    UploadKind:
      type: string
      enum: [document, media]
    UploadRequest:
      type: object
      required: [kind, file_name, size_bytes, mime]
      properties:
        kind:
          $ref: "#/components/schemas/UploadKind"
        file_name:
          type: string
          minLength: 1
          maxLength: 255
          x-limit: files.uploaded_file_name_bytes
          description: Nome original. O limite é em bytes UTF-8 após NFC; sem `/`, `\` nem caracteres de controle.
        size_bytes:
          type: integer
          minimum: 1
        mime:
          type: string
          pattern: "^[a-z0-9!#$&^_.+-]+/[a-z0-9!#$&^_.+-]+$"
          description: Tipo declarado; o scanner sniffa o real e pode rejeitar.
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Opcional; conferido em `complete`.
        role:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,39}$"
          description: "Papel no fluxo (ex.: `bank_statement`)."
      additionalProperties: false
    UploadTicket:
      oneOf:
        - $ref: "#/components/schemas/DocumentUploadTicket"
        - $ref: "#/components/schemas/MediaUploadTicket"
      discriminator:
        propertyName: kind
        mapping:
          document: "#/components/schemas/DocumentUploadTicket"
          media: "#/components/schemas/MediaUploadTicket"
    DocumentUploadTicket:
      type: object
      description: POST pré-assinado para o S3 (`multipart/form-data` com `fields` + `file`).
      required: [id, kind, method, url, fields, expires_at, max_size_bytes]
      properties:
        id:
          $ref: "#/components/schemas/UploadId"
        kind:
          type: string
          const: document
        method:
          type: string
          const: POST
        url:
          type: string
          format: uri
        fields:
          type: object
          additionalProperties:
            type: string
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        max_size_bytes:
          type: integer
      additionalProperties: false
    MediaUploadTicket:
      type: object
      description: PUT pré-assinado para o Cloudflare R2; envie o corpo bruto com os `headers`.
      required: [id, kind, method, url, headers, expires_at, max_size_bytes]
      properties:
        id:
          $ref: "#/components/schemas/UploadId"
        kind:
          type: string
          const: media
        method:
          type: string
          const: PUT
        url:
          type: string
          format: uri
        headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        max_size_bytes:
          type: integer
      additionalProperties: false
    UploadCompleteRequest:
      type: object
      properties:
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        etag:
          type: string
      additionalProperties: false
    UploadStatus:
      type: string
      enum: [pending, scanning, ready, rejected, expired]
    UploadRejectedReason:
      type: string
      enum: [type, size, malware, bomb, playlist, name, checksum]
      description: Motivo da rejeição; corresponde aos códigos `upload_rejected_*` e `upload_checksum_mismatch`.
    Upload:
      type: object
      required: [id, kind, file_name, size_bytes, status, created_at, expires_at]
      properties:
        id:
          $ref: "#/components/schemas/UploadId"
        kind:
          $ref: "#/components/schemas/UploadKind"
        file_name:
          type: string
        size_bytes:
          type: integer
        mime:
          type: string
          description: Tipo detectado pelo conteúdo (após a verificação).
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        status:
          $ref: "#/components/schemas/UploadStatus"
        rejected_reason:
          $ref: "#/components/schemas/UploadRejectedReason"
        duration_ms:
          type: integer
          minimum: 0
          description: Só mídia.
        role:
          type: string
        created_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
          description: Retenção do plano.
      additionalProperties: false

    # ------------------------------------------------------------------ runs
    LocatorHints:
      $ref: "./schemas/workflow-config.json#/$defs/LocatorHints"
    RunSource:
      type: object
      required: [upload_id]
      properties:
        upload_id:
          $ref: "#/components/schemas/UploadId"
        role:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,39}$"
        hints:
          $ref: "#/components/schemas/LocatorHints"
      additionalProperties: false
    RunOptions:
      type: object
      properties:
        llm_mode:
          $ref: "#/components/schemas/LlmMode"
        web_search:
          type: boolean
          default: false
        use_rules:
          type: boolean
          default: true
        rule_ids:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RuleId"
        lane:
          $ref: "#/components/schemas/Lane"
        escalation:
          type: boolean
          default: false
          description: Permite o modelo de escalonamento (plano business).
      additionalProperties: false
    EstimateRequest:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          minItems: 1
          maxItems: 100
          x-limit: ids.files_per_run_hard_max
          items:
            $ref: "#/components/schemas/RunSource"
          description: Documentos e planilhas. O plano pode permitir menos que o teto.
        media_sources:
          type: array
          maxItems: 50000
          x-limit: ids.media_files_per_run_hard_max
          items:
            $ref: "#/components/schemas/RunSource"
          description: Áudios e vídeos.
        workflow_id:
          $ref: "#/components/schemas/WorkflowId"
        rules_text:
          type: string
          maxLength: 4000
          x-limit: text.rules_text
          description: Regras avulsas em linguagem natural para esta execução.
        options:
          $ref: "#/components/schemas/RunOptions"
      additionalProperties: false
    RunCreateRequest:
      allOf:
        - $ref: "#/components/schemas/EstimateRequest"
        - type: object
          required: [quote_id, quote_signature]
          properties:
            quote_id:
              $ref: "#/components/schemas/QuoteId"
            quote_signature:
              type: string
              pattern: "^v1=[0-9a-f]{64}$"
      description: O mesmo pedido da estimativa mais o orçamento aceito. Fontes ou opções diferentes do orçamento devolvem `quote_mismatch`.
    ApproveQuoteRequest:
      type: object
      required: [quote_id, quote_signature]
      properties:
        quote_id:
          $ref: "#/components/schemas/QuoteId"
        quote_signature:
          type: string
          pattern: "^v1=[0-9a-f]{64}$"
      additionalProperties: false
    Quote:
      $ref: "./schemas/quote.json"
    RunCredits:
      type: object
      required: [reserved, spent, refunded]
      properties:
        reserved:
          type: integer
          minimum: 0
        spent:
          type: integer
          minimum: 0
        refunded:
          type: integer
          minimum: 0
      additionalProperties: false
    RunStage:
      type: string
      enum: [scan, ingest, normalize, match, discover, adjudicate, verify, toolsmith, report]
    RunProgress:
      type: object
      required: [stage, percent]
      properties:
        stage:
          $ref: "#/components/schemas/RunStage"
        percent:
          type: integer
          minimum: 0
          maximum: 100
        message:
          type: string
          description: Em pt-BR, para o painel de progresso.
      additionalProperties: false
    RunSummary:
      type: object
      required: [findings_total, findings_by_severity, amount_at_risk, currency, matches_total, lines_total, lines_matched]
      properties:
        findings_total:
          type: integer
          minimum: 0
        findings_by_severity:
          type: object
          properties:
            info:
              type: integer
            low:
              type: integer
            medium:
              type: integer
            high:
              type: integer
            critical:
              type: integer
          additionalProperties: false
        amount_at_risk:
          type: integer
          minimum: 0
          description: Soma em centavos.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        matches_total:
          type: integer
          minimum: 0
        lines_total:
          type: integer
          minimum: 0
        lines_matched:
          type: integer
          minimum: 0
        new_tool_ids:
          type: array
          items:
            type: string
        proposed_rule_ids:
          type: array
          items:
            $ref: "#/components/schemas/RuleId"
        source_warnings:
          type: array
          maxItems: 100
          x-limit: ids.source_warnings_per_run
          description: Em pt-BR, por arquivo, o que não entrou na conciliação (PDF digitalizado, carteira sem títulos em aberto, arquivo não reconhecido).
          items:
            type: string
            maxLength: 500
            x-limit: text.source_warning
      additionalProperties: false
    RunError:
      type: object
      description: Falha de uma execução (código de `errors.yaml`).
      required: [code, message, retryable]
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        message:
          type: string
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: true
      additionalProperties: false
    Run:
      type: object
      required: [id, status, lane, sources, credits, created_at, expires_at]
      properties:
        id:
          $ref: "#/components/schemas/RunId"
        status:
          $ref: "#/components/schemas/RunStatus"
        workflow_id:
          oneOf:
            - $ref: "#/components/schemas/WorkflowId"
            - type: "null"
        lane:
          $ref: "#/components/schemas/Lane"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Upload"
        quote:
          $ref: "#/components/schemas/Quote"
        pending_quote:
          $ref: "#/components/schemas/Quote"
          description: Orçamento adicional aguardando aprovação (só em `needs_approval`).
        credits:
          $ref: "#/components/schemas/RunCredits"
        progress:
          $ref: "#/components/schemas/RunProgress"
        summary:
          $ref: "#/components/schemas/RunSummary"
        error:
          $ref: "#/components/schemas/RunError"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        started_at:
          $ref: "#/components/schemas/Timestamp"
        finished_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
          description: Fim da retenção do plano; depois disso arquivos e resultados são apagados.
      additionalProperties: false
    RunList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Run"
        next_cursor:
          type: ["string", "null"]
      additionalProperties: false
    Finding:
      $ref: "./schemas/finding.json"
    Evidence:
      $ref: "./schemas/finding.json#/$defs/Evidence"
    FindingList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        next_cursor:
          type: ["string", "null"]
      additionalProperties: false
    FindingFeedbackRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [confirmed, dismissed, resolved]
        reason:
          type: string
          enum: [false_positive, already_known, wrong_amount, duplicate, other]
        note:
          type: string
          maxLength: 500
          x-limit: text.finding_feedback_note
      additionalProperties: false
    Match:
      type: object
      description: Casamento entre linhas de fontes diferentes (ou grupo um-para-muitos).
      required: [id, run_id, kind, left, right, confidence, created_at]
      properties:
        id:
          $ref: "#/components/schemas/MatchId"
        run_id:
          $ref: "#/components/schemas/RunId"
        kind:
          type: string
          enum: [exact, tolerance, sum, fuzzy, rule, model]
        left:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Evidence"
        right:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Evidence"
        confidence:
          type: number
          minimum: 0
          maximum: 1
        amount:
          type: integer
          description: Centavos.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        rule_id:
          oneOf:
            - $ref: "#/components/schemas/RuleId"
            - type: "null"
        explanation:
          type: string
        created_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false

    # ------------------------------------------------------------- SSE events
    RunEvent:
      type: object
      description: |
        Um evento do fluxo `text/event-stream`: `id` é a sequência (use em `Last-Event-ID`),
        `event` é o nome e `data` segue o esquema do evento (também listados em `x-sse-events`
        da operação). No fio, cada evento é serializado como:

        ```
        id: 42
        event: finding
        data: {"finding": {...}}
        ```
      required: [id, event, data]
      properties:
        id:
          type: integer
          minimum: 1
        event:
          type: string
          enum: [stage_started, progress, token_usage, finding, match, needs_approval, completed, failed]
        data:
          oneOf:
            - $ref: "#/components/schemas/RunEventStageStarted"
            - $ref: "#/components/schemas/RunEventProgress"
            - $ref: "#/components/schemas/RunEventTokenUsage"
            - $ref: "#/components/schemas/RunEventFinding"
            - $ref: "#/components/schemas/RunEventMatch"
            - $ref: "#/components/schemas/RunEventNeedsApproval"
            - $ref: "#/components/schemas/RunEventCompleted"
            - $ref: "#/components/schemas/RunEventFailed"
      additionalProperties: false
    RunEventStageStarted:
      type: object
      required: [stage]
      properties:
        stage:
          $ref: "#/components/schemas/RunStage"
        message:
          type: string
        total_steps:
          type: integer
          minimum: 0
      additionalProperties: false
    RunEventProgress:
      type: object
      required: [stage, done, total]
      properties:
        stage:
          $ref: "#/components/schemas/RunStage"
        done:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        message:
          type: string
        credits_spent:
          type: integer
          minimum: 0
      additionalProperties: false
    RunEventTokenUsage:
      type: object
      required: [role, model, prompt_tokens, completion_tokens, credits, credits_spent_total]
      properties:
        role:
          type: string
          description: Papel de config/models.yaml.
        model:
          type: string
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        cached_tokens:
          type: integer
          minimum: 0
        credits:
          type: integer
          minimum: 0
        credits_spent_total:
          type: integer
          minimum: 0
        cached:
          type: boolean
      additionalProperties: false
    RunEventFinding:
      type: object
      required: [finding]
      properties:
        finding:
          $ref: "#/components/schemas/Finding"
      additionalProperties: false
    RunEventMatch:
      type: object
      required: [match]
      properties:
        match:
          $ref: "#/components/schemas/Match"
      additionalProperties: false
    RunEventNeedsApproval:
      type: object
      required: [quote, reasons, credits_spent_so_far]
      properties:
        quote:
          $ref: "#/components/schemas/Quote"
        reasons:
          type: array
          items:
            type: string
            enum: [new_tools, over_default_budget, media_heavy, web_search, escalation_model]
        message:
          type: string
        credits_spent_so_far:
          type: integer
          minimum: 0
      additionalProperties: false
    RunEventCompleted:
      type: object
      required: [summary, credits_spent, credits_refunded]
      properties:
        summary:
          $ref: "#/components/schemas/RunSummary"
        credits_spent:
          type: integer
          minimum: 0
        credits_refunded:
          type: integer
          minimum: 0
      additionalProperties: false
    RunEventFailed:
      type: object
      required: [error, credits_spent]
      properties:
        error:
          $ref: "#/components/schemas/RunError"
        credits_spent:
          type: integer
          minimum: 0
      additionalProperties: false

    # ------------------------------------------------------------- workflows
    WorkflowConfig:
      $ref: "./schemas/workflow-config.json"
    WorkflowPatch:
      type: object
      description: Seções de `WorkflowConfig`, todas opcionais; as enviadas substituem as atuais por inteiro.
      minProperties: 1
      properties:
        name:
          $ref: "./schemas/workflow-config.json#/properties/name"
        sources:
          $ref: "./schemas/workflow-config.json#/properties/sources"
        matching:
          $ref: "./schemas/workflow-config.json#/$defs/Matching"
        rules:
          $ref: "./schemas/workflow-config.json#/$defs/Rules"
        llm:
          $ref: "./schemas/workflow-config.json#/properties/llm"
        budget:
          $ref: "./schemas/workflow-config.json#/properties/budget"
        outputs:
          $ref: "./schemas/workflow-config.json#/properties/outputs"
      additionalProperties: false
    Workflow:
      type: object
      required: [id, org_id, config, runs_count, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/WorkflowId"
        org_id:
          $ref: "#/components/schemas/OrgId"
        config:
          $ref: "#/components/schemas/WorkflowConfig"
        runs_count:
          type: integer
          minimum: 0
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    WorkflowList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Workflow"
        next_cursor:
          type: ["string", "null"]
      additionalProperties: false

    # ----------------------------------------------------------------- rules
    Rule:
      $ref: "./schemas/rule.json"
    RuleList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Rule"
        next_cursor:
          type: ["string", "null"]
      additionalProperties: false
    RuleCreateRequest:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          x-limit: text.saved_rule_title
        body:
          type: string
          minLength: 1
          maxLength: 2000
          x-limit: text.saved_rule_body
        applies_to:
          $ref: "./schemas/rule.json#/properties/applies_to"
        compile:
          type: boolean
          default: true
          description: Falso salva como `draft` sem gastar créditos.
      additionalProperties: false
    RuleVersionRequest:
      type: object
      required: [body]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          x-limit: text.saved_rule_title
        body:
          type: string
          minLength: 1
          maxLength: 2000
          x-limit: text.saved_rule_body
      additionalProperties: false
    RulePromoteRequest:
      type: object
      required: [to]
      properties:
        to:
          type: string
          enum: [verified, trusted]
      additionalProperties: false

    # --------------------------------------------------------------- billing
    CheckoutRequest:
      type: object
      required: [plan]
      properties:
        plan:
          $ref: "#/components/schemas/PlanCode"
        coupon_code:
          type: string
          minLength: 1
          maxLength: 32
          x-limit: text.coupon_code
        success_path:
          type: string
          pattern: "^/[^/\\\\].*$|^/$"
        cancel_path:
          type: string
          pattern: "^/[^/\\\\].*$|^/$"
      additionalProperties: false
    CheckoutResponse:
      type: object
      required: [checkout_url, session_id, expires_at]
      properties:
        checkout_url:
          type: string
          format: uri
        session_id:
          type: string
        expires_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    PortalResponse:
      type: object
      required: [portal_url]
      properties:
        portal_url:
          type: string
          format: uri
      additionalProperties: false
    TopupRequest:
      type: object
      required: [credits]
      properties:
        credits:
          type: integer
          minimum: 1
          description: Quantidade de créditos; o preço unitário vem de `GET /plans`.
        success_path:
          type: string
          pattern: "^/[^/\\\\].*$|^/$"
        cancel_path:
          type: string
          pattern: "^/[^/\\\\].*$|^/$"
      additionalProperties: false
    CreditSummary:
      type: object
      required: [balance, reserved, available, plan_credits, topup_credits]
      properties:
        balance:
          type: integer
          minimum: 0
        reserved:
          type: integer
          minimum: 0
          description: Reservados por execuções ativas.
        available:
          type: integer
          minimum: 0
          description: "`balance - reserved`."
        plan_credits:
          type: integer
          minimum: 0
          description: Parcela do ciclo do plano (expira no fim do ciclo seguinte).
        topup_credits:
          type: integer
          minimum: 0
          description: Parcela comprada avulsa (expira em 12 meses).
        plan_cycle_ends_at:
          $ref: "#/components/schemas/Timestamp"
        next_expiry_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    LedgerEntry:
      type: object
      required: [id, kind, credits, balance_after, description, created_at]
      properties:
        id:
          $ref: "#/components/schemas/LedgerEntryId"
        kind:
          type: string
          enum: [plan_grant, topup, reserve, spend, release, refund, expire, adjustment, bounty]
        credits:
          type: integer
          description: Positivo entra, negativo sai.
        balance_after:
          type: integer
          minimum: 0
        run_id:
          oneOf:
            - $ref: "#/components/schemas/RunId"
            - type: "null"
        description:
          type: string
          description: Em pt-BR.
        created_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    LedgerList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LedgerEntry"
        next_cursor:
          type: ["string", "null"]
      additionalProperties: false
    StripeEvent:
      type: object
      description: Evento do Stripe (`checkout.session.completed`, `invoice.paid`, `customer.subscription.updated`, ...). Processado a partir do corpo bruto.
      required: [id, type, data]
      properties:
        id:
          type: string
        type:
          type: string
        data:
          type: object
          additionalProperties: true
      additionalProperties: true

    # -------------------------------------------------------- customizations
    UiManifest:
      $ref: "./schemas/ui-manifest.json"
    CustomizationRequest:
      type: object
      required: [request]
      properties:
        request:
          type: string
          minLength: 1
          maxLength: 2000
          x-limit: text.ui_customization_request
          description: "Pedido em linguagem natural (ex.: `mostre só achados acima de R$ 500 agrupados por fornecedor`)."
        workflow_id:
          $ref: "#/components/schemas/WorkflowId"
        base_id:
          $ref: "#/components/schemas/CustomizationId"
          description: "Personalização sobre a qual aplicar o pedido (padrão: a ativa)."
      additionalProperties: false
    CustomizationStatus:
      type: string
      enum: [queued, planning, proposed, approved, applied, rejected, rolled_back, refused]
    Customization:
      type: object
      required: [id, status, request, credits_spent, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/CustomizationId"
        status:
          $ref: "#/components/schemas/CustomizationStatus"
        request:
          type: string
        workflow_id:
          oneOf:
            - $ref: "#/components/schemas/WorkflowId"
            - type: "null"
        manifest:
          $ref: "#/components/schemas/UiManifest"
        previous_id:
          oneOf:
            - $ref: "#/components/schemas/CustomizationId"
            - type: "null"
        refused_reason:
          type: object
          required: [reason, message]
          properties:
            reason:
              type: string
              enum: [unsafe, out_of_scope, component_not_allowed, contrast_failed, budget]
            message:
              type: string
          additionalProperties: false
        credits_spent:
          type: integer
          minimum: 0
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false

    # -------------------------------------------------------------- api keys
    ApiKeyScope:
      type: string
      enum:
        - runs:read
        - runs:write
        - uploads:write
        - workflows:read
        - workflows:write
        - rules:read
        - rules:write
        - credits:read
        - webhooks:write
    ApiKey:
      type: object
      required: [id, label, prefix, scopes, lane, created_at]
      properties:
        id:
          $ref: "#/components/schemas/ApiKeyId"
        label:
          type: string
          maxLength: 60
          x-limit: text.api_key_label
        prefix:
          type: string
          description: "`dm_live_<id>`, para identificar a chave sem o segredo."
        scopes:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ApiKeyScope"
        lane:
          $ref: "#/components/schemas/Lane"
        last_used_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        revoked_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
      additionalProperties: false
    ApiKeyCreateRequest:
      type: object
      required: [label, scopes]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 60
          x-limit: text.api_key_label
        scopes:
          type: array
          minItems: 1
          maxItems: 10
          x-limit: ids.api_key_scopes_max
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ApiKeyScope"
        lane:
          $ref: "#/components/schemas/Lane"
          description: Padrão `api_batch`; as demais dependem do plano.
      additionalProperties: false
    ApiKeyCreated:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              pattern: "^dm_live_[0-9A-HJKMNP-TV-Z]{26}_[A-Za-z0-9_-]{32,64}$"
              description: Segredo completo, mostrado uma única vez.
    ApiKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"
      additionalProperties: false

    # -------------------------------------------------------------- webhooks
    WebhookEventType:
      type: string
      enum: [run.completed, run.failed, run.needs_approval, credits.low]
    WebhookEndpoint:
      type: object
      required: [id, url, events, status, created_at]
      properties:
        id:
          $ref: "#/components/schemas/WebhookEndpointId"
        url:
          type: string
          format: uri
          pattern: "^https://"
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/WebhookEventType"
        status:
          type: string
          enum: [active, disabled]
          description: Desativado automaticamente após 7 dias de falhas consecutivas.
        created_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    WebhookEndpointCreateRequest:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          pattern: "^https://"
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/WebhookEventType"
      additionalProperties: false
    WebhookEndpointCreated:
      allOf:
        - $ref: "#/components/schemas/WebhookEndpoint"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: Segredo de assinatura (`whsec_dm_...`), mostrado uma única vez.
    WebhookEndpointList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEndpoint"
      additionalProperties: false
    WebhookEnvelope:
      type: object
      description: Envelope comum a todo evento de saída.
      required: [id, type, created_at, org_id]
      properties:
        id:
          $ref: "#/components/schemas/EventId"
        type:
          $ref: "#/components/schemas/WebhookEventType"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        org_id:
          $ref: "#/components/schemas/OrgId"
    WebhookRunCompleted:
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelope"
        - type: object
          required: [data]
          properties:
            type:
              const: run.completed
            data:
              type: object
              required: [run]
              properties:
                run:
                  $ref: "#/components/schemas/Run"
              additionalProperties: false
    WebhookRunFailed:
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelope"
        - type: object
          required: [data]
          properties:
            type:
              const: run.failed
            data:
              type: object
              required: [run, error]
              properties:
                run:
                  $ref: "#/components/schemas/Run"
                error:
                  $ref: "#/components/schemas/RunError"
              additionalProperties: false
    WebhookRunNeedsApproval:
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelope"
        - type: object
          required: [data]
          properties:
            type:
              const: run.needs_approval
            data:
              type: object
              required: [run, quote]
              properties:
                run:
                  $ref: "#/components/schemas/Run"
                quote:
                  $ref: "#/components/schemas/Quote"
              additionalProperties: false
    WebhookCreditsLow:
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelope"
        - type: object
          required: [data]
          properties:
            type:
              const: credits.low
            data:
              type: object
              required: [credits, threshold]
              properties:
                credits:
                  $ref: "#/components/schemas/CreditSummary"
                threshold:
                  type: integer
                  minimum: 0
              additionalProperties: false

    # ---------------------------------------------------------------- public
    Plan:
      type: object
      required: [code, name, price, interval, credits, entitlements, available]
      properties:
        code:
          $ref: "#/components/schemas/PlanCode"
        name:
          type: string
        price:
          $ref: "#/components/schemas/Money"
        interval:
          type: string
          enum: [month]
        credits:
          type: integer
          minimum: 0
          description: Créditos por ciclo.
        topup_price_per_credit:
          $ref: "#/components/schemas/Money"
        entitlements:
          $ref: "#/components/schemas/Entitlements"
        available:
          type: boolean
          description: Falso quando o plano não é vendido no país informado.
      additionalProperties: false
    PlansResponse:
      type: object
      required: [country, plans]
      properties:
        country:
          type: string
          pattern: "^[A-Z]{2}$"
        plans:
          type: array
          items:
            $ref: "#/components/schemas/Plan"
      additionalProperties: false
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
      additionalProperties: false
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        checks:
          type: object
          required: [database, storage, harness]
          properties:
            database:
              type: string
              enum: [ok, failed]
            storage:
              type: string
              enum: [ok, failed]
            harness:
              type: string
              enum: [ok, degraded, failed]
          additionalProperties: false
