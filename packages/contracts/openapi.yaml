        documents:
          type: array
          items:
            $ref: "#/components/schemas/ProjectDocument"
      additionalProperties: false
    # ------------------------------------------------------------ primitives
    Error:
      type: object
      description: Envelope de erro de toda resposta 4xx/5xx. Os códigos e mensagens vêm de `errors.yaml`.
      required: [ code, message, request_id ]
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          description: Código estável (ver `errors.yaml`).
        message:
          type: string
          description: Mensagem em pt-BR para o usuário.
        request_id:
          type: string
          description: Id da requisição para suporte.
        details:
          type: object
          description: "Dados estruturados do erro (ex.: `fields` em `validation_failed`, `reason` em
            `customization_refused`, `retry_after_s` em `rate_limited`)."
          additionalProperties: true
      additionalProperties: false
      examples:
        - code: insufficient_credits
          message: Créditos insuficientes para esta execução. Faça uma recarga ou reduza o escopo.
          request_id: req_01JBXKEN8R4S9T0V1W2X3Y4Z5A
          details:
            required: 293
            available: 120
    Money:
      type: object
      description: Dinheiro como inteiro na menor unidade da moeda (centavos).
      required: [ amount, currency ]
      properties:
        amount:
          type: integer
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
      additionalProperties: false
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 em UTC.
    RunId:
      type: string
      pattern: "^run_[0-9A-HJKMNP-TV-Z]{26}$"
    UploadId:
      type: string
      pattern: "^upl_[0-9A-HJKMNP-TV-Z]{26}$"
    FindingId:
      type: string
      pattern: "^fnd_[0-9A-HJKMNP-TV-Z]{26}$"
    MatchId:
      type: string
      pattern: "^mtc_[0-9A-HJKMNP-TV-Z]{26}$"
    QuoteId:
      type: string
      pattern: "^qte_[0-9A-HJKMNP-TV-Z]{26}$"
    WorkflowId:
      type: string
      pattern: "^wfl_[0-9A-HJKMNP-TV-Z]{26}$"
    RuleId:
      type: string
      pattern: "^rul_[0-9A-HJKMNP-TV-Z]{26}$"
    OrgId:
      type: string
      pattern: "^org_[0-9A-HJKMNP-TV-Z]{26}$"
    UserId:
      type: string
      pattern: "^usr_[0-9A-HJKMNP-TV-Z]{26}$"
    CustomizationId:
      type: string
      pattern: "^cst_[0-9A-HJKMNP-TV-Z]{26}$"
    ApiKeyId:
      type: string
      pattern: "^key_[0-9A-HJKMNP-TV-Z]{26}$"
    WebhookEndpointId:
      type: string
      pattern: "^whe_[0-9A-HJKMNP-TV-Z]{26}$"
    LedgerEntryId:
      type: string
      pattern: "^ldg_[0-9A-HJKMNP-TV-Z]{26}$"
    EventId:
      type: string
      pattern: "^evt_[0-9A-HJKMNP-TV-Z]{26}$"
    BinaryFile:
      type: string
      format: binary
    Severity:
      type: string
      enum: [ info, low, medium, high, critical ]
    FindingStatus:
      type: string
      enum: [ open, confirmed, dismissed, resolved ]
    RunStatus:
      type: string
      enum: [ queued, running, needs_approval, completed, failed, cancelled ]
    Lane:
      type: string
      enum: [ app, api_batch, api_standard, api_priority ]
      description: Faixa de prioridade (multiplicadores em config/pricing.yaml). Chaves de API só usam as faixas do plano.
    LlmMode:
      type: string
      enum: [ openrouter, local, off ]
    ExportFormat:
      type: string
      enum: [ xlsx, csv, pdf ]
    RuleStatus:
      type: string
      enum: [ draft, candidate, verified, trusted, retired ]
    RuleScope:
      type: string
      enum: [ tenant, global ]
    PlanCode:
      type: string
      enum: [ starter, pro, business ]

    # ------------------------------------------------------------------ auth
    AuthStartRequest:
      type: object
      properties:
        redirect_to:
          type: string
          pattern: "^/[^/\\\\].*$|^/$"
          description: Caminho relativo no site para onde voltar depois do login (nunca uma URL absoluta).
        platform:
          type: string
          enum: [ web, android, ios ]
          default: web
      additionalProperties: false
    AuthStartResponse:
      type: object
      required: [ authorization_url, state, expires_at ]
      properties:
        authorization_url:
          type: string
          format: uri
        state:
          type: string
        expires_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    AppleCallbackForm:
      type: object
      description: Campos do `form_post` da Apple.
      required: [ code, id_token, state ]
      properties:
        code:
          type: string
        id_token:
          type: string
        state:
          type: string
        user:
          type: string
          description: JSON com nome e e-mail, só no primeiro login.
      additionalProperties: false
    AppleNativeCallback:
      type: object
      description: Token obtido pelo app iOS com AuthenticationServices.
      required: [ identity_token, authorization_code ]
      properties:
        identity_token:
          type: string
        authorization_code:
          type: string
        full_name:
          type: string
          maxLength: 80
          x-limit: text.display_name
      additionalProperties: false
    EmailStartRequest:
      type: object
      required: [ email ]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          x-limit: text.email
      additionalProperties: false
    EmailStartResponse:
      type: object
      required: [ challenge_id, expires_at, resend_after_s ]
      properties:
        challenge_id:
          type: string
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        resend_after_s:
          type: integer
          minimum: 0
      additionalProperties: false
    EmailVerifyRequest:
      type: object
      required: [ challenge_id, code ]
      properties:
        challenge_id:
          type: string
        code:
          type: string
          pattern: "^[0-9]{6}$|^[A-Za-z0-9_-]{43}$"
          description: O código de 6 dígitos digitado pelo usuário ou o token do link mágico recebido no mesmo e-mail
            (32 bytes em base64url).
      additionalProperties: false
    AuthMethods:
      type: object
      required: [ email, google, apple, password, dev ]
      properties:
        email:
          type: boolean
        google:
          type: boolean
        apple:
          type: boolean
        password:
          type: boolean
        dev:
          type: boolean
          description: Login local sem provedor (só em desenvolvimento).
      additionalProperties: false
    GoogleNativeRequest:
      type: object
      required: [ id_token ]
      properties:
        id_token:
          type: string
          minLength: 1
      additionalProperties: false
    DevLoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          x-limit: text.email
          description: Vazio usa dev@docmatch.test.
        name:
          type: string
          maxLength: 80
          x-limit: text.display_name
      additionalProperties: false
    Device:
      type: object
      required: [ id, platform, name, created_at, last_seen_at, current ]
      properties:
        id:
          type: string
          pattern: "^ses_[0-9A-Z]{26}$"
        platform:
          type: string
          enum: [ web, android, ios ]
        name:
          type: string
          description: Nome curto do aparelho (navegador e sistema, ou app e modelo).
        created_at:
          $ref: "#/components/schemas/Timestamp"
        last_seen_at:
          $ref: "#/components/schemas/Timestamp"
        ip_prefix:
          type: string
        current:
          type: boolean
      additionalProperties: false
    DeviceList:
      type: object
      required: [ items ]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Device"
      additionalProperties: false
    PasswordLoginRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          x-limit: text.email
        password:
          type: string
          maxLength: 128
          x-limit: text.password_max
        totp_code:
          type: string
          pattern: "^[0-9]{6}$"
          description: Reservado para o segundo fator (ainda não ativado).
      additionalProperties: false
    PasswordChangeRequest:
      type: object
      required: [ new_password ]
      properties:
        current_password:
          type: string
          maxLength: 128
          x-limit: text.password_max
        new_password:
          type: string
          minLength: 12
          maxLength: 128
          x-limit: text.password_max
          description: Entre `text.password_min` e `text.password_max` caracteres de `limits.yaml`.
      additionalProperties: false
    Session:
      type: object
      required: [ user, org, expires_at ]
      properties:
        user:
          $ref: "#/components/schemas/User"
        org:
          $ref: "#/components/schemas/Org"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false

    # --------------------------------------------------------------- account
    User:
      type: object
      required: [ id, email, display_name, role, locale, created_at ]
      properties:
        id:
          $ref: "#/components/schemas/UserId"
        email:
          type: string
          format: email
        display_name:
          type: string
          maxLength: 80
          x-limit: text.display_name
        membership_role:
          $ref: "#/components/schemas/MembershipRole"
        role:
          type: string
          enum: [ owner, member ]
        locale:
          type: string
          const: pt-BR
        created_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    Org:
      type: object
      required: [ id, name, plan, plan_status, created_at ]
      properties:
        id:
          $ref: "#/components/schemas/OrgId"
        name:
          type: string
          maxLength: 120
          x-limit: text.company_name
        plan:
          oneOf:
            - $ref: "#/components/schemas/PlanCode"
            - type: "null"
          description: Nulo sem assinatura.
        plan_status:
          type: string
          enum: [ none, trialing, active, past_due, cancelled ]
        created_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    Entitlements:
      type: object
      description: Limites efetivos do plano (config/pricing.yaml), já aplicados os overrides administrativos.
      required:
        - document_files_per_run
        - document_file_mb
        - document_run_mb
        - media_files_per_run
        - media_run_gb
        - media_run_hours
        - concurrent_runs
        - api_keys
        - api_lanes
        - auto_rule_learning
        - ui_customizations_per_month
        - escalation_model
        - retention_days
      properties:
        document_files_per_run:
          type: integer
          minimum: 0
        document_file_mb:
          type: integer
          minimum: 0
        document_run_mb:
          type: integer
          minimum: 0
        media_files_per_run:
          type: integer
          minimum: 0
        media_run_gb:
          type: integer
          minimum: 0
        media_run_hours:
          type: integer
          minimum: 0
        concurrent_runs:
          type: integer
          minimum: 0
        api_keys:
          type: integer
          minimum: 0
        api_lanes:
          type: array
          items:
            $ref: "#/components/schemas/Lane"
        auto_rule_learning:
          type: boolean
        ui_customizations_per_month:
          type: integer
          minimum: -1
          description: -1 é ilimitado.
        escalation_model:
          type: boolean
        retention_days:
          type: integer
          minimum: 1
      additionalProperties: false
    Me:
      type: object
      required: [ user, org, credits, entitlements ]
      properties:
        user:
          $ref: "#/components/schemas/User"
        org:
          $ref: "#/components/schemas/Org"
        credits:
          $ref: "#/components/schemas/CreditSummary"
        entitlements:
          $ref: "#/components/schemas/Entitlements"
        notifications:
          $ref: "#/components/schemas/NotificationPrefs"
      additionalProperties: false
    NotificationPrefs:
      type: object
      properties:
        run_completed:
          type: boolean
          default: true
        credits_low:
          type: boolean
          default: true
        product_news:
          type: boolean
          default: false
      additionalProperties: false
    MeUpdate:
      type: object
      minProperties: 1
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
          x-limit: text.display_name
        company_name:
          type: string
          minLength: 1
          maxLength: 120
          x-limit: text.company_name
        notifications:
          $ref: "#/components/schemas/NotificationPrefs"
      additionalProperties: false
    DeletionScheduled:
      type: object
      required: [ scheduled_for ]
      properties:
        scheduled_for:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    ExportStatus:
      type: object
      required: [ status, requested_at ]
      properties:
        status:
          type: string
          enum: [ pending, ready, expired ]
        requested_at:
          $ref: "#/components/schemas/Timestamp"
        download_url:
          type: string
          format: uri
          description: URL assinada, presente quando `ready`.
        expires_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false

    # --------------------------------------------------------------- uploads
    UploadKind:
      type: string
      enum: [ document, media ]
    UploadRequest:
      type: object
      required: [ kind, file_name, size_bytes, mime ]
      properties:
        kind:
          $ref: "#/components/schemas/UploadKind"
        file_name:
          type: string
          minLength: 1
          maxLength: 255
          x-limit: files.uploaded_file_name_bytes
          description: Nome original. O limite é em bytes UTF-8 após NFC; sem `/`, `\` nem caracteres de controle.
        size_bytes:
          type: integer
          minimum: 1
        mime:
          type: string
          pattern: "^[a-z0-9!#$&^_.+-]+/[a-z0-9!#$&^_.+-]+$"
          description: Tipo declarado; o scanner sniffa o real e pode rejeitar.
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Opcional; conferido em `complete`.
        role:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,39}$"
          description: "Papel no fluxo (ex.: `bank_statement`)."
      additionalProperties: false
    UploadTicket:
      oneOf:
        - $ref: "#/components/schemas/DocumentUploadTicket"
        - $ref: "#/components/schemas/MediaUploadTicket"
      discriminator:
        propertyName: kind
        mapping:
          document: "#/components/schemas/DocumentUploadTicket"
          media: "#/components/schemas/MediaUploadTicket"
    DocumentUploadTicket:
      type: object
      description: POST pré-assinado para o S3 (`multipart/form-data` com `fields` + `file`).
      required: [ id, kind, method, url, fields, expires_at, max_size_bytes ]
      properties:
        id:
          $ref: "#/components/schemas/UploadId"
        kind:
          type: string
          const: document
        method:
          type: string
          const: POST
        url:
          type: string
          format: uri
        fields:
          type: object
          additionalProperties:
            type: string
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        max_size_bytes:
          type: integer
      additionalProperties: false
    MediaUploadTicket:
      type: object
      description: PUT pré-assinado para o Cloudflare R2; envie o corpo bruto com os `headers`.
      required: [ id, kind, method, url, headers, expires_at, max_size_bytes ]
      properties:
        id:
          $ref: "#/components/schemas/UploadId"
        kind:
          type: string
          const: media
        method:
          type: string
          const: PUT
        url:
          type: string
          format: uri
        headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        max_size_bytes:
          type: integer
      additionalProperties: false
    UploadCompleteRequest:
      type: object
      properties:
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        etag:
          type: string
      additionalProperties: false
    UploadStatus:
      type: string
      enum: [ pending, scanning, ready, rejected, expired ]
    UploadRejectedReason:
      type: string
      enum: [ type, size, malware, bomb, playlist, name, checksum ]
      description: Motivo da rejeição; corresponde aos códigos `upload_rejected_*` e `upload_checksum_mismatch`.
    Upload:
      type: object
      required: [ id, kind, file_name, size_bytes, status, created_at, expires_at ]
      properties:
        id:
          $ref: "#/components/schemas/UploadId"
        kind:
          $ref: "#/components/schemas/UploadKind"
        file_name:
          type: string
        size_bytes:
          type: integer
        mime:
          type: string
          description: Tipo detectado pelo conteúdo (após a verificação).
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        status:
          $ref: "#/components/schemas/UploadStatus"
        rejected_reason:
          $ref: "#/components/schemas/UploadRejectedReason"
        duration_ms:
          type: integer
          minimum: 0
          description: Só mídia.
        role:
          type: string
        created_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
          description: Retenção do plano.
      additionalProperties: false

    # ------------------------------------------------------------------ runs
    LocatorHints:
      $ref: "./schemas/workflow-config.json#/$defs/LocatorHints"
    RunSource:
      type: object
      required: [ upload_id ]
      properties:
        upload_id:
          $ref: "#/components/schemas/UploadId"
        role:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,39}$"
        hints:
          $ref: "#/components/schemas/LocatorHints"
      additionalProperties: false
    RunOptions:
      type: object
      properties:
        llm_mode:
          $ref: "#/components/schemas/LlmMode"
        web_search:
          type: boolean
          default: false
        use_rules:
          type: boolean
          default: true
        rule_ids:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RuleId"
        lane:
          $ref: "#/components/schemas/Lane"
        escalation:
          type: boolean
          default: false
          description: Permite o modelo de escalonamento (plano business).
      additionalProperties: false
    EstimateRequest:
      type: object
      required: [ sources ]
      properties:
        sources:
          type: array
          minItems: 1
          maxItems: 100
          x-limit: ids.files_per_run_hard_max
          items:
            $ref: "#/components/schemas/RunSource"
          description: Documentos e planilhas. O plano pode permitir menos que o teto.
        media_sources:
          type: array
          maxItems: 50000
          x-limit: ids.media_files_per_run_hard_max
          items:
            $ref: "#/components/schemas/RunSource"
          description: Áudios e vídeos.
        workflow_id:
          $ref: "#/components/schemas/WorkflowId"
        rules_text:
          type: string
          maxLength: 4000
          x-limit: text.rules_text
          description: Regras avulsas em linguagem natural para esta execução.
        options:
          $ref: "#/components/schemas/RunOptions"
      additionalProperties: false
    RunCreateRequest:
      allOf:
        - $ref: "#/components/schemas/EstimateRequest"
        - type: object
          required: [ quote_id, quote_signature ]
          properties:
            quote_id:
              $ref: "#/components/schemas/QuoteId"
            quote_signature:
              type: string
              pattern: "^v1=[0-9a-f]{64}$"
      description: O mesmo pedido da estimativa mais o orçamento aceito. Fontes ou opções diferentes do orçamento
        devolvem `quote_mismatch`.
    ApproveQuoteRequest:
      type: object
      required: [ quote_id, quote_signature ]
      properties:
        quote_id:
          $ref: "#/components/schemas/QuoteId"
        quote_signature:
          type: string
          pattern: "^v1=[0-9a-f]{64}$"
      additionalProperties: false
    Quote:
      $ref: "./schemas/quote.json"
    RunCredits:
      type: object
      required: [ reserved, spent, refunded ]
      properties:
        reserved:
          type: integer
          minimum: 0
        spent:
          type: integer
          minimum: 0
        refunded:
          type: integer
          minimum: 0
      additionalProperties: false
    RunStage:
      type: string
      enum: [ scan, ingest, normalize, match, discover, adjudicate, verify, toolsmith, report ]
    RunProgress:
      type: object
      required: [ stage, percent ]
      properties:
        stage:
          $ref: "#/components/schemas/RunStage"
        percent:
          type: integer
          minimum: 0
          maximum: 100
        message:
          type: string
          description: Em pt-BR, para o painel de progresso.
      additionalProperties: false
    RunSummary:
      type: object
      required:
        [
          findings_total,
          findings_by_severity,
          amount_at_risk,
          currency,
          matches_total,
          lines_total,
          lines_matched
        ]
      properties:
        findings_total:
          type: integer
          minimum: 0
        findings_by_severity:
          type: object
          properties:
            info:
              type: integer
            low:
              type: integer
            medium:
              type: integer
            high:
              type: integer
            critical:
              type: integer
          additionalProperties: false
        amount_at_risk:
          type: integer
          minimum: 0
          description: Soma em centavos.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        matches_total:
          type: integer
          minimum: 0
        lines_total:
          type: integer
          minimum: 0
        lines_matched:
          type: integer
          minimum: 0
        new_tool_ids:
          type: array
          items:
            type: string
        proposed_rule_ids:
          type: array
          items:
            $ref: "#/components/schemas/RuleId"
        source_warnings:
          type: array
          maxItems: 100
          x-limit: ids.source_warnings_per_run
          description: Em pt-BR, por arquivo, o que não entrou na conciliação (PDF digitalizado, carteira sem títulos em
            aberto, arquivo não reconhecido).
          items:
            type: string
            maxLength: 500
            x-limit: text.source_warning
        reconciliation:
          $ref: "#/components/schemas/ReconciliationDocument"
      additionalProperties: false
    ReconciliationDocument:
      type: object
      description: Documento conciliado das fontes enviadas. Valores em centavos; propostas não reduzem o saldo
        confirmado. Disponível em novas execuções.
      required:
        - version
        - title
        - currency
        - period_start
        - period_end
        - receivables
        - bank_entries
        - totals
      properties:
        version:
          type: integer
          enum:
            - 1
        title:
          type: string
        currency:
          type: string
          enum:
            - BRL
        period_start:
          type: string
        period_end:
          type: string
        receivables:
          type: array
          items:
            $ref: '#/components/schemas/ReconciledReceivable'
        bank_entries:
          type: array
          items:
            $ref: '#/components/schemas/ReconciledBankEntry'
        totals:
          type: object
          required:
            - original_amount
            - duplicate_excluded
            - received_confirmed
            - principal_confirmed
            - open_balance
            - proposed_amount
            - projected_open_balance
            - unapplied_cash
            - bank_fees
            - fines_received
            - withholding_pending
          properties:
            original_amount:
              type: integer
              format: int64
              description: Valor em centavos.
            duplicate_excluded:
              type: integer
              format: int64
              description: Valor em centavos.
            received_confirmed:
              type: integer
              format: int64
              description: Valor em centavos.
            principal_confirmed:
              type: integer
              format: int64
              description: Valor em centavos.
            open_balance:
              type: integer
              format: int64
              description: Valor em centavos.
            proposed_amount:
              type: integer
              format: int64
              description: Valor em centavos.
            projected_open_balance:
              type: integer
              format: int64
              description: Valor em centavos.
            unapplied_cash:
              type: integer
              format: int64
              description: Valor em centavos.
            bank_fees:
              type: integer
              format: int64
              description: Valor em centavos.
            fines_received:
              type: integer
              format: int64
              description: Valor em centavos.
            withholding_pending:
              type: integer
              format: int64
              description: Valor em centavos.
          additionalProperties: false
      additionalProperties: false
    ReconciledReceivable:
      type: object
      required:
        - id
        - source_id
        - source_name
        - reference
        - customer
        - tax_id
        - due_date
        - paid_on
        - status
        - duplicate_of
        - source_row
        - original_amount
        - received_amount
        - applied_principal
        - open_amount
        - proposed_amount
        - fine_received
        - withholding_pending
        - bank_rows
        - flags
      properties:
        id:
          type: string
        source_id:
          type: string
        source_name:
          type: string
        reference:
          type: string
        customer:
          type: string
        tax_id:
          type: string
        due_date:
          type: string
        paid_on:
          type: string
        status:
          type: string
        duplicate_of:
          type: string
        source_row:
          type: integer
          minimum: 1
        original_amount:
          type: integer
          format: int64
          description: Valor em centavos.
        received_amount:
          type: integer
          format: int64
          description: Valor em centavos.
        applied_principal:
          type: integer
          format: int64
          description: Valor em centavos.
        open_amount:
          type: integer
          format: int64
          description: Valor em centavos.
        proposed_amount:
          type: integer
          format: int64
          description: Valor em centavos.
        fine_received:
          type: integer
          format: int64
          description: Valor em centavos.
        withholding_pending:
          type: integer
          format: int64
          description: Valor em centavos.
        bank_rows:
          type: array
          items:
            type: integer
        flags:
          type: array
          items:
            type: string
      additionalProperties: false
    ReconciledBankEntry:
      type: object
      required:
        - date
        - description
        - kind
        - rule
        - source_id
        - source_name
        - row
        - amount
        - proposed
        - matched_ids
      properties:
        date:
          type: string
        description:
          type: string
        kind:
          type: string
        rule:
          type: string
        source_id:
          type: string
        source_name:
          type: string
        row:
          type: integer
        amount:
          type: integer
          format: int64
          description: Valor em centavos.
        proposed:
          type: boolean
        matched_ids:
          type: array
          items:
            type: string
      additionalProperties: false
    RunError:
      type: object
      description: Falha de uma execução (código de `errors.yaml`).
      required: [ code, message, retryable ]
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        message:
          type: string
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: true
      additionalProperties: false
    Run:
      type: object
      required: [ id, status, lane, sources, credits, created_at, expires_at ]
      properties:
        project_id:
          $ref: "#/components/schemas/ProjectId"
        id:
          $ref: "#/components/schemas/RunId"
        status:
          $ref: "#/components/schemas/RunStatus"
        workflow_id:
          oneOf:
            - $ref: "#/components/schemas/WorkflowId"
            - type: "null"
        lane:
          $ref: "#/components/schemas/Lane"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Upload"
        quote:
          $ref: "#/components/schemas/Quote"
        pending_quote:
          $ref: "#/components/schemas/Quote"
          description: Orçamento adicional aguardando aprovação (só em `needs_approval`).
        credits:
          $ref: "#/components/schemas/RunCredits"
        progress:
          $ref: "#/components/schemas/RunProgress"
        summary:
          $ref: "#/components/schemas/RunSummary"
        error:
          $ref: "#/components/schemas/RunError"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        started_at:
          $ref: "#/components/schemas/Timestamp"
        finished_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
          description: Fim da retenção do plano; depois disso arquivos e resultados são apagados.
      additionalProperties: false
    RunList:
      type: object
      required: [ items, next_cursor ]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Run"
        next_cursor:
          type: [ "string", "null" ]
      additionalProperties: false
    Finding:
      $ref: "./schemas/finding.json"
    Evidence:
      $ref: "./schemas/finding.json#/$defs/Evidence"
    FindingList:
      type: object
      required: [ items, next_cursor ]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        next_cursor:
          type: [ "string", "null" ]
      additionalProperties: false
    FindingFeedbackRequest:
      type: object
      required: [ status ]
      properties:
        status:
          type: string
          enum: [ confirmed, dismissed, resolved ]
        reason:
          type: string
          enum: [ false_positive, already_known, wrong_amount, duplicate, other ]
        note:
          type: string
          maxLength: 500
          x-limit: text.finding_feedback_note
      additionalProperties: false
    Match:
      type: object
      description: Casamento entre linhas de fontes diferentes (ou grupo um-para-muitos).
      required: [ id, run_id, kind, left, right, confidence, created_at ]
      properties:
        id:
          $ref: "#/components/schemas/MatchId"
        run_id:
          $ref: "#/components/schemas/RunId"
        kind:
          type: string
          enum: [ exact, tolerance, sum, fuzzy, rule, model ]
        left:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Evidence"
        right:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Evidence"
        confidence:
          type: number
          minimum: 0
          maximum: 1
        amount:
          type: integer
          description: Centavos.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        rule_id:
          oneOf:
            - $ref: "#/components/schemas/RuleId"
            - type: "null"
        explanation:
          type: string
        created_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false

    # ------------------------------------------------------------- SSE events
    RunEvent:
      type: object
      description: |
        Um evento do fluxo `text/event-stream`: `id` é a sequência (use em `Last-Event-ID`),
        `event` é o nome e `data` segue o esquema do evento (também listados em `x-sse-events`
        da operação). No fio, cada evento é serializado como:

        ```
        id: 42
        event: finding
        data: {"finding": {...}}
        ```
      required: [ id, event, data ]
      properties:
        id:
          type: integer
          minimum: 1
        event:
          type: string
          enum: [ stage_started, progress, token_usage, finding, match, needs_approval, completed, failed ]
        data:
          oneOf:
            - $ref: "#/components/schemas/RunEventStageStarted"
            - $ref: "#/components/schemas/RunEventProgress"
            - $ref: "#/components/schemas/RunEventTokenUsage"
            - $ref: "#/components/schemas/RunEventFinding"
            - $ref: "#/components/schemas/RunEventMatch"
            - $ref: "#/components/schemas/RunEventNeedsApproval"
            - $ref: "#/components/schemas/RunEventCompleted"
            - $ref: "#/components/schemas/RunEventFailed"
      additionalProperties: false
    RunEventStageStarted:
      type: object
      required: [ stage ]
      properties:
        stage:
          $ref: "#/components/schemas/RunStage"
        message:
          type: string
        total_steps:
          type: integer
          minimum: 0
      additionalProperties: false
    RunEventProgress:
      type: object
      required: [ stage, done, total ]
      properties:
        stage:
          $ref: "#/components/schemas/RunStage"
        done:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        message:
          type: string
        credits_spent:
          type: integer
          minimum: 0
      additionalProperties: false
    RunEventTokenUsage:
      type: object
      required: [ role, model, prompt_tokens, completion_tokens, credits, credits_spent_total ]
      properties:
        role:
          type: string
          description: Papel de config/models.yaml.
        model:
          type: string
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        cached_tokens:
          type: integer
          minimum: 0
        credits:
          type: integer
          minimum: 0
        credits_spent_total:
          type: integer
          minimum: 0
        cached:
          type: boolean
      additionalProperties: false
    RunEventFinding:
      type: object
      required: [ finding ]
      properties:
        finding:
          $ref: "#/components/schemas/Finding"
      additionalProperties: false
    RunEventMatch:
      type: object
      required: [ match ]
      properties:
        match:
          $ref: "#/components/schemas/Match"
      additionalProperties: false
    RunEventNeedsApproval:
      type: object
      required: [ quote, reasons, credits_spent_so_far ]
      properties:
        quote:
          $ref: "#/components/schemas/Quote"
        reasons:
          type: array
          items:
            type: string
            enum: [ new_tools, over_default_budget, media_heavy, web_search, escalation_model ]
        message:
          type: string
        credits_spent_so_far:
          type: integer
          minimum: 0
      additionalProperties: false
    RunEventCompleted:
      type: object
      required: [ summary, credits_spent, credits_refunded ]
      properties:
        summary:
          $ref: "#/components/schemas/RunSummary"
        credits_spent:
          type: integer
          minimum: 0
        credits_refunded:
          type: integer
          minimum: 0
      additionalProperties: false
    RunEventFailed:
      type: object
      required: [ error, credits_spent ]
      properties:
        error:
          $ref: "#/components/schemas/RunError"
        credits_spent:
          type: integer
          minimum: 0
      additionalProperties: false

    # ------------------------------------------------------------- workflows
    WorkflowConfig:
      $ref: "./schemas/workflow-config.json"
    WorkflowPatch:
      type: object
      description: Seções de `WorkflowConfig`, todas opcionais; as enviadas substituem as atuais por inteiro.
      minProperties: 1
      properties:
        name:
          $ref: "./schemas/workflow-config.json#/properties/name"
        sources:
          $ref: "./schemas/workflow-config.json#/properties/sources"
        matching:
          $ref: "./schemas/workflow-config.json#/$defs/Matching"
        rules:
          $ref: "./schemas/workflow-config.json#/$defs/Rules"
        llm:
          $ref: "./schemas/workflow-config.json#/properties/llm"
        budget:
          $ref: "./schemas/workflow-config.json#/properties/budget"
        outputs:
          $ref: "./schemas/workflow-config.json#/properties/outputs"
      additionalProperties: false
    Workflow:
      type: object
      required: [ id, org_id, config, runs_count, created_at, updated_at ]
      properties:
        id:
          $ref: "#/components/schemas/WorkflowId"
        org_id:
          $ref: "#/components/schemas/OrgId"
        config:
          $ref: "#/components/schemas/WorkflowConfig"
        runs_count:
          type: integer
          minimum: 0
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    WorkflowList:
      type: object
      required: [ items, next_cursor ]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Workflow"
        next_cursor:
          type: [ "string", "null" ]
      additionalProperties: false

    # ----------------------------------------------------------------- rules
    Rule:
      $ref: "./schemas/rule.json"
    RuleList:
      type: object
      required: [ items, next_cursor ]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Rule"
        next_cursor:
          type: [ "string", "null" ]
      additionalProperties: false
    RuleCreateRequest:
      type: object
      required: [ title, body ]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          x-limit: text.saved_rule_title
        body:
          type: string
          minLength: 1
          maxLength: 2000
          x-limit: text.saved_rule_body
        applies_to:
          $ref: "./schemas/rule.json#/properties/applies_to"
        compile:
          type: boolean
          default: true
          description: Falso salva como `draft` sem gastar créditos.
      additionalProperties: false
    RuleVersionRequest:
      type: object
      required: [ body ]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          x-limit: text.saved_rule_title
        body:
          type: string
          minLength: 1
          maxLength: 2000
          x-limit: text.saved_rule_body
      additionalProperties: false
    RulePromoteRequest:
      type: object
      required: [ to ]
      properties:
        to:
          type: string
          enum: [ verified, trusted, retired ]
      additionalProperties: false

    # --------------------------------------------------------------- billing
    BillingStatus:
      type: object
      required:
        [
          enabled,
          test_mode,
          can_manage,
          has_customer,
          blocked,
          minimum_topup_credits,
          maximum_topup_credits,
          token_brl,
          subscription
        ]
      properties:
        enabled:
          type: boolean
        test_mode:
          type: boolean
        can_manage:
          type: boolean
        has_customer:
          type: boolean
        blocked:
          type: boolean
        minimum_topup_credits:
          type: integer
        maximum_topup_credits:
          type: integer
        token_brl:
          type: number
        subscription:
          type: [ object, "null" ]
          required: [ plan, status, current_period_end, cancel_at ]
          properties:
            plan:
              $ref: "#/components/schemas/PlanCode"
            status:
              type: string
              enum: [ active, trialing, past_due, canceled, unpaid, incomplete, incomplete_expired, paused ]
            current_period_end:
              type: [ string, "null" ]
              format: date-time
            cancel_at:
              type: [ string, "null" ]
              format: date-time
          additionalProperties: false
      additionalProperties: false
    CheckoutRequest:
      type: object
      required: [ plan ]
      properties:
        plan:
          $ref: "#/components/schemas/PlanCode"
        coupon_code:
          type: string
          minLength: 1
          maxLength: 32
          x-limit: text.coupon_code
        success_path:
          type: string
          pattern: "^/[^/\\\\].*$|^/$"
        cancel_path:
          type: string
          pattern: "^/[^/\\\\].*$|^/$"
      additionalProperties: false
    CheckoutResponse:
      type: object
      required: [ checkout_url, session_id, expires_at ]
      properties:
        checkout_url:
          type: string
          format: uri
        session_id:
          type: string
        expires_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    PortalResponse:
      type: object
      required: [ portal_url ]
      properties:
        portal_url:
          type: string
          format: uri
      additionalProperties: false
    TopupRequest:
      type: object
      required: [ credits ]
      properties:
        credits:
          type: integer
          minimum: 1
          description: Quantidade de créditos; o preço unitário vem de `GET /plans`.
        success_path:
          type: string
          pattern: "^/[^/\\\\].*$|^/$"
        cancel_path:
          type: string
          pattern: "^/[^/\\\\].*$|^/$"
      additionalProperties: false
    CreditSummary:
      type: object
      required: [ balance, reserved, available, plan_credits, topup_credits ]
      properties:
        token_exempt:
          type: boolean
          readOnly: true
          default: false
          description: Conta de teste autorizada pelo operador; execuções não debitam tokens.
        balance:
          type: integer
          minimum: 0
        reserved:
          type: integer
          minimum: 0
          description: Reservados por execuções ativas.
        available:
          type: integer
          minimum: 0
          description: "`balance - reserved`."
        plan_credits:
          type: integer
          minimum: 0
          description: Parcela do ciclo do plano (expira no fim do ciclo seguinte).
        topup_credits:
          type: integer
          minimum: 0
          description: Parcela comprada avulsa (expira em 12 meses).
        plan_cycle_ends_at:
          $ref: "#/components/schemas/Timestamp"
        next_expiry_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    LedgerEntry:
      type: object
      required: [ id, kind, credits, balance_after, description, created_at ]
      properties:
        id:
          $ref: "#/components/schemas/LedgerEntryId"
        kind:
          type: string
          enum: [ plan_grant, topup, reserve, spend, release, refund, expire, adjustment, bounty ]
        credits:
          type: integer
          description: Positivo entra, negativo sai.
        balance_after:
          type: integer
          minimum: 0
        run_id:
          oneOf:
            - $ref: "#/components/schemas/RunId"
            - type: "null"
        description:
          type: string
          description: Em pt-BR.
        created_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    LedgerList:
      type: object
      required: [ items, next_cursor ]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LedgerEntry"
        next_cursor:
          type: [ "string", "null" ]
      additionalProperties: false
    StripeEvent:
      type: object
      description: Evento do Stripe (`checkout.session.completed`, `invoice.paid`, `customer.subscription.updated`,
        ...). Processado a partir do corpo bruto.
      required: [ id, type, data ]
      properties:
        id:
          type: string
        type:
          type: string
        data:
          type: object
          additionalProperties: true
      additionalProperties: true

    # -------------------------------------------------------- customizations
    UiManifest:
      $ref: "./schemas/ui-manifest.json"
    CustomizationRequest:
      type: object
      required:
        - request
      additionalProperties: false
      properties:
        request:
          type: string
          minLength: 3
          maxLength: 2000
          x-limit: text.ui_customization_request
    CustomizationStatus:
      type: string
      enum:
        - pending
        - planned
        - applied
        - rejected
        - failed
    Customization:
      type: object
      required:
        - id
        - status
        - request
        - base_version
        - credits
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/CustomizationId"
        status:
          $ref: "#/components/schemas/CustomizationStatus"
        request:
          type: string
        base_version:
          type: integer
        manifest:
          $ref: "#/components/schemas/WorkspaceManifest"
        reason:
          type: string
        credits:
          type: integer
          const: 0
        created_at:
          type: string
          format: date-time

    # -------------------------------------------------------------- api keys
    ApiKeyScope:
      type: string
      enum:
        - runs:read
        - runs:write
        - uploads:write
        - workflows:read
        - workflows:write
        - rules:read
        - rules:write
        - projects:read
        - projects:write
        - credits:read
        - webhooks:write
    ApiKey:
      type: object
      required: [ id, label, prefix, scopes, lane, created_at ]
      properties:
        id:
          $ref: "#/components/schemas/ApiKeyId"
        label:
          type: string
          maxLength: 60
          x-limit: text.api_key_label
        prefix:
          type: string
          description: "`dm_live_<id>`, para identificar a chave sem o segredo."
        scopes:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ApiKeyScope"
        lane:
          $ref: "#/components/schemas/Lane"
        last_used_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        revoked_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
      additionalProperties: false
    ApiKeyCreateRequest:
      type: object
      required: [ label, scopes ]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 60
          x-limit: text.api_key_label
        scopes:
          type: array
          minItems: 1
          maxItems: 10
          x-limit: ids.api_key_scopes_max
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ApiKeyScope"
        lane:
          $ref: "#/components/schemas/Lane"
          description: Padrão `api_batch`; as demais dependem do plano.
      additionalProperties: false
    ApiKeyCreated:
      type: object
      required: [ id, label, prefix, scopes, lane, created_at, key ]
      properties:
        id:
          $ref: "#/components/schemas/ApiKey/properties/id"
        label:
          $ref: "#/components/schemas/ApiKey/properties/label"
        prefix:
          $ref: "#/components/schemas/ApiKey/properties/prefix"
        scopes:
          $ref: "#/components/schemas/ApiKey/properties/scopes"
        lane:
          $ref: "#/components/schemas/ApiKey/properties/lane"
        created_at:
          $ref: "#/components/schemas/ApiKey/properties/created_at"
        last_used_at:
          $ref: "#/components/schemas/ApiKey/properties/last_used_at"
        key:
          type: string
          pattern: "^dm_live_[0-9A-HJKMNP-TV-Z]{26}_[A-Za-z0-9_-]{32,64}$"
          description: Segredo completo, mostrado uma única vez.
      additionalProperties: false
    ApiKeyList:
      type: object
      required: [ items, access ]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"
        access:
          type: object
          required: [ can_create, eligible, limit, lanes, scopes ]
          properties:
            can_create: { type: boolean }
            eligible: { type: boolean }
            limit: { type: integer }
            lanes:
              type: array
              items: { $ref: "#/components/schemas/Lane" }
            scopes:
              type: array
              items: { $ref: "#/components/schemas/ApiKeyScope" }
          additionalProperties: false
      additionalProperties: false

    # -------------------------------------------------------------- webhooks
    WebhookEventType:
      type: string
      enum: [ run.completed, run.failed, run.needs_approval, credits.low ]
    WebhookEndpoint:
      type: object
      required: [ id, url, events, status, created_at ]
      properties:
        id:
          $ref: "#/components/schemas/WebhookEndpointId"
        url:
          type: string
          format: uri
          pattern: "^https://"
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/WebhookEventType"
        status:
          type: string
          enum: [ active, disabled ]
          description: Desativado automaticamente após 7 dias de falhas consecutivas.
        created_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    WebhookEndpointCreateRequest:
      type: object
      required: [ url, events ]
      properties:
        url:
          type: string
          format: uri
          pattern: "^https://"
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/WebhookEventType"
      additionalProperties: false
    WebhookEndpointCreated:
      allOf:
        - $ref: "#/components/schemas/WebhookEndpoint"
        - type: object
          required: [ secret ]
          properties:
            secret:
              type: string
              description: Segredo de assinatura (`whsec_dm_...`), mostrado uma única vez.
    WebhookEndpointList:
      type: object
      required: [ items ]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEndpoint"
      additionalProperties: false
    WebhookEnvelope:
      type: object
      description: Envelope comum a todo evento de saída.
      required: [ id, type, created_at, org_id ]
      properties:
        id:
          $ref: "#/components/schemas/EventId"
        type:
          $ref: "#/components/schemas/WebhookEventType"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        org_id:
          $ref: "#/components/schemas/OrgId"
    WebhookRunCompleted:
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelope"
        - type: object
          required: [ data ]
          properties:
            type:
              const: run.completed
            data:
              type: object
              required: [ run ]
              properties:
                run:
                  $ref: "#/components/schemas/Run"
              additionalProperties: false
    WebhookRunFailed:
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelope"
        - type: object
          required: [ data ]
          properties:
            type:
              const: run.failed
            data:
              type: object
              required: [ run, error ]
              properties:
                run:
                  $ref: "#/components/schemas/Run"
                error:
                  $ref: "#/components/schemas/RunError"
              additionalProperties: false
    WebhookRunNeedsApproval:
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelope"
        - type: object
          required: [ data ]
          properties:
            type:
              const: run.needs_approval
            data:
              type: object
              required: [ run, quote ]
              properties:
                run:
                  $ref: "#/components/schemas/Run"
                quote:
                  $ref: "#/components/schemas/Quote"
              additionalProperties: false
    WebhookCreditsLow:
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelope"
        - type: object
          required: [ data ]
          properties:
            type:
              const: credits.low
            data:
              type: object
              required: [ credits, threshold ]
              properties:
                credits:
                  $ref: "#/components/schemas/CreditSummary"
                threshold:
                  type: integer
                  minimum: 0
              additionalProperties: false

    # ---------------------------------------------------------------- public
    Plan:
      type: object
      required: [ code, name, price, interval, credits, entitlements, available ]
      properties:
        code:
          $ref: "#/components/schemas/PlanCode"
        name:
          type: string
        price:
          $ref: "#/components/schemas/Money"
        interval:
          type: string
          enum: [ month ]
        credits:
          type: integer
          minimum: 0
          description: Créditos por ciclo.
        topup_price_per_credit:
          $ref: "#/components/schemas/Money"
        entitlements:
          $ref: "#/components/schemas/Entitlements"
        available:
          type: boolean
          description: Falso quando o plano não é vendido no país informado.
      additionalProperties: false
    PlansResponse:
      type: object
      required: [ country, plans ]
      properties:
        country:
          type: string
          pattern: "^[A-Z]{2}$"
        plans:
          type: array
          items:
            $ref: "#/components/schemas/Plan"
      additionalProperties: false
    Health:
      type: object
      required: [ status ]
      properties:
        status:
          type: string
          const: ok
      additionalProperties: false
    Readiness:
      type: object
      required: [ status, checks ]
      properties:
        status:
          type: string
          enum: [ ok, degraded, unavailable ]
        checks:
          type: object
          required: [ database, storage, harness ]
          properties:
            database:
              type: string
              enum: [ ok, failed ]
            storage:
              type: string
              enum: [ ok, failed ]
            harness:
              type: string
              enum: [ ok, degraded, failed ]
          additionalProperties: false
      additionalProperties: false
    Version:
      type: object
      required: [ version, commit, built_at ]
      properties:
        version:
          type: string
        commit:
          type: string
          pattern: "^[0-9a-f]{7,40}$"
        built_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    WorkspaceManifest:
      type: object
      additionalProperties: false
      required:
        - version
        - mode
        - density
        - findings_label
        - group_by
        - sort_by
        - export_format
      properties:
        version:
          type: integer
          const: 1
        mode:
          type: string
          enum:
            - system
            - light
            - dark
        density:
          type: string
          enum:
            - comfortable
            - compact
        findings_label:
          type: string
          description: Texto puro, de 1 a 40 caracteres; sem HTML, URLs ou controles.
        group_by:
          type: string
          enum:
            - none
            - severity
            - kind
        sort_by:
          type: string
          enum:
            - severity
            - amount_at_risk
            - confidence
        export_format:
          type: string
          enum:
            - xlsx
            - csv
            - pdf
    Workspace:
      type: object
      required:
        - version
        - manifest
        - access
        - history
        - endpoints
      properties:
        version:
          type: integer
        manifest:
          $ref: "#/components/schemas/WorkspaceManifest"
        access:
          type: object
          properties:
            eligible:
              type: boolean
            can_request:
              type: boolean
            limit:
              type: integer
            used:
              type: integer
        history:
          type: array
          items:
            type: object
            properties:
              version:
                type: integer
              created_at:
                type: string
                format: date-time
        endpoints:
          type: array
          items:
            type: object
            properties:
              operation:
                type: string
              method:
                type: string
              path:
                type: string
