---
# Default-deny in both directions. Inbound: 443 from CloudFront's published ranges only (the
# security group enforces the same with the managed prefix list). Outbound: link-local VPC
# services, AWS endpoints for the allowed users, and the egress proxy for everything else.
- name: Create the nftables include directory
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create the runtime include directory at boot (role rules written by user-data)
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/docmatch-nft.conf
    content: |
      d {{ hardening_nft_runtime_dir }} 0750 root root -
    owner: root
    group: root
    mode: "0644"

- name: Install the break-glass include (empty unless enabled)
  ansible.builtin.template:
    src: nftables-breakglass.nft.j2
    dest: /etc/nftables.d/20-breakglass.nft
    owner: root
    group: root
    mode: "0640"

- name: Generate the AWS range sets for the first boot
  ansible.builtin.command:
    cmd: /usr/local/sbin/docmatch-aws-ranges --no-reload
  register: hardening_aws_ranges
  changed_when: hardening_aws_ranges.rc == 0

- name: Install the ruleset (checked with nft -c; loaded by nftables.service at boot, not during the build)
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0640"
    validate: nft -c -f %s

- name: Enable nftables at boot
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
