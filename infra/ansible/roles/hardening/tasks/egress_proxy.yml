---
# tinyproxy on loopback is the only path to the internet for anything that is not an AWS
# endpoint (nftables enforces it by user). The allowlist is rendered at boot from
# DM_EGRESS_ALLOWLIST; the file installed here is the build-time default, which also carries the
# package repositories the rest of the build installs from (apt goes through the proxy from here on).
- name: Create the tinyproxy drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/tinyproxy.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Harden the tinyproxy unit
  ansible.builtin.template:
    src: tinyproxy-override.conf.j2
    dest: /etc/systemd/system/tinyproxy.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart tinyproxy

- name: Configure tinyproxy
  ansible.builtin.template:
    src: tinyproxy.conf.j2
    dest: /etc/tinyproxy/tinyproxy.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart tinyproxy

- name: Install the default allowlist
  ansible.builtin.template:
    src: tinyproxy-filter.j2
    dest: "{{ hardening_proxy_allowlist_file }}"
    owner: root
    group: "{{ hardening_proxy_user }}"
    mode: "0640"
  notify: Restart tinyproxy

- name: Install the allowlist renderer (runs after the env is rendered at boot)
  ansible.builtin.template:
    src: docmatch-egress-allowlist.sh.j2
    dest: /usr/local/sbin/docmatch-egress-allowlist
    owner: root
    group: root
    mode: "0750"

- name: Apply the proxy configuration now (the rest of the build installs through it)
  ansible.builtin.meta: flush_handlers

- name: Enable and start tinyproxy
  ansible.builtin.systemd_service:
    name: tinyproxy
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for the proxy port
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ hardening_proxy_port }}"
    timeout: 30

- name: Route apt through the egress proxy
  ansible.builtin.template:
    src: apt-proxy.conf.j2
    dest: /etc/apt/apt.conf.d/80docmatch-proxy
    owner: root
    group: root
    mode: "0644"

- name: Create the system.conf drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Export the proxy to every systemd service (NO_PROXY keeps AWS endpoints direct)
  ansible.builtin.template:
    src: systemd-proxy.conf.j2
    dest: /etc/systemd/system.conf.d/10-docmatch-proxy.conf
    owner: root
    group: root
    mode: "0644"

- name: Export the proxy to interactive sessions
  ansible.builtin.template:
    src: environment-proxy.sh.j2
    dest: /etc/profile.d/98-docmatch-proxy.sh
    owner: root
    group: root
    mode: "0644"
