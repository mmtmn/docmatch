---
# No clamd (it would hold 1 GB resident on a 2 GB box). freshclam keeps the database current
# through the proxy and a weekly clamscan of the root filesystem runs under a memory cap.
- name: Configure freshclam
  ansible.builtin.template:
    src: freshclam.conf.j2
    dest: /etc/clamav/freshclam.conf
    owner: clamav
    group: adm
    mode: "0644"
  notify: Restart clamav-freshclam

- name: Create the quarantine directory
  ansible.builtin.file:
    path: /var/lib/docmatch/quarantine
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install the weekly scan units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [docmatch-clamscan.service, docmatch-clamscan.timer]
  notify: Reload systemd

- name: Stop the freshclam daemon the package started (it holds the database lock)
  ansible.builtin.systemd_service:
    name: clamav-freshclam.service
    state: stopped

- name: Download the signature database once during the build (through the proxy)
  ansible.builtin.command:
    cmd: freshclam --quiet --no-dns
  register: hardening_freshclam
  changed_when: hardening_freshclam.rc == 0
  failed_when: false

- name: Enable freshclam and the weekly scan
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    daemon_reload: true
  loop: [clamav-freshclam.service, docmatch-clamscan.timer]
