---
- name: Enable process accounting
  ansible.builtin.systemd_service:
    name: acct
    enabled: true
    state: started

- name: Enable sysstat collection
  ansible.builtin.lineinfile:
    path: /etc/default/sysstat
    regexp: '^ENABLED='
    line: 'ENABLED="true"'

- name: Enable the sysstat timer
  ansible.builtin.systemd_service:
    name: sysstat
    enabled: true
    state: started

- name: Create the journald drop-in directory first
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Make the journal persistent and bounded
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/docmatch.conf
    content: |
      [Journal]
      Storage=persistent
      Compress=yes
      SystemMaxUse=400M
      SystemKeepFree=1G
      MaxRetentionSec=30day
      ForwardToSyslog=no
      ForwardToWall=no
      RateLimitIntervalSec=30s
      RateLimitBurst=20000
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald

- name: Create the persistent journal directory
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"

# /var/log itself stays traversable: postgres, caddy, clamav, tinyproxy, chrony, pgbackrest and
# docmatch each log to their own directory below it and 0750 root:syslog would cut all of them
# off (the build's PostgreSQL start is the first casualty). Ubuntu ships it 0775 root:syslog;
# with rsyslog removed nothing needs the group write bit. Sensitive entries are restricted one by
# one instead: /var/log/audit 0700 (auditd.yml), /var/log/journal 2755 root:systemd-journal
# (above), /var/log/docmatch 0750 (users.yml) and the sudo log below.
- name: Keep /var/log traversable by every service that logs below it
  ansible.builtin.file:
    path: /var/log
    state: directory
    owner: root
    group: syslog
    mode: "0755"

- name: Restrict the sudo log to root (created here so the mode exists before the first sudo)
  ansible.builtin.file:
    path: /var/log/sudo.log
    state: touch
    owner: root
    group: root
    mode: "0600"
    modification_time: preserve
    access_time: preserve
