---
# Packer needs SSH during the build (through the SSM tunnel). It is hardened here so the Lynis
# gate sees a sane daemon, and purged by infra/packer/scripts/finalize.sh before the AMI is cut.
- name: Harden the OpenSSH daemon for the remainder of the build
  ansible.builtin.template:
    src: sshd-docmatch.conf.j2
    dest: /etc/ssh/sshd_config.d/00-docmatch.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s

- name: Tighten permissions of the SSH configuration
  ansible.builtin.file:
    path: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
