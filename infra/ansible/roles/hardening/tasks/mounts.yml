---
# Separate tmpfs for /tmp and /var/tmp, hardened /dev/shm and a nodev,nosuid,noexec bind of
# /var/log. Applied late in the build so package installers still get an executable /tmp; /tmp
# and /var/tmp are mounted right away so the rest of the build (and verify.yml) sees the runtime
# layout. The fstab lines are enough for boot: systemd-fstab-generator turns them into tmp.mount
# and var-tmp.mount, which outrank the stock unit. They must never be masked: a mask in
# /etc/systemd/system also masks the generated unit and /tmp silently stays on the root fs.
- name: Mount /tmp as tmpfs
  ansible.posix.mount:
    path: /tmp
    src: tmpfs
    fstype: tmpfs
    opts: defaults,rw,nodev,nosuid,noexec,relatime,size=512M,mode=1777
    state: mounted
  # libpam-tmpdir points root's TMPDIR at /tmp/user/0, where the module unpacks itself; the new
  # mount would hide that copy before the module finishes, so it unpacks outside the mount points.
  environment:
    TMPDIR: /root

- name: Mount /var/tmp as tmpfs
  ansible.posix.mount:
    path: /var/tmp
    src: tmpfs
    fstype: tmpfs
    opts: defaults,rw,nodev,nosuid,noexec,relatime,size=256M,mode=1777
    state: mounted
  # libpam-tmpdir points root's TMPDIR at /tmp/user/0, where the module unpacks itself; the new
  # mount would hide that copy before the module finishes, so it unpacks outside the mount points.
  environment:
    TMPDIR: /root

- name: Harden /dev/shm
  ansible.posix.mount:
    path: /dev/shm
    src: tmpfs
    fstype: tmpfs
    opts: defaults,rw,nodev,nosuid,noexec,relatime,size=256M
    state: present

- name: Bind-mount /var/log with restrictive options
  ansible.posix.mount:
    path: /var/log
    src: /var/log
    fstype: none
    opts: bind,nodev,nosuid,noexec
    state: present

- name: Make sure no tmpfs unit is masked (a mask would also hide the fstab-generated unit)
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: false
  loop: [tmp.mount, var-tmp.mount]

- name: Reload systemd so the fstab generator renders the mount units
  ansible.builtin.systemd_service:
    daemon_reload: true

# Read the build instance's fstab (a lookup would read the controller's) and only touch the
# root line when it does not carry nodev yet; the tmpfs lines above always do.
- name: Read the target fstab
  ansible.builtin.slurp:
    src: /etc/fstab
  register: hardening_fstab

- name: Add nodev to the root filesystem options
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^(\S+\s+/\s+\S+\s+)(\S+)(\s+.*)$'
    line: '\1\2,nodev\3'
    backrefs: true
  when: not ((hardening_fstab.content | b64decode) is regex('(?m)^\S+\s+/\s+\S+\s+\S*\bnodev\b'))

# /tmp is a fresh tmpfs at every boot, and libpam-tmpdir refuses to work ("Failed to create safe
# $TMPDIR") when the first PAM session of the boot was a service user's and left /tmp/user owned
# by it. systemd-tmpfiles creates it as root before any session.
- name: Create /tmp/user for libpam-tmpdir at boot
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/docmatch-pam-tmpdir.conf
    content: |
      d /tmp/user 0711 root root -
    owner: root
    group: root
    mode: "0644"
