---
- name: Install Caddy from the official repository
  ansible.builtin.apt:
    name: caddy
    state: present
    install_recommends: false

- name: List the modules of the installed Caddy binary
  ansible.builtin.command:
    cmd: caddy list-modules --skip-standard
  register: hardening_caddy_modules
  changed_when: false

# The packaged Caddy no longer has add-package (a binary owned by dpkg must not rewrite itself).
# The image takes the official custom build instead, the way the Caddy docs describe it for apt
# installs: the packaged binary is diverted to caddy.default and the build with the Route 53 DNS
# and CrowdSec modules becomes /usr/bin/caddy through update-alternatives. The apt source is
# disabled after the install, so only a new AMI changes either binary.
- name: Decide whether Caddy needs the custom build
  ansible.builtin.set_fact:
    hardening_caddy_needs_modules: >-
      {{ 'dns.providers.route53' not in hardening_caddy_modules.stdout
         or 'http.handlers.crowdsec' not in hardening_caddy_modules.stdout }}

- name: Download Caddy with the Route 53 DNS and CrowdSec modules (official build service)
  ansible.builtin.get_url:
    url: >-
      {{ hardening_caddy_build_url }}?{{ (['os=linux', 'arch=arm64']
      + (hardening_caddy_build_packages | map('urlencode') | map('regex_replace', '^', 'p=') | list))
      | join('&') }}
    dest: /usr/bin/caddy.custom
    owner: root
    group: root
    mode: "0755"
    timeout: 600
  register: hardening_caddy_download
  until: hardening_caddy_download is succeeded
  retries: 3
  delay: 15
  when: hardening_caddy_needs_modules | bool

- name: Divert the packaged Caddy binary to caddy.default
  ansible.builtin.command:
    cmd: dpkg-divert --local --divert /usr/bin/caddy.default --rename --add /usr/bin/caddy
    creates: /usr/bin/caddy.default
  when: hardening_caddy_needs_modules | bool

- name: Register both Caddy binaries as alternatives (the custom build is selected)
  community.general.alternatives:
    name: caddy
    link: /usr/bin/caddy
    path: "{{ item.path }}"
    priority: "{{ item.priority }}"
    state: "{{ item.state }}"
  loop:
    - { path: /usr/bin/caddy.default, priority: 10, state: present }
    - { path: /usr/bin/caddy.custom, priority: 50, state: selected }
  loop_control:
    label: "{{ item.path }}"
  when: hardening_caddy_needs_modules | bool

- name: List the modules of the Caddy binary in use
  ansible.builtin.command:
    cmd: caddy list-modules --skip-standard
  register: hardening_caddy_modules_final
  changed_when: false
  failed_when: >-
    hardening_caddy_modules_final.rc != 0
    or 'dns.providers.route53' not in hardening_caddy_modules_final.stdout
    or 'http.handlers.crowdsec' not in hardening_caddy_modules_final.stdout

- name: Create Caddy directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: caddy
    group: caddy
    mode: "0750"
  loop: [/var/log/caddy, /etc/caddy/snippets]

- name: Install the Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: caddy
    mode: "0640"
  notify: Reload caddy

- name: Install the empty denylist snippet (fail2ban rewrites it)
  ansible.builtin.copy:
    content: "# IPs banned by fail2ban; regenerated by /usr/local/sbin/docmatch-caddy-denylist\n"
    dest: /etc/caddy/snippets/denylist.caddy
    owner: root
    group: caddy
    mode: "0640"
    force: false

- name: Install the denylist renderer
  ansible.builtin.copy:
    src: docmatch-caddy-denylist.sh
    dest: /usr/local/sbin/docmatch-caddy-denylist
    owner: root
    group: root
    mode: "0750"

- name: Create the Caddy drop-in directory first
  ansible.builtin.file:
    path: /etc/systemd/system/caddy.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Harden the Caddy unit
  ansible.builtin.template:
    src: caddy-override.conf.j2
    dest: /etc/systemd/system/caddy.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Validate the Caddyfile
  ansible.builtin.command:
    cmd: caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
  environment:
    DM_DOMAIN: example.invalid
    DM_ORIGIN_SECRET_HEADER: x-docmatch-origin-secret
    DM_VIEWER_IP_HEADER: x-docmatch-viewer-ip
    DM_ORIGIN_SECRET: build-time-placeholder
    DM_ROUTE53_ZONE_ID: Z0000000000000000000
    DM_ALERT_EMAIL: root@example.invalid
    AWS_REGION: us-east-1
    CROWDSEC_BOUNCER_KEY: build-time-placeholder
  changed_when: false

# Validation opens the log writers, so as root it leaves root-owned caddy.log and access.log
# behind and the caddy user can no longer open them ("permission denied" at the first boot).
- name: Remove the log files the validation created as root
  ansible.builtin.command:
    cmd: find /var/log/caddy -maxdepth 1 -type f -user root -delete
  changed_when: false

- name: Keep Caddy disabled in the image (user-data enables it on the application role)
  ansible.builtin.systemd_service:
    name: caddy
    enabled: false
    daemon_reload: true
