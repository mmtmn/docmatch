---
# Internal variables of the hardening role (not meant to be overridden).
hardening_base_packages:
  - apparmor
  - apparmor-utils
  - apparmor-profiles
  - apparmor-profiles-extra
  - auditd
  - audispd-plugins
  - acct
  - sysstat
  - aide
  - aide-common
  - rkhunter
  - clamav
  - clamav-freshclam
  - chrony
  - nftables
  - fail2ban
  - unattended-upgrades
  - needrestart
  - debsums
  - libpam-pwquality
  - libpam-tmpdir
  - zram-tools
  - tinyproxy
  - lynis
  - jq
  - curl
  - unzip
  - rsync
  - ca-certificates
  - gnupg
  - apt-transport-https
  - python3-apt
  - fwknop-server
  - wireguard-tools
  - openssl

# Network clients, legacy daemons and anything that duplicates a chosen component.
hardening_removed_packages:
  - telnet
  - ftp
  - rsh-client
  - talk
  - ldap-utils
  - nis
  - rpcbind
  - snmpd
  - avahi-daemon
  - cups
  - xinetd
  - inetutils-telnet
  - rsyslog
  - postfix
  - exim4
  - systemd-timesyncd
  - ufw
  - landscape-common
  - popularity-contest
  - byobu
  - screen
  - tmux
  - lxd-installer
  - snap-store

hardening_audit_rules_file: /etc/audit/rules.d/50-docmatch-cis.rules

# Third-party apt sources (deb822, keys verified by fingerprint in packages.yml). Enabled while
# the image is built and disabled again at the end by apt_proxy.yml (see there for why).
hardening_third_party_repos:
  - { name: caddy-stable, uri: "{{ hardening_repo_caddy_url }}", suite: any-version }
  - { name: pgdg, uri: "{{ hardening_repo_pgdg_url }}", suite: "{{ ansible_facts['distribution_release'] }}-pgdg" }
  - { name: crowdsec, uri: "{{ hardening_repo_crowdsec_url }}", suite: "{{ ansible_facts['distribution_release'] }}" }
  - { name: falcosecurity, uri: "{{ hardening_repo_falco_url }}", suite: stable }
