[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[project]
name = "docmatch"
version = "0.2.0"
description = "Cliente oficial da API docmatch"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["docmatch", "documents", "reconciliation", "api-client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://docmatch.com.br"
Documentation = "https://github.com/mmtmn/docmatch/blob/main/sdks/README.md"
Repository = "https://github.com/mmtmn/docmatch"
Issues = "https://github.com/mmtmn/docmatch/issues"

[tool.hatch.build.targets.wheel]
packages = ["docmatch"]

[tool.hatch.build.targets.sdist]
include = ["/docmatch", "/tests", "/examples", "/README.md", "/LICENSE", "/pyproject.toml"]
