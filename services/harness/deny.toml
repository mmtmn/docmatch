# cargo-deny: licenças, advisories, duplicatas e fontes das dependências do harness.
# Rode `cargo deny check` dentro de services/harness (o `make ci` já faz isso).

[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]
all-features = false

[output]
feature-depth = 1

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Dependências transitivas sem manutenção só avisam; as diretas do workspace falham.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "Zlib",
  "OpenSSL",
  "0BSD",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = true

[bans]
# Duas versões major do mesmo crate falham a build; as exceções abaixo são transitivas
# (puxadas por arrow/duckdb, reqwest e proptest) e saem da lista quando o ecossistema alinhar.
multiple-versions = "deny"
wildcards = "deny"
# Os crates do workspace são privados (publish = false) e se referenciam por path.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
# Famílias de crates onde uma segunda versão major é proibida (a mais comum fonte de binários inchados).
deny = [
  { crate = "openssl", reason = "TLS é sempre rustls; nada de OpenSSL ligado dinamicamente" },
  { crate = "openssl-sys", reason = "TLS é sempre rustls" },
  { crate = "native-tls", reason = "TLS é sempre rustls" },
]
skip = [
  { crate = "base64@0.22.1", reason = "duckdb/arrow ainda em base64 0.22; reqwest já em 0.23" },
  { crate = "getrandom@0.2.17", reason = "proptest/rand_xorshift em getrandom 0.2" },
  { crate = "getrandom@0.3.4", reason = "rustls/ring em getrandom 0.3; rand 0.10 em 0.4" },
  { crate = "hashbrown@0.15.5", reason = "indexmap em hashbrown 0.15; arrow em 0.17" },
  { crate = "syn@2.0.119", reason = "macros de derive em syn 2; serde-saphyr em syn 3" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
