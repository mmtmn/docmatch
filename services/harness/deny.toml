# cargo-deny: licenças, advisories, duplicatas e fontes das dependências do harness.
# Rode `cargo deny check` dentro de services/harness (o `make ci` já faz isso).

[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]
all-features = false

[output]
feature-depth = 1

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Dependências transitivas sem manutenção só avisam; as diretas do workspace falham.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "Zlib",
  "OpenSSL",
  "0BSD",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Os crates do workspace são privados (publish = false) e se referenciam por path.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
# Famílias de crates onde uma segunda versão major é proibida (a mais comum fonte de binários inchados).
deny = [
  { crate = "openssl", reason = "TLS é sempre rustls; nada de OpenSSL ligado dinamicamente" },
  { crate = "openssl-sys", reason = "TLS é sempre rustls" },
  { crate = "native-tls", reason = "TLS é sempre rustls" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
