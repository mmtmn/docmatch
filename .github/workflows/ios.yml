# Execução opcional manual. O portão obrigatório é local; push/PR não inicia runner.
# As telas do app iOS só compilam num Mac: este workflow as compila no runner macOS do GitHub
# quando apps/ios muda. Ninguém espera por ele; os testes do DocmatchKit rodam localmente (no
# Linux, num contêiner Swift) antes de cada push.
name: ios

on:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: xcodegen
        run: brew install xcodegen

      - name: DocmatchKit
        working-directory: apps/ios/DocmatchKit
        run: swift test

      - name: app (simulador, sem assinatura)
        run: make -C apps/ios app
